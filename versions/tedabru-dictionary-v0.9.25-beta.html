            renderFilterBar();
            renderList();
          } },
      ]
    });
  }

  // кнопка в шапке работает по-разному в зависимости от режима: обычно —
  // включает встроенное добавление слова, в режиме выделения — удаляет
  // выбранное, в режиме добавления/редактирования базы/тренировки — сама же
  // из него выходит (см. updateHeaderForSelectionMode)
  primaryActionBtn.addEventListener('click', () => {
    if (selectionMode) { performBulkDelete(); return; }
    if (addMode) { exitAddMode(); return; }
    if (editDbMode) { exitEditDbMode(); return; }
    if (trainMode) { exitTrainMode(); return; }
    enterAddMode();
  });

  document.getElementById('editDbBtn').addEventListener('click', () => {
    if (selectionMode || addMode || trainMode) return; // не пересекаемся с другими режимами
    if (editDbMode) { exitEditDbMode(); return; }
    enterEditDbMode();
  });

  function assignSelectedToCollection(collectionId) {
    words.forEach(w => {
      if (selectedIds.has(w.id)) {
        w.collectionIds = w.collectionIds || [];
        if (!w.collectionIds.includes(collectionId)) w.collectionIds.push(collectionId);
      }
    });
    saveWords();
    exitSelectionMode();
    renderFilterBar();
    renderList();
  }

  // Слова, у которых искомое значение уже стоит — просто пропускаются
  // (присвоение того же значения — no-op), остальным присваивается новое
  function assignFavoriteToSelected() {
    words.forEach(w => { if (selectedIds.has(w.id)) w.favorite = true; });
    saveWords();
    exitSelectionMode();
    renderFilterBar();
    renderList();
  }

  // ===== Два раздельных жеста в режиме выделения =====
  // Зона статуса/слова/транскрипции — "выделение": тянешь вниз/вверх, строки
  // под пальцем добавляются в выделение (как в приложении "Фото" на iOS).
  // Зона перевода и номера — "перетаскивание": хватаешь ТЕКУЩЕЕ выделение
  // (если строка ещё не выделена — выделяем и её тоже) и тащишь на чип
  // подборки / "+ новая подборка" / корзину в шапке; во время этого жеста
  // наведение на другие строки уже не меняет выделение — это раздельные вещи.
  let dragSession = null; // { pointerId, type: 'select'|'move', mode, lastRowId, dropTarget }

  function applyRowSelection(id, shouldSelect, row) {
    if (shouldSelect) selectedIds.add(id); else selectedIds.delete(id);
    if (row) {
      row.classList.toggle('row-selected', shouldSelect);
      const iconEl = row.querySelector('.icon-btn');
      if (iconEl) iconEl.innerHTML = shouldSelect ? CHECK_ON_ICON : CHECK_OFF_ICON;
    }
    if (selectionMode) headerTitleEl.textContent = selectionHeaderText();
  }

  // Зона "перетаскивания" — всё, что НЕ является чекбоксом/словом/
  // транскрипцией (то есть перевод, номер строки, и пустые ячейки-заполнители
  // между ними) — по умолчанию это зона перетаскивания, а не наоборот, иначе
  // клики по пустым ячейкам-заполнителям ошибочно засчитывались как "выделение"
  function isDragZone(target) {
    if (target.closest('.icon-btn') || target.closest('.hebrew-word') || target.closest('.meta-col')) return false;
    return true;
  }

  // Находит валидную "цель сброса" под указателем — чип конкретной подборки,
  // чип "+ новая подборка", чип "Избранное" или кнопку-корзину в шапке (она
  // помечена data-drop-delete только пока активен режим выделения)
  function getDropTargetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const deleteBtn = el.closest('[data-drop-delete]');
    if (deleteBtn) return { type: 'delete', el: deleteBtn };
    const newCollChip = el.closest('#newCollectionChip');
    if (newCollChip) return { type: 'new-collection', el: newCollChip };
    const collChip = el.closest('[data-coll]');
    if (collChip && collChip.dataset.coll) return { type: 'collection', id: collChip.dataset.coll, el: collChip };
    const favChip = el.closest('#favChip');
    if (favChip) return { type: 'favorite', el: favChip };
    return null;
  }

  function clearDropHighlight() {
    document.querySelectorAll('.drop-hover').forEach(el => el.classList.remove('drop-hover'));
  }

  const dragGhostEl = document.getElementById('dragGhost');
  const dragGhostWordEl = document.getElementById('dragGhostWord');
  const dragGhostBadgeEl = document.getElementById('dragGhostBadge');

  function showDragGhost(word, count, x, y) {
    dragGhostWordEl.textContent = word;
    if (count > 1) {
      dragGhostBadgeEl.textContent = count;
      dragGhostBadgeEl.classList.add('visible');
    } else {
      dragGhostBadgeEl.classList.remove('visible');
    }
    moveDragGhost(x, y);
  }

  function moveDragGhost(x, y) {
    // смещаем "призрак" чуть выше и левее пальца, чтобы сама карточка не
    // пряталась под ним — так же ведут себя системные drag-превью
    dragGhostEl.style.transform = `translate(${x}px, ${y}px) translate(-50%, -130%)`;
  }

  function hideDragGhost() {
    dragGhostEl.style.transform = 'translate(-9999px, -9999px)';
  }

  // "Отрываем" от полотна карточки, которые сейчас перетаскиваются —
  // визуально гасим их, пока идёт жест
  function setDraggingSourceRows(active) {
    wordListEl.querySelectorAll('.word-row.selectable.row-selected').forEach(row => {
      row.classList.toggle('dragging-source', active);
    });
  }

  wordListEl.addEventListener('pointerdown', (e) => {
    if (!selectionMode) return;
    const row = e.target.closest('.word-row.selectable');
    if (!row) return;
    const id = parseInt(row.dataset.id);

    if (isDragZone(e.target)) {
      // зона перетаскивания реагирует ТОЛЬКО на уже выделённые карточки —
      // если карточка не выделена, ничего не происходит вовсе: остальное
      // выделение остаётся как было, и никакого драга не начинается
      if (!selectedIds.has(id)) return;
      dragSession = { pointerId: e.pointerId, type: 'move', dropTarget: null, hoveredElement: null };
      document.body.style.cursor = 'grabbing';
      setDraggingSourceRows(true);
      showDragGhost(row.querySelector('.hebrew-word').textContent, selectedIds.size, e.clientX, e.clientY);
    } else {
      // "выделение" — тянем по строкам, переключая их
      const willSelect = !selectedIds.has(id);
      applyRowSelection(id, willSelect, row);
      dragSession = { pointerId: e.pointerId, type: 'select', mode: willSelect, lastRowId: id, dropTarget: null, hoveredElement: null };
    }
    try { wordListEl.setPointerCapture(e.pointerId); } catch (err) { /* не критично */ }
  });

  wordListEl.addEventListener('pointermove', (e) => {
    if (!dragSession || dragSession.pointerId !== e.pointerId) return;
    e.preventDefault(); // не даём странице скроллиться во время жеста

    if (dragSession.type === 'move') {
      moveDragGhost(e.clientX, e.clientY);
    }

    if (dragSession.type === 'select') {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const rowEl = el && el.closest && el.closest('.word-row.selectable');
      if (rowEl) {
        if (dragSession.dropTarget) { clearDropHighlight(); dragSession.dropTarget = null; dragSession.hoveredElement = null; }
        const id = parseInt(rowEl.dataset.id);
        if (id !== dragSession.lastRowId) {
          dragSession.lastRowId = id;
          applyRowSelection(id, dragSession.mode, rowEl);
        }
        return;
      }
    }
    // и для 'select' (палец ушёл за пределы строк), и для 'move' — проверяем
    // цель сброса под указателем; трогаем DOM только если цель сменилась
    // (см. ту же оптимизацию для перетаскивания подборок)
    const target = getDropTargetAt(e.clientX, e.clientY);
    const newHoverEl = target ? target.el : null;
    if (newHoverEl !== dragSession.hoveredElement) {
      clearDropHighlight();
      if (newHoverEl) newHoverEl.classList.add('drop-hover');
      dragSession.hoveredElement = newHoverEl;
    }
    dragSession.dropTarget = target;
  });

  function endDragSession(e) {
    if (!dragSession || dragSession.pointerId !== e.pointerId) return;
    const wasMove = dragSession.type === 'move';
    const target = dragSession.dropTarget;
    clearDropHighlight();
    document.body.style.cursor = '';
    try { wordListEl.releasePointerCapture(e.pointerId); } catch (err) { /* не критично */ }
    dragSession = null;
    if (wasMove) {
      hideDragGhost();
      setDraggingSourceRows(false); // если сброс сработает, renderList() всё равно всё перерисует; если нет — возвращаем карточки на место
    }
    if (target && selectedIds.size) {
      if (target.type === 'collection') {
        assignSelectedToCollection(target.id);
      } else if (target.type === 'new-collection') {
        createCollectionViaModal((nc) => assignSelectedToCollection(nc.id));
      } else if (target.type === 'favorite') {
        assignFavoriteToSelected();
      } else if (target.type === 'delete') {
        performBulkDelete();
      }
    }
  }
  wordListEl.addEventListener('pointerup', endDragSession);
  wordListEl.addEventListener('pointercancel', endDragSession);

  // ===== Долгое удержание карточки (вне режима выделения) =====
  // Держишь ~800мс на карточке — она выделяется, включается режим выделения
  // и СРАЗУ подхватывается её drag-сессия (как будто схватили за зону
  // перетаскивания), не отпуская палец — чтобы управлять одной карточкой
  // без явного захода в мультивыделение через галочку в шапке.
  const LONG_PRESS_MS = 500;
  const LONG_PRESS_TOLERANCE = 10; // px — движение больше этого отменяет long-press
  let longPressTimer = null;
  let longPressPointerId = null;
  let longPressStartX = 0, longPressStartY = 0;
  let suppressNextClick = false;

  function cancelLongPress() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  }

  wordListEl.addEventListener('pointerdown', (e) => {
    if (selectionMode) return; // тут уже работает обычный обработчик выделения выше
    if (e.target.closest('.listen-btn') || e.target.closest('.favorite-btn') ||
        e.target.closest('.delete-btn')) return;
    const row = e.target.closest('.word-row');
    if (!row || row.classList.contains('row-deleting')) return;
    const id = parseInt(row.dataset.id);
    if (!id) return;
    longPressPointerId = e.pointerId;
    longPressStartX = e.clientX;
    longPressStartY = e.clientY;
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      selectionMode = true;
      selectedIds = new Set([id]);
      selectModeBtn.classList.add('active');
      updateHeaderForSelectionMode();
      renderList();

      const newRow = wordListEl.querySelector(`.word-row.selectable[data-id="${id}"]`);
      if (newRow) {
        dragSession = { pointerId: longPressPointerId, type: 'move', dropTarget: null, hoveredElement: null };
        document.body.style.cursor = 'grabbing';
        setDraggingSourceRows(true);
        showDragGhost(newRow.querySelector('.hebrew-word').textContent, 1, longPressStartX, longPressStartY);
        try { wordListEl.setPointerCapture(longPressPointerId); } catch (err) { /* не критично */ }
      }
      // после такого удержания браузер может ещё синтезировать 'click' по
      // уже пересозданной (и поэтому отсоединённой) кнопке старой карточки —
      // глушим ближайший click, чтобы он не дёрнул статус/избранное/удаление
      suppressNextClick = true;
      setTimeout(() => { suppressNextClick = false; }, 500);
    }, LONG_PRESS_MS);
  });

  wordListEl.addEventListener('pointermove', (e) => {
    if (!longPressTimer || e.pointerId !== longPressPointerId) return;
    const dx = e.clientX - longPressStartX;
    const dy = e.clientY - longPressStartY;
    if (Math.sqrt(dx * dx + dy * dy) > LONG_PRESS_TOLERANCE) cancelLongPress();
  });
  wordListEl.addEventListener('pointerup', cancelLongPress);
  wordListEl.addEventListener('pointercancel', cancelLongPress);

  // капчур-фаза — перехватывает click ДО того, как он дойдёт до кнопки
  // статуса/избранного/удаления внутри исходной (уже пересозданной) карточки
  wordListEl.addEventListener('click', (e) => {
    if (suppressNextClick) {
      suppressNextClick = false;
      e.stopPropagation();
      e.preventDefault();
    }
  }, true);

  // ===== Перетаскивание чипов подборок: удаление и слияние =====
  // Тащишь чип подборки — она "отрывается" и следует за пальцем (тот же
  // drag-ghost, что и у слов), СРАЗУ по факту движения, без задержки: клик
  // без сдвига по-прежнему просто фильтрует/выделяет (см. отдельные
  // click-обработчики в renderFilterBar), а любое движение за порог сразу
  // запускает перетаскивание. Дотянул до корзины (кнопка в шапке временно
  // превращается в неё на время этого жеста) — предлагается выбор удаления;
  // дотянул до ДРУГОЙ подборки — предлагается слияние, а сама подборка-цель
  // визуально "раздвигается" под наведением.
  const filterBarEl = document.getElementById('filterBar');
  const COLLECTION_DRAG_MOVE_THRESHOLD = 10; // px — сдвиг больше этого сразу запускает драг
  let collectionDragArmedChip = null; // чип, за который держимся, пока не подтвердилось — драг это или просто клик
  let collectionDragArmedPointerId = null;
  let collectionDragArmedStartX = 0, collectionDragArmedStartY = 0;
  let collectionDragSession = null; // { pointerId, collectionId, chipEl, dropTarget }

  function cancelCollectionDragArm() {
    collectionDragArmedChip = null;
  }

  function clearCollectionHoverWiden() {
    document.querySelectorAll('.coll-drop-widen').forEach(el => el.classList.remove('coll-drop-widen'));
  }

  function showHeaderAsDeleteTarget() {
    primaryActionBtn.innerHTML = TRASH_ICON;
    primaryActionBtn.classList.remove('header-icon-btn-gold');
    primaryActionBtn.classList.add('header-icon-btn-danger');
    primaryActionBtn.setAttribute('data-drop-delete', '1');
  }

  function restoreHeaderAfterCollectionDrag() {
    if (selectionMode) { updateHeaderForSelectionMode(); return; }
    primaryActionBtn.innerHTML = PLUS_ICON;
    primaryActionBtn.classList.remove('header-icon-btn-danger');
    primaryActionBtn.classList.add('header-icon-btn-gold');
    primaryActionBtn.title = 'Добавить слово';
    primaryActionBtn.removeAttribute('data-drop-delete');
  }

  function showDeleteCollectionsModal(collectionIds) {
    const names = collectionIds.map(id => { const c = collections.find(cc => cc.id === id); return c ? c.name : null; }).filter(Boolean);
    if (!names.length) return;
    const many = names.length > 1;
    const idSet = new Set(collectionIds);
    const hasAnyWords = words.some(w => (w.collectionIds || []).some(cid => idSet.has(cid)));

    if (!hasAnyWords) {
      // подборка(и) пустая — спрашивать нечего (нет слов, значит нет и
      // выбора "и слова тоже"), удаляем сразу
      deleteCollections(collectionIds, false);
      showToast(many ? t('Пустые подборки удалены') : t('Пустая подборка удалена'));
      return;
    }

    showActionModal({
      title: many
        ? (currentLang === 'en' ? `Delete ${names.length} collections (${names.join(', ')})?` : `Удалить ${names.length} подборки (${names.join(', ')})?`)
        : (currentLang === 'en' ? `Delete the collection "${names[0]}"?` : `Удалить подборку «${names[0]}»?`),
      buttons: [
        { label: t('Отмена'), variant: 'cancel' },
        { label: many ? t('Удалить подборки (слова останутся)') : t('Удалить подборку (слова останутся)'), action: () => deleteCollections(collectionIds, false) },
        { label: many ? t('Удалить подборки и слова') : t('Удалить подборку и слова'), variant: 'danger', action: () => deleteCollections(collectionIds, true) },
      ]
    });
  }

  function deleteCollections(collectionIds, alsoDeleteWords) {
    const idSet = new Set(collectionIds);
    if (alsoDeleteWords) {
      words = words.filter(w => !(w.collectionIds || []).some(cid => idSet.has(cid)));
    } else {
      words.forEach(w => {
        if (w.collectionIds) w.collectionIds = w.collectionIds.filter(cid => !idSet.has(cid));
      });
    }
    collections = collections.filter(c => !idSet.has(c.id));
    if (filterCollectionId && idSet.has(filterCollectionId)) filterCollectionId = null;
    selectedCollectionIds = new Set();
    if (selectionMode) exitSelectionMode();
    saveWords();
    saveCollections();
    renderFilterBar();
    renderList();
  }

  function showMergeCollectionsModal(sourceIds, targetId) {
    const sources = sourceIds.map(id => collections.find(c => c.id === id)).filter(Boolean);
    const target = collections.find(c => c.id === targetId);
    if (!sources.length || !target) return;
    const sourceNames = sources.map(s => s.name).join(', ');
    showActionModal({
      title: t('Объединить подборки?'),
      message: currentLang === 'en'
        ? `"${sourceNames}" and "${target.name}" will become one collection, "${target.name}".`
        : `«${sourceNames}» и «${target.name}» станут одной подборкой «${target.name}».`,
      buttons: [
        { label: t('Нет'), variant: 'cancel' },
        { label: t('Да'), variant: 'primary', action: () => mergeCollections(sourceIds, targetId) },
      ]
    });
  }

  function mergeCollections(sourceIds, targetId) {
    const sourceIdSet = new Set(sourceIds);
    words.forEach(w => {
      if (w.collectionIds && w.collectionIds.some(cid => sourceIdSet.has(cid))) {
        w.collectionIds = w.collectionIds.filter(cid => !sourceIdSet.has(cid));
        if (!w.collectionIds.includes(targetId)) w.collectionIds.push(targetId);
      }
    });
    collections = collections.filter(c => !sourceIdSet.has(c.id));
    if (filterCollectionId && sourceIdSet.has(filterCollectionId)) filterCollectionId = targetId;
    selectedCollectionIds = new Set();
    if (selectionMode) exitSelectionMode();
    saveWords();
    saveCollections();
    renderFilterBar();
    renderList();
  }

  function handleCollectionDragMove(e) {
    if (!collectionDragSession || collectionDragSession.pointerId !== e.pointerId) return;
    e.preventDefault();
    moveDragGhost(e.clientX, e.clientY);

    const el = document.elementFromPoint(e.clientX, e.clientY);
    let newTarget = null;
    let newHoverEl = null;
    if (el) {
      const deleteBtn = el.closest('[data-drop-delete]');
      if (deleteBtn) {
        newTarget = { type: 'delete' };
        newHoverEl = deleteBtn;
      } else {
        const otherChip = el.closest('[data-coll]');
        if (otherChip && otherChip.dataset.coll && !collectionDragSession.collectionIds.includes(otherChip.dataset.coll)) {
          newTarget = { type: 'merge', id: otherChip.dataset.coll };
          newHoverEl = otherChip;
        }
      }
    }

    // трогаем DOM/классы ТОЛЬКО если цель реально сменилась — иначе снятие+
    // навешивание класса на каждый pointermove перезапускает CSS-transition,
    // и чип начинает дёргаться (сужаться-расширяться), даже стоя на месте
    if (newHoverEl !== collectionDragSession.hoveredElement) {
      clearDropHighlight();
      clearCollectionHoverWiden();
      if (newHoverEl) {
        newHoverEl.classList.add(newTarget.type === 'delete' ? 'drop-hover' : 'coll-drop-widen');
      }
      collectionDragSession.hoveredElement = newHoverEl;
    }
    collectionDragSession.dropTarget = newTarget;
  }

  function endCollectionDrag(e) {
    if (!collectionDragSession || collectionDragSession.pointerId !== e.pointerId) return;
    const target = collectionDragSession.dropTarget;
    const draggedIds = collectionDragSession.collectionIds;
    clearDropHighlight();
    clearCollectionHoverWiden();
    hideDragGhost();
    document.body.style.cursor = '';
    try { filterBarEl.releasePointerCapture(e.pointerId); } catch (err) { /* не критично */ }
    filterBarEl.removeEventListener('pointermove', handleCollectionDragMove);
    filterBarEl.removeEventListener('pointerup', endCollectionDrag);
    filterBarEl.removeEventListener('pointercancel', endCollectionDrag);
    collectionDragSession = null;
    restoreHeaderAfterCollectionDrag();
    renderFilterBar(); // снимает dragging-source с чипов

    if (target) {
      if (target.type === 'delete') showDeleteCollectionsModal(draggedIds);
      else if (target.type === 'merge') showMergeCollectionsModal(draggedIds, target.id);
    }
  }

  // collectionIds — массив: обычно один элемент (перетаскивание отдельной
  // подборки вне режима выделения), но в режиме мультивыделения это ВСЕ
  // сейчас выделенные подборки разом
  function startCollectionDrag(collectionIds, chipEl, pointerId, x, y) {
    const names = collectionIds.map(id => { const c = collections.find(cc => cc.id === id); return c ? c.name : null; }).filter(Boolean);
    if (!names.length) return;
    collectionDragSession = { pointerId, collectionIds, dropTarget: null, hoveredElement: null };
    document.body.style.cursor = 'grabbing';
    filterBarEl.querySelectorAll('[data-coll]').forEach(el => {
      if (collectionIds.includes(el.dataset.coll)) el.classList.add('dragging-source');
    });
    showDragGhost(names[0], names.length, x, y);
    showHeaderAsDeleteTarget();
    try { filterBarEl.setPointerCapture(pointerId); } catch (err) { /* не критично */ }
    filterBarEl.addEventListener('pointermove', handleCollectionDragMove);
    filterBarEl.addEventListener('pointerup', endCollectionDrag);
    filterBarEl.addEventListener('pointercancel', endCollectionDrag);
  }

  filterBarEl.addEventListener('pointerdown', (e) => {
    const chip = e.target.closest('[data-coll]');
    if (!chip || !chip.dataset.coll) return;
    if (selectionMode) {
      // в режиме выделения драг стартует только с УЖЕ выделенной подборки —
      // сам клик (добавление/снятие из выделения) обрабатывает отдельный
      // click-listener в renderFilterBar; здесь только готовимся к
      // перетаскиванию текущего мультивыделения целиком
      if (!selectedCollectionIds.has(chip.dataset.coll)) return;
    }
    collectionDragArmedChip = chip;
    collectionDragArmedPointerId = e.pointerId;
    collectionDragArmedStartX = e.clientX;
    collectionDragArmedStartY = e.clientY;
  });
  filterBarEl.addEventListener('pointermove', (e) => {
    if (!collectionDragArmedChip || e.pointerId !== collectionDragArmedPointerId) return;
    const dx = e.clientX - collectionDragArmedStartX;
    const dy = e.clientY - collectionDragArmedStartY;
    if (Math.sqrt(dx * dx + dy * dy) <= COLLECTION_DRAG_MOVE_THRESHOLD) return;
    const chip = collectionDragArmedChip;
    collectionDragArmedChip = null;
    const ids = (selectionMode && selectedCollectionIds.size)
      ? Array.from(selectedCollectionIds)
      : [chip.dataset.coll];
    startCollectionDrag(ids, chip, e.pointerId, collectionDragArmedStartX, collectionDragArmedStartY);
    // слушатель pointermove внутри startCollectionDrag подключается уже ПОСЛЕ
    // того, как текущее событие начало обрабатываться — на само это событие
    // он не сработает (слушатели, добавленные во время диспетчеризации, не
    // применяются к событию, которое сейчас обрабатывается). Поэтому сразу
    // же обрабатываем текущую позицию вручную, иначе первая же точка, где
    // превышен порог движения, "теряется" для определения цели сброса.
    handleCollectionDragMove(e);
  });
  filterBarEl.addEventListener('pointerup', cancelCollectionDragArm);
  filterBarEl.addEventListener('pointercancel', cancelCollectionDragArm);

  // ===== Поиск / встроенное добавление слова (тот же инпут, два режима) =====
  document.getElementById('searchInput').addEventListener('input', (e) => {
    if (addMode) {
      // Живой подбор по мере ввода — та же логика, что уже работает в обычном
      // поиске (см. runInstantDictSearch), только с задержкой в 400мс: словарный
      // путь внутри resolveCandidates мгновенный (без сети), а вот фоллбэк на
      // Nakdan/DeepL/Gemini реально ходит в сеть — задержка не даёт запускать
      // сетевой запрос на каждую нажатую букву, только когда набор паузится
      const raw = e.target.value.trim();
      clearTimeout(metaSuggestDebounceTimer);
      if (!raw) {
        nikkudSuggestion.classList.remove('visible', 'error');
        nikkudSuggestion.innerHTML = '';
        return;
      }
      metaSuggestDebounceTimer = setTimeout(() => runMetaSuggestion(raw), 400);
      return;
    }
    if (editDbMode) {
      // тут ищем только по уже загруженным в память данным (никакой сети),
      // поэтому дебаунс не нужен вовсе — мгновенно на каждую букву
      renderEditDbResults(e.target.value.trim());
      return;
    }
    searchQuery = e.target.value;
    renderList();
  });

  // ===== DeepL API: перевод конкретной огласовки на русский =====
  // В отличие от Google Translate, DeepL действительно различает разные
  // огласовки одного и того же написания (мидбар/медабер переводятся
  // по-разному) — это же попутно решает и часть проблемы неоднозначности:
  // если у кандидата вылезет случайный/бессмысленный перевод, вручную
  // видно, что это не тот вариант.
  const DEEPL_URL = 'https://deepltranslate.3an3arah.workers.dev/';

  async function translateHebrewToCurrentLang(hebrewText) {
    const targetLang = currentLang === 'en' ? 'EN' : 'RU';
    const response = await fetch(DEEPL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: [hebrewText],
        target_lang: targetLang
      })
    });
    if (!response.ok) throw new Error('DeepL ответил ошибкой: ' + response.status);
    const json = await response.json();
    return (json.translations && json.translations[0] && json.translations[0].text) || null;
  }

  // ===== Словари Wiktionary (kaikki.org), обработанные под наш пайплайн =====
  // Два индекса: по голому скелету иврита (без огласовок — Nakdan и
  // Wiktionary могут по-разному их расставить, скелет сравнивать надёжнее)
  // и обратный, русский → иврит. Обратные индексы (hebrewDictReverse,
  // verbsReverse) теперь НЕ отдельные файлы — раньше это были
  // hebrew_dict_v3_reverse.json/verbs_reverse.json, которые приходилось
  // синхронно поддерживать вручную при каждой правке прямого файла (и не
  // всегда получалось). Строим их на лету при загрузке — см. buildReverseIndex.
  // DeepL остаётся фоллбэком только для того, чего нет ни в одной из баз.
  // Глаголы из ЭТИХ файлов убраны — для них теперь отдельная, авторитетная
  // база (verbsDict/verbsReverse), собранная вручную, где ключевое слово —
  // именно инфинитив, а не смешение форм от Wiktionary.
  // Раньше данные о лемме (перевод/порода) для спрягаемых форм подтягивались
  // из отдельного файла wiktionary_verb_lemmas.json во время поиска — теперь
  // они уже вшиты прямо в каждую запись hebrewVerbForms (lemma_word,
  // lemma_gloss_ru, lemma_binyan, lemma_root, lemma_inf), отдельный файл не нужен.
  let hebrewDictSkeleton = null;
  let hebrewDictReverse = null;
  let hebrewDictReverseEn = null;
  let hebrewVerbForms = null;
  let verbsDict = null;
  let verbsDictEn = null;
  let verbsReverse = null;
  let verbsReverseEn = null;
  let translitIndex = null;
  let nounFormsIndex = null;
  let generatedVerbForms = null;
  let functionWordForms = null;
  let functionWordFormsReverse = null;
  let functionWordFormsReverseEn = null;
  let hebrewDictLoadPromise = null;
  let hebrewDictEntrySkeleton = null; // WeakMap: запись -> её скелет-ключ (для редактора базы)
  let verbsEntrySkeleton = null;
  let hebrewDictKeyCountAtLoad = null; // снимок на момент загрузки — для грубой проверки конфликтов при сохранении
  let verbsDictKeyCountAtLoad = null;

  // Раньше *_reverse.json собирался офлайн питон-скриптом — вот тот же
  // алгоритм (проверен построчно на всей текущей базе, 0 расхождений),
  // портированный в JS, чтобы строить индекс на лету при каждой загрузке
  // страницы вместо хранения отдельного файла, который легко рассинхронить
  // с прямым при ручной правке.
  function deriveReverseKeys(text) {
    if (!text) return [];
    const segments = text.split(/[,;]/);
    const keys = [];
    for (const rawSeg of segments) {
      const seg = rawSeg.trim();
      const parenIdx = seg.indexOf('(');
      if (parenIdx !== -1) {
        // сегмент со скобкой — берём текст ДО скобки как ключ и на этом
        // останавливаемся совсем (все следующие сегменты игнорируются) —
        // именно так вело себя оригинальное поведение генератора
        let head = seg.slice(0, parenIdx).trim();
        head = head.replace(/[.,:;!?]+$/, '').trim();
        if (head.length >= 2) keys.push(head.toLowerCase());
        break;
      }
      let plain = seg.replace(/[.,:;!?]+$/, '').trim();
      if (plain.length >= 2) keys.push(plain.toLowerCase());
    }
    // плюс отдельные слова из МНОГОСЛОВНЫХ ключей — чтобы запрос "шум" нашёл
    // и статью с переводом "шум давар", а не только точное совпадение целиком.
    // Слова короче 3 букв пропускаем — иначе предлоги/союзы вроде "и"/"в"/"не"
    // заполонили бы индекс случайными совпадениями
    const wordKeys = [];
    for (const key of keys) {
      if (!key.includes(' ')) continue;
      for (const word of key.split(/\s+/)) {
        const w = word.replace(/[.,:;!?]+$/, '');
        if (w.length >= 3 && !keys.includes(w) && !wordKeys.includes(w)) wordKeys.push(w);
      }
    }
    return keys.concat(wordKeys);
  }

  function buildReverseIndex(forwardDict, textField) {
    const reverse = {};
    for (const skeleton in forwardDict) {
      for (const entry of forwardDict[skeleton]) {
        const keys = deriveReverseKeys(entry[textField]);
        for (const key of keys) {
          if (!reverse[key]) reverse[key] = [];
          reverse[key].push(entry); // тот же объект, копировать не нужно — используемые поля идентичны
        }
      }
    }
    return reverse;
  }

  function buildEntrySkeletonMap(forwardDict) {
    const map = new WeakMap();
    for (const skeleton in forwardDict) {
      for (const entry of forwardDict[skeleton]) {
        map.set(entry, skeleton);
      }
    }
    return map;
  }

  function stripNiqqud(word) {
    return (word || '').replace(/[\u0591-\u05C7]/g, '').replace(/\|/g, '');
  }

  // ===== Варианты "краткого" (ktiv-chaser) написания из "полного" (ktiv-male) =====
  //
  // Формы в наших индексах строятся снятием никуда с ОГЛАСОВАННОГО слова, а
  // огласовки вроде холам записываются точкой НАД буквой, без отдельной буквы
  // вав — то есть скелет получается "кратким" (אכתב). Но человек почти всегда
  // печатает слово так, как оно реально пишется без никуда в современном
  // иврите — "полным" письмом (אכתוב, с вав для "о"), как и делает сам Пеалим
  // (у него для этого есть отдельная "тильда"-запись). Без учёта этого разрыва
  // такие слова не находятся вовсе, хотя формально есть в базе.
  //
  // Генерируем варианты, убирая ВНУТРЕННИЕ (не первую и не последнюю букву —
  // на краях вав/йуд почти всегда настоящая согласная, а не "мать чтения")
  // вав и йуд по одному и по нескольку сразу, от минимальных изменений к
  // максимальным — так более вероятное (одна лишняя буква) совпадение
  // находится раньше маловероятного (сразу три).
  function generateChaserSkeletonVariants(skeleton) {
    const positions = [];
    for (let i = 1; i < skeleton.length - 1; i++) {
      if (skeleton[i] === 'ו' || skeleton[i] === 'י') positions.push(i);
    }
    if (!positions.length) return [];
    const usable = positions.slice(0, 4); // ограничиваем комбинаторику разумным числом
    const variants = [];
    const seen = new Set([skeleton]);
    for (let mask = 1; mask < (1 << usable.length); mask++) {
      let variant = '';
      for (let i = 0; i < skeleton.length; i++) {
        const posIdx = usable.indexOf(i);
        if (posIdx !== -1 && (mask & (1 << posIdx))) continue; // выкидываем эту букву
        variant += skeleton[i];
      }
      if (!seen.has(variant)) {
        seen.add(variant);
        // считаем количество выкинутых букв — для сортировки по возрастанию
        let removed = 0;
        for (let b = 0; b < usable.length; b++) if (mask & (1 << b)) removed++;
        variants.push({ variant, removed });
      }
    }
    variants.sort((a, b) => a.removed - b.removed);
    return variants.map(v => v.variant);
  }

  // Собирает результаты из всех пяти источников по ОДНОМУ конкретному скелету
  // (без похода в сеть) — общая логика, используемая и при точном совпадении,
  // и при переборе ktiv-male → ktiv-chaser вариантов. Приоритет formHit/genFormHit
  // тот же, что и везде: старый Wiktionary-индекс форм подключаем только если
  // новая авторитетная база ничего не нашла (иначе дубли — "форма от" рядом с
  // "инфинитив: ...").
  function lookupSkeletonSources(skeleton) {
    const dictHit = (hebrewDictSkeleton && hebrewDictSkeleton[skeleton]) || [];
    const genFormHit = (generatedVerbForms && generatedVerbForms[skeleton]) || [];
    const verbHit = (verbsDict && verbsDict[skeleton]) || [];
    // старый Wiktionary-индекс форм подключаем ТОЛЬКО если у этого скелета нет
    // ничего авторитетного вообще — ни в новой базе сгенерированных форм, ни
    // среди самих инфинитивов, ни в основном словаре (сущ/прил и т.п.). Если
    // скелет уже есть где-то из этого — запись "формы" для того же скелета
    // почти наверняка мусор из старой базы (пустой hint, "форма от" со
    // сбитым значением), а не отдельное самостоятельное слово
    const formHit = (genFormHit.length || verbHit.length || dictHit.length) ? [] : ((hebrewVerbForms && hebrewVerbForms[skeleton]) || []);
    const nounFormHit = (nounFormsIndex && nounFormsIndex[skeleton]) || [];
    const functionFormHit = (functionWordForms && functionWordForms[skeleton]) || [];
    return { dictHit, formHit, verbHit, nounFormHit, genFormHit, functionFormHit };
  }

  function hasAnyHit(sources) {
    return sources.dictHit.length || sources.formHit.length || sources.verbHit.length ||
      sources.nounFormHit.length || sources.genFormHit.length || sources.functionFormHit.length;
  }

  // Объединяет кандидатов, которые на самом деле являются РАЗНЫМИ ЗНАЧЕНИЯМИ
  // одного и того же слова (совпадают написание + транскрипция + часть речи),
  // в ОДНУ карточку с пронумерованным списком значений — вместо того, чтобы
  // показывать каждое значение отдельной, визуально неотличимой карточкой,
  // среди которых приходится наугад выбирать, какую вообще сохранить
  // (מטבע = "монета" и "валюта" — это два значения ОДНОГО слова, а не два
  // разных слова). Настоящие разные слова с одинаковым переводом (רכב/מכונית/
  // אוטו = все "автомобиль") группировка не затрагивает — ключ строится по
  // написанию+транскрипции+части речи, а не по переводу.
  function mergeCandidatesBySense(candidates) {
    const order = [];
    const groups = new Map();
    for (const c of candidates) {
      const key = `${c.text}|${c.translit}|${c.grammarLabel || ''}`;
      let group = groups.get(key);
      if (!group) {
        group = { base: c, translations: [] };
        groups.set(key, group);
        order.push(key);
      } else if (!group.base.root && c.root) {
        group.base.root = c.root;
      }
      const t = (c.translation || '').trim();
      if (t && !group.translations.some(x => x.toLowerCase() === t.toLowerCase())) {
        group.translations.push(t);
      }
    }
    const merged = order.map(key => {
      const { base, translations } = groups.get(key);
      let translation;
      if (translations.length <= 1) {
        translation = translations[0] || base.translation || null;
      } else {
        translation = translations.map((t, i) => `${i + 1}. ${t}`).join('; ');
      }
      return { ...base, translation };
    });
    // пессимизация: слова с меткой уст./библ. — в конец списка, а не наравне
    // с современными синонимами (сортировка стабильна — внутри своей группы
    // порядок не меняется, просто архаичные группы целиком уезжают позже)
    return merged.slice().sort((a, b) => (a.register ? 1 : 0) - (b.register ? 1 : 0));
  }

  function buildCombinedFromSources(sources) {
    const combined = [
      ...sources.dictHit.map(buildDictCandidate),
      ...sources.formHit.map(buildVerbFormCandidate),
      ...sources.verbHit.map(buildVerbDictCandidate),
      ...sources.nounFormHit.map(buildNounFormCandidate),
      ...sources.genFormHit.map(buildGeneratedVerbFormCandidate),
      ...sources.functionFormHit.map(buildFunctionWordFormCandidate)
    ];
    return mergeCandidatesBySense(combined);
  }

  // Пробует точный скелет, а если пусто — по очереди ktiv-male → ktiv-chaser
  // варианты (см. generateChaserSkeletonVariants). Возвращает первый непустой
  // набор источников вместе со скелетом, по которому он нашёлся (для лога).
  function lookupSkeletonWithChaserFallback(skeleton) {
    const direct = lookupSkeletonSources(skeleton);
    if (hasAnyHit(direct)) return { sources: direct, matchedSkeleton: skeleton };
    for (const variant of generateChaserSkeletonVariants(skeleton)) {
      const alt = lookupSkeletonSources(variant);
      if (hasAnyHit(alt)) return { sources: alt, matchedSkeleton: variant };
    }
    return { sources: direct, matchedSkeleton: skeleton };
  }

  function loadHebrewDict() {
    if (hebrewDictLoadPromise) return hebrewDictLoadPromise;
    // cache:'no-cache' — не отключает кэш совсем (это было бы расточительно,
    // словари немаленькие), а заставляет браузер каждый раз ПЕРЕСПРОСИТЬ
    // сервер "не изменилось ли что" (условный запрос по ETag), вместо того
    // чтобы молча взять старую закэшированную копию. Без этого правки,
    // сохранённые через "Редактировать базу", могли не долетать до
    // интерфейса даже после обычного обновления страницы.
    const fetchFresh = (url) => fetch(url, { cache: 'no-cache' });
    hebrewDictLoadPromise = Promise.all([
      fetchFresh('hebrew_dict_v3.json').then(r => { if (!r.ok) throw new Error('hebrew_dict_v3.json: ' + r.status); return r.json(); }),
      fetchFresh('hebrew_verb_forms_index.json').then(r => { if (!r.ok) throw new Error('hebrew_verb_forms_index.json: ' + r.status); return r.json(); }),
      fetchFresh('verbs_dict.json').then(r => { if (!r.ok) throw new Error('verbs_dict.json: ' + r.status); return r.json(); }),
      fetchFresh('verbs_dict_en.json').then(r => { if (!r.ok) throw new Error('verbs_dict_en.json: ' + r.status); return r.json(); }),
      fetchFresh('translit_index.json').then(r => { if (!r.ok) throw new Error('translit_index.json: ' + r.status); return r.json(); }),
      fetchFresh('noun_forms_index.json').then(r => { if (!r.ok) throw new Error('noun_forms_index.json: ' + r.status); return r.json(); }),
      fetchFresh('generated_verb_forms.json').then(r => { if (!r.ok) throw new Error('generated_verb_forms.json: ' + r.status); return r.json(); }),
      fetchFresh('function_word_forms_index.json').then(r => { if (!r.ok) throw new Error('function_word_forms_index.json: ' + r.status); return r.json(); })
    ]).then(([skeleton, verbForms, vDict, vDictEn, tIndex, nFormsIndex, gVerbForms, fwForms]) => {
      // ключи-скелеты нормализуем по NFC на всякий случай (хотя без огласовок
      // риск расхождения диакритики уже почти нулевой)
      const normSkeleton = {};
      for (const key in skeleton) normSkeleton[key.normalize('NFC')] = skeleton[key];
      const normVerbForms = {};
      for (const key in verbForms) normVerbForms[key.normalize('NFC')] = verbForms[key];
      const normVerbsDict = {};
      for (const key in vDict) normVerbsDict[key.normalize('NFC')] = vDict[key];
      const normVerbsDictEn = {};
      for (const key in vDictEn) normVerbsDictEn[key.normalize('NFC')] = vDictEn[key];
      const normNounForms = {};
      for (const key in nFormsIndex) normNounForms[key.normalize('NFC')] = nFormsIndex[key];
      const normGenVerbForms = {};
      for (const key in gVerbForms) normGenVerbForms[key.normalize('NFC')] = gVerbForms[key];
      const normFunctionWordForms = {};
      for (const key in fwForms) normFunctionWordForms[key.normalize('NFC')] = fwForms[key];
      hebrewDictSkeleton = normSkeleton;
      hebrewVerbForms = normVerbForms;
      verbsDict = normVerbsDict;
      verbsDictEn = normVerbsDictEn;
      translitIndex = tIndex;
      nounFormsIndex = normNounForms;
      generatedVerbForms = normGenVerbForms;
      functionWordForms = normFunctionWordForms;
      // обратные индексы строим на лету из уже загруженных прямых —
      // см. комментарий у buildReverseIndex
      hebrewDictReverse = buildReverseIndex(hebrewDictSkeleton, 'gloss_ru');
      hebrewDictReverseEn = buildReverseIndex(hebrewDictSkeleton, 'gloss');
      verbsReverse = buildReverseIndex(verbsDict, 'translation');
      verbsReverseEn = buildReverseIndex(verbsDictEn, 'translation');
      functionWordFormsReverse = buildReverseIndex(functionWordForms, 'gloss_ru');
      functionWordFormsReverseEn = buildReverseIndex(functionWordForms, 'gloss_en');
      // карты "запись -> скелет" — нужны для редактирования базы: когда
      // нашли запись через ОБРАТНЫЙ индекс (по переводу), нужно знать, в
      // каком именно ключе прямого словаря она лежит, чтобы её изменить
      hebrewDictEntrySkeleton = buildEntrySkeletonMap(hebrewDictSkeleton);
      verbsEntrySkeleton = buildEntrySkeletonMap(verbsDict);
      hebrewDictKeyCountAtLoad = Object.keys(hebrewDictSkeleton).length;
      verbsDictKeyCountAtLoad = Object.keys(verbsDict).length;
      console.log('[DICT] загружено: словарь —', Object.keys(hebrewDictSkeleton).length, ', обратный индекс —', Object.keys(hebrewDictReverse).length, ', формы глаголов —', Object.keys(hebrewVerbForms).length, ', глаголы (инфинитивы) —', Object.keys(verbsDict).length, ', индекс транскрипции —', Object.keys(translitIndex).length, ', формы сущ/прил —', Object.keys(nounFormsIndex).length, ', сгенерированные формы глаголов —', Object.keys(generatedVerbForms).length, ', формы служебных слов —', Object.keys(functionWordForms).length);
    }).catch(e => {
      console.log('[DICT] словари не загрузились, работаем только через DeepL:', e);
      hebrewDictSkeleton = {}; hebrewDictReverse = {}; hebrewVerbForms = {};
      verbsDict = {}; verbsReverse = {}; translitIndex = {}; nounFormsIndex = {};
      generatedVerbForms = {}; functionWordForms = {}; functionWordFormsReverse = {};
      hebrewDictEntrySkeleton = new WeakMap(); verbsEntrySkeleton = new WeakMap();
    });
    return hebrewDictLoadPromise;
  }
  let totalDictWordCount = null; // заполнится после того, как словарь реально загрузится

  function defaultSearchPlaceholder() {
    const base = t('Ищите по слову, переводу или транскрипции');
    if (totalDictWordCount === null) return base;
    const count = totalDictWordCount.toLocaleString(currentLang === 'en' ? 'en-US' : 'ru-RU');
    return currentLang === 'en' ? `${base} [${count} words in the database]` : `${base} [${count} слов в базе]`;
  }

  loadHebrewDict().then(() => { // запускаем загрузку сразу при открытии страницы, не дожидаясь первого поиска
    // считаем УНИКАЛЬНЫЕ заголовочные слова — основной словарь + отдельная
    // база глаголов (инфинитивы) — а не общее число значений/статей, это
    // куда интуитивнее читается как "слов в базе"
    totalDictWordCount = Object.keys(hebrewDictSkeleton).length + Object.keys(verbsDict).length;
    const searchInputEl = document.getElementById('searchInput');
    // обновляем текст подсказки, только если поле сейчас и так показывает
    // подсказку по умолчанию (а не "Впишите слово..."/"Найдите слово..." —
    // человек мог уже успеть зайти в другой режим, пока грузился словарь)
    if (searchInputEl && (!searchInputEl.placeholder ||
        searchInputEl.placeholder.startsWith('Ищите по слову, переводу или транскрипции') ||
        searchInputEl.placeholder.startsWith('Search by word, translation, or transcription'))) {
      searchInputEl.placeholder = defaultSearchPlaceholder();
    }
  });

  const POS_LABELS = {
    noun: 'сущ', verb: 'глагол', adj: 'прил', adv: 'нареч', intj: 'межд',
    name: 'имя собств.', num: 'числ', pron: 'местоим', prep: 'предлог',
    conj: 'союз', particle: 'частица', phrase: 'фраза', proverb: 'погов.',
    det: 'местоим', article: 'артикль', root: 'корень'
  };
  const POS_LABELS_EN = {
    noun: 'n.', verb: 'verb', adj: 'adj.', adv: 'adv.', intj: 'interj.',
    name: 'proper name', num: 'num.', pron: 'pron.', prep: 'prep.',
    conj: 'conj.', particle: 'particle', phrase: 'phrase', proverb: 'proverb',
    det: 'pron.', article: 'article', root: 'root'
  };

  const BINYAN_LABELS = {
    pa: 'пааль', pi: 'пиэль', hif: 'хифиль', nif: 'нифаль',
    pu: 'пуаль', huf: 'хуфаль', hitp: 'hитпаэль'
  };
  const BINYAN_LABELS_EN = {
    pa: "pa'al", pi: "pi'el", hif: "hif'il", nif: "nif'al",
    pu: "pu'al", huf: "huf'al", hitp: "hitpa'el"
  };

  // Личные слова хранят pos как ГОТОВУЮ русскую строку (например "сущ, м.р",
  // "глагол, пааль") — она же используется для фильтрации, поэтому саму
  // строку не трогаем никогда. А вот ПОКАЗЫВАТЬ её в чипах фильтра нужно на
  // текущем языке — переводим обратным поиском по тем же POS_LABELS/
  // BINYAN_LABELS, которыми размечена основная база.
  const POS_LABEL_RU_TO_EN = Object.fromEntries(
    Object.keys(POS_LABELS).map(code => [POS_LABELS[code], POS_LABELS_EN[code]])
  );
  const BINYAN_LABEL_RU_TO_EN = Object.fromEntries(
    Object.keys(BINYAN_LABELS).map(code => [BINYAN_LABELS[code], BINYAN_LABELS_EN[code]])
  );
  function personalPosLabel(posStr) {
    if (currentLang !== 'en' || !posStr) return posStr;
    if (posStr.startsWith('глагол, ')) {
      const binyanRu = posStr.slice('глагол, '.length);
      return `verb, ${BINYAN_LABEL_RU_TO_EN[binyanRu] || binyanRu}`;
    }
    if (posStr === 'глагол') return 'verb';
    const genderMatch = posStr.match(/^(.+), (м\.р|ж\.р)$/);
    if (genderMatch) {
      const baseRu = genderMatch[1];
      const baseEn = baseRu === 'сущ' ? 'n.' : (POS_LABEL_RU_TO_EN[baseRu] || baseRu);
      const genderEn = genderMatch[2] === 'м.р' ? 'm.' : 'f.';
      return `${baseEn}, ${genderEn}`;
    }
    if (posStr === 'сущ') return 'n.';
    return POS_LABEL_RU_TO_EN[posStr] || posStr;
  }

  // ===== Nakdan API: получение никуда =====
  // Прямой вызов nakdan-u1-0.loadbalancer.dicta.org.il блокируется CORS —
  // запрос идёт через собственный прокси на Cloudflare Workers.
  const NAKDAN_URL = 'https://nakdan-proxy.3an3arah.workers.dev/';

  async function fetchNikkud(hebrewText) {
    const response = await fetch(NAKDAN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        task: 'nakdan',
        genre: 'modern',
        data: hebrewText,
        addmorph: true,
        keepmetagim: true,
        keepqq: false,
        nodageshdefmem: false,
        patachma: false,
        useTokenization: true
      })
    });
    if (!response.ok) throw new Error('Сервер Nakdan ответил ошибкой: ' + response.status);
    const json = await response.json();
    return json.data; // сырые токены — обработка кандидатов делается отдельно
  }

  // Строит список кандидатов-огласовок для подсказки.
  // Если ввели одно слово — берём несколько РАЗНЫХ по написанию вариантов
  // огласовки этого же слова (Nakdan часто предлагает 2-3 равноправных
  // прочтения вроде "мидбар"/"медабер" для одного и того же написания без
  // никуда) и показываем их все, каждый со своей транскрипцией и грамматикой.
  // Если ввели фразу из нескольких слов — как раньше, просто берём по
  // одному лучшему варианту на каждое слово и склеиваем в одну строку.
  // извлекает до 8 кандидатов-огласовок из ОДНОГО токена Nakdan (одно слово).
  // Вынесено отдельно от buildCandidates, чтобы использовать одинаково для
  // разных источников скелета (догадки по транскрипции, перевод с русского)
  function extractCandidatesFromToken(token) {
    const options = token && token.nakdan && token.nakdan.options;
    if (!options || !options.length) return [];

    const sorted = [...options].sort((a, b) => {
      if (a.levelChoice !== b.levelChoice) return a.levelChoice - b.levelChoice;
      const aw = a.w.replace(/\|/g, '');
      const bw = b.w.replace(/\|/g, '');
      const aMatches = a.lex === aw ? 0 : 1;
      const bMatches = b.lex === bw ? 0 : 1;
      return aMatches - bMatches;
    });
    const seen = new Set();
    const candidates = [];
    for (const opt of sorted) {
      if (opt.prefix_len) continue;
      const w = opt.w.replace(/\|/g, '');
      if (seen.has(w)) continue;
      seen.add(w);
      candidates.push({ text: w, morph: opt.morph || null, lex: opt.lex || null });
      if (candidates.length >= 8) break;
    }
    return candidates;
  }

  function buildCandidates(tokens) {
    if (tokens.length === 1) {
      const candidates = extractCandidatesFromToken(tokens[0]);
      if (candidates.length) return candidates;
    }

    // фраза из нескольких слов (или у единственного слова совсем нет
    // вариантов огласовки) — прежнее поведение: один результат на всю фразу
    let firstMorph = null;
    const joined = tokens.map((item, tokenIdx) => {
      const options = item.nakdan && item.nakdan.options;
      if (!options || !options.length) return item.str;
      const best = options.reduce((a, b) => (a.levelChoice <= b.levelChoice ? a : b));
      if (tokenIdx === 0) firstMorph = best.morph || null;
      return best.w.replace(/\|/g, '');
    }).join(' ');
    return [{ text: joined, morph: firstMorph }];
  }

  // ===== Определение типа ввода: иврит / транскрипция / русское слово =====
  function containsHebrew(str) {
    return /[\u0590-\u05FF]/.test(str || '');
  }

  async function translateToHebrew(russianText) {
    const response = await fetch(DEEPL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: [russianText], target_lang: 'HE' })
    });
    if (!response.ok) throw new Error('DeepL ответил ошибкой: ' + response.status);
    const json = await response.json();
    return (json.translations && json.translations[0] && json.translations[0].text) || null;
  }

  function computeGrammarLabelFromMorph(c) {
    const binyanGuess = detectBinyanFromMorph(c.morph) || (c.morph ? null : detectBinyan(c.text));
    if (binyanGuess) return `глагол, ${binyanGuess}`;
    return detectPosFromMorph(c.morph);
  }

  function grammarLabelForEntry(entry) {
    const isEn = currentLang === 'en';
    const binyanLabels = isEn ? BINYAN_LABELS_EN : BINYAN_LABELS;
    const posLabels = isEn ? POS_LABELS_EN : POS_LABELS;
    if (entry.pos === 'verb') {
      const binyan = binyanLabels[entry.binyan] || entry.binyan;
      const verbWord = isEn ? 'verb' : 'глагол';
      return binyan ? `${verbWord}, ${binyan}` : verbWord;
    }
    if (entry.pos === 'noun') {
      if (isEn) {
        if (entry.gender === 'm') return 'n., m.';
        if (entry.gender === 'f') return 'n., f.';
        return 'n.';
      }
      if (entry.gender === 'm') return 'сущ, м.р';
      if (entry.gender === 'f') return 'сущ, ж.р';
      return 'сущ';
    }
    if ((entry.pos === 'pron' || entry.pos === 'name' || entry.pos === 'det' || entry.pos === 'num') && entry.gender) {
      const genderSuffix = isEn
        ? (entry.gender === 'm' ? ', m.' : ', f.')
        : (entry.gender === 'm' ? ', м.р' : ', ж.р');
      return (posLabels[entry.pos] || entry.pos) + genderSuffix;
    }
    return posLabels[entry.pos] || entry.pos;
  }

  // ===== Ударение =====
  // Поле tr в словаре — романизация с ударением (напр. "mishpakhá") в
  // латинице/IPA. Сама по себе она нам не нужна для отображения — но
  // позиция ударного гласного в ней надёжно указывает, на какой гласный
  // ставить ударение в НАШЕЙ собственной кириллической транскрипции.
  // Считаем гласные С КОНЦА в обеих строках (не с начала) — так меньше
  // риск разъехаться, если в начале слова расхождение из-за приставки.
  function findStressIndexFromEnd(trText) {
    if (!trText) return null;
    const first = trText.split(',')[0].trim();
    const ACCENTED = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ɛ́': 'ɛ', 'ɔ́': 'ɔ' };
    const VOWELS = 'aeiouɛɔə';
    let count = 0, stressedCount = -1;
    let inRun = false;
    for (let i = 0; i < first.length; i++) {
      const ch = first[i];
      const chLower = ch.toLowerCase();
      let isVowel = false, isStressed = false;
      if (ACCENTED[chLower]) { isVowel = true; isStressed = true; }
      else if (VOWELS.includes(chLower)) {
        isVowel = true;
        if (first[i + 1] === '\u0301') isStressed = true; // комбинирующий акут отдельным символом
      }
      if (isVowel) {
        // считаем СЛОГИ (группы подряд идущих гласных букв), а не отдельные
        // буквы — дифтонг вроде "ei"/"ai" в транслитерации физически две
        // буквы, но один слог; без этого ударение на словах с дифтонгами
        // могло сместиться на одну позицию
        if (!inRun) count++;
        if (isStressed) stressedCount = count;
        inRun = true;
      } else {
        inRun = false;
      }
    }
    if (stressedCount === -1 || count === 0) return null;
    return count - stressedCount; // сколько слогов ПОСЛЕ ударного, считая с конца (0 = последний слог)
  }

  function applyStressFromEnd(translit, indexFromEnd) {
    if (indexFromEnd === null || indexFromEnd === undefined || !translit) return translit;
    const RU_VOWELS = 'аеиоуяюёэ';
    const positions = [];
    for (let i = 0; i < translit.length; i++) {
      if (RU_VOWELS.includes(translit[i].toLowerCase())) positions.push(i);
    }
    if (!positions.length) return translit;
    const targetPos = positions.length - 1 - indexFromEnd;
    if (targetPos < 0 || targetPos >= positions.length) return translit;
    const idx = positions[targetPos];
    return translit.slice(0, idx + 1) + '\u0301' + translit.slice(idx + 1);
  }

  function countVowelsIn(str, vowelSet) {
    // считаем НЕ отдельные гласные буквы, а ГРУППЫ подряд идущих гласных —
    // это ближе к настоящему слоговому ядру. Дифтонг вроде "ei" в "shteim"
    // физически состоит из двух латинских букв, но это один слог, а не два:
    // при счёте "по буквам" количество слогов в tr искусственно завышалось,
    // совпадало со (неверно) озвученным вариантом и маскировало случаи, где
    // начальную шва на самом деле нужно было заглушить ("штейм", не "шетейм")
    let count = 0;
    let inRun = false;
    for (const ch of (str || '').toLowerCase()) {
      const isVowel = vowelSet.includes(ch);
      if (isVowel && !inRun) count++;
      inRun = isVowel;
    }
    return count;
  }

  function translitWithStress(word, trField) {
    let base = niqqudToTranslit(word);

    // Иногда наш алгоритм озвучивает начальную шва там, где по авторитетным
    // данным (поле tr) её на самом деле нет — "петсаца" вместо "птсаца"
    // (פְּצָצָה, tr: "ptsatsá"), "сефат" вместо "сфат" (שְׂפַת, tr: "sfat").
    // Проверяем это не разбором tr посимвольно (слишком хрупко — апострофы/
    // огласовки записаны непоследовательно), а тем же трюком, что уже
    // используется для расстановки ударения: считаем гласные. Если "тихий"
    // вариант (без озвученной начальной шва) даёт ровно столько же гласных,
    // сколько в tr — а обычный "громкий" вариант на одну больше — берём тихий.
    if (trField) {
      const trFirst = trField.split(',')[0].trim();
      if (trFirst) {
        const LATIN_VOWELS = 'aeiouɛɔəáéíóú';
        const RU_VOWELS = 'аеиоуяюёэ';
        const trVowelCount = countVowelsIn(trFirst, LATIN_VOWELS);
        const voicedVowelCount = countVowelsIn(base, RU_VOWELS);
        if (voicedVowelCount === trVowelCount + 1) {
          const silent = niqqudToTranslit(word, { silentInitialShva: true });
          if (countVowelsIn(silent, RU_VOWELS) === trVowelCount) {
            base = silent;
          }
        }
      }
    }

    const stressIdx = findStressIndexFromEnd(trField);
    return applyStressFromEnd(base, stressIdx);
  }

  // ===== Показ транскрипции/перевода с учётом языка =====
  // RU: кириллическая транскрипция, посчитанная нашим собственным движком
  // (все тонкие правила шва/ударения/мягкого знака, наработанные за эту
  // сессию) — специфично для русскоязычного читателя.
  // EN: берём готовое поле tr ИЗ БАЗЫ НАПРЯМУЮ, без конвертации — оно уже
  // на латинице и рассчитано на англоязычного читателя, наш кириллический
  // конвертер тут просто не нужен (так и порешили).
  function displayTranslit(word, trField) {
    if (currentLang === 'en') return trField || '';
    return translitWithStress(word, trField);
  }
  function displayGloss(entry) {
    if (currentLang === 'en') return entry.gloss !== undefined ? entry.gloss : entry.gloss_ru;
    return entry.gloss_ru;
  }

  function buildDictCandidate(entry) {
    return {
      text: entry.word,
      translit: displayTranslit(entry.word, entry.tr),
      grammarLabel: grammarLabelForEntry(entry),
      translation: displayGloss(entry),
      root: entry.root || null,
      register: entry.register || null,
      source: 'dict'
    };
  }

  // Кандидат из НОВОЙ авторитетной базы глаголов (собрана вручную, ключевое
  // слово — инфинитив, а не смешение форм от Wiktionary). Отдельная функция
  // от buildDictCandidate, потому что структура записи немного другая
  // (translation вместо gloss_ru, нет отдельного поля gender и т.п.)
  // ===== Ударение в инфинитивах глаголов =====
  // Правило (задано явно, не выводится из общих принципов транскрипции):
  // 1. Оканчивается на "сеголь+тав" (־ֶת) → ударение на ПРЕДПОСЛЕДНЕМ слоге.
  // 2. Оканчивается на "патах+тав" (־ַת) → ударение на ПРЕДПОСЛЕДНЕМ слоге.
  // 3. Иначе → ударение на ПОСЛЕДНЕМ слоге.
  function verbInfinitiveStressIndexFromEnd(word) {
    const groups = tokenizeNiqqud(word);
    if (!groups.length) return 0;
    const last = groups[groups.length - 1];
    const prev = groups[groups.length - 2];
    if (last && last.letter === 'ת' && prev &&
        (prev.marks.includes(NIQQUD.SEGOL) || prev.marks.includes(NIQQUD.PATAH))) {
      return 1; // предпоследний слог
    }
    return 0; // последний слог
  }

  function buildVerbDictCandidate(entry) {
    const isEn = currentLang === 'en';
    const binyan = (isEn ? BINYAN_LABELS_EN : BINYAN_LABELS)[entry.binyan] || entry.binyan;
    const verbWord = isEn ? 'verb' : 'глагол';
    let translation = entry.translation;
    let translit = applyStressFromEnd(niqqudToTranslit(entry.word), verbInfinitiveStressIndexFromEnd(entry.word));
    if (isEn && verbsDictEn) {
      // verbsDictEn построен из ОТДЕЛЬНОГО файла (verbs.csv), скелет считаем
      // сами — сопоставляем с текущей записью по точному написанию (word),
      // раз у скелета может быть несколько значений/омографов
      const skeleton = stripNiqqud(entry.word).normalize('NFC');
      const enEntries = verbsDictEn[skeleton] || [];
      const enEntry = enEntries.find(e => e.word === entry.word) || enEntries[0];
      if (enEntry) {
        translation = enEntry.translation;
        if (enEntry.tr) translit = enEntry.tr;
      }
    }
    return {
      text: entry.word,
      translit: translit,
      grammarLabel: binyan ? `${verbWord}, ${binyan}` : verbWord,
      translation: translation,
      root: entry.root || null,
      register: entry.register || null,
      source: 'dict'
    };
  }

  // ===== Билингвальность личного словаря =====
  // Если слово добавлено ИЗ ОБЩЕЙ БАЗЫ (не вписано вручную) — хотим, чтобы
  // при переключении языка карточка сама переключалась вместе с интерфейсом.
  // Ручной ввод и любое редактирование остаются "как есть" — специально
  // просили не трогать язык таких карточек. Реализовано через временный
  // флип currentLang и повторный вызов УЖЕ существующих builder-функций —
  // так не дублируем логику выбора gloss/tr, которая и так работает верно.
  function computeBilingualFields(hebrewWord) {
    const skeleton = stripNiqqud(hebrewWord).normalize('NFC');
    const savedLang = currentLang;
    let result = null;
    try {
      const dictEntries = (hebrewDictSkeleton && hebrewDictSkeleton[skeleton]) || [];
      const dictEntry = dictEntries.find(e => e.word === hebrewWord);
      if (dictEntry) {
        currentLang = 'ru';
        const ru = buildDictCandidate(dictEntry);
        currentLang = 'en';
        const en = buildDictCandidate(dictEntry);
        result = {
          ru: { translation: ru.translation, translit: ru.translit, pos: ru.grammarLabel },
          en: { translation: en.translation, translit: en.translit, pos: en.grammarLabel },
        };
      } else {
        const verbEntries = (verbsDict && verbsDict[skeleton]) || [];
        const verbEntry = verbEntries.find(e => e.word === hebrewWord);
        if (verbEntry) {
          currentLang = 'ru';
          const ru = buildVerbDictCandidate(verbEntry);
          currentLang = 'en';
          const en = buildVerbDictCandidate(verbEntry);
          result = {
            ru: { translation: ru.translation, translit: ru.translit, pos: ru.grammarLabel },
            en: { translation: en.translation, translit: en.translit, pos: en.grammarLabel },
          };
        }
      }
    } finally {
      currentLang = savedLang;
    }
    return result;
  }

  // Что реально показывать на карточке ЛИЧНОГО словаря — учитывая язык,
  // но только если слово размечено как "из базы" и не редактировалось
  // (см. computeBilingualFields выше и пометку w.fromDict/w.translation_en)
  function personalWordDisplay(w) {
    if (currentLang === 'en' && w.fromDict && w.translation_en) {
      return {
        translation: w.translation_en,
        pos: w.pos_en || w.pos,
        translit: w.translit_en || w.translit,
      };
    }
    return { translation: w.translation, pos: w.pos, translit: w.translit };
  }

  // Слово перестаёт быть "из базы" при любом ручном редактировании —
  // дальше его язык на карточке больше не переключается автоматически
  function clearBilingualFields(w) {
    delete w.fromDict;
    delete w.translation_en;
    delete w.pos_en;
    delete w.translit_en;
  }

  // Кандидат для случая "ввели СПРЯГАЕМУЮ ФОРМУ глагола, а не словарную
  // лемму" (медабер, дибарти и т.п.) — показываем саму эту форму с её
  // транскрипцией, но перевод и часть речи берём от ЛЕММЫ (инфинитива),
  // добавляя грамматическую подсказку (лицо/род/число/время), чтобы было
  // понятно, что именно значит эта конкретная форма. Данные о лемме теперь
  // вшиты прямо в саму запись формы (lemma_word/lemma_gloss_ru/lemma_binyan/
  // lemma_root/lemma_inf) — раньше их приходилось подтягивать отдельным
  // файлом wiktionary_verb_lemmas.json во время поиска.
  function buildFunctionWordFormCandidate(formEntry) {
    // В отличие от глагольных форм, здесь перевод самой формы (gloss_ru)
    // ДЕЙСТВИТЕЛЬНО известен и точен (שֶׁלִּי — это именно "мой/моя", а не
    // общий смысл леммы שֶׁל) — поэтому лемма тут не подстраховка на случай
    // отсутствия перевода формы, а просто сноска о происхождении, как в
    // словарях иностранных языков ("mine — форма от my").
    const isEn = currentLang === 'en';
    const gloss = isEn && formEntry.gloss_en ? formEntry.gloss_en : formEntry.gloss_ru;
    const hint = isEn && formEntry.hint_en ? formEntry.hint_en : formEntry.hint;
    const posLabel = (isEn && formEntry.lemma_pos_label_en) ? formEntry.lemma_pos_label_en
      : (formEntry.lemma_pos_label || (isEn ? 'function word' : 'служебное слово'));
    const lemmaLine = formEntry.lemma_word
      ? (isEn
        ? ` (form of ${formEntry.lemma_word}${formEntry.lemma_word_en ? ', "' + formEntry.lemma_word_en + '"' : ''})`
        : ` (форма от ${formEntry.lemma_word}, ${niqqudToTranslit(formEntry.lemma_word)})`)
      : '';
    return {
      text: formEntry.form_word,
      translit: displayTranslit(formEntry.form_word, formEntry.tr),
      grammarLabel: hint ? `${posLabel}, ${hint}` : posLabel,
      translation: `${gloss}${lemmaLine}`,
      source: 'dict'
    };
  }


  function buildVerbFormCandidate(formEntry) {
    const isEn = currentLang === 'en';
    const lemmaGloss = formEntry.lemma_gloss_ru || null;
    const binyan = formEntry.lemma_binyan ? ((isEn ? BINYAN_LABELS_EN : BINYAN_LABELS)[formEntry.lemma_binyan] || formEntry.lemma_binyan) : null;

    // показываем инфинитив, если он есть в данных (редкость, ~2% глаголов) —
    // а если нет, то саму лемму (написание, под которым заведена статья),
    // с транскрипцией, чтобы всегда было видно, от какого слова эта форма
    let lemmaLine = '';
    if (formEntry.lemma_word) {
      if (formEntry.lemma_inf) {
        lemmaLine = isEn
          ? ` (infinitive: ${formEntry.lemma_inf}, ${niqqudToTranslit(formEntry.lemma_inf)})`
          : ` (инфинитив: ${formEntry.lemma_inf}, ${niqqudToTranslit(formEntry.lemma_inf)})`;
      } else {
        lemmaLine = isEn
          ? ` (form of ${formEntry.lemma_word}, ${niqqudToTranslit(formEntry.lemma_word)})`
          : ` (форма от ${formEntry.lemma_word}, ${niqqudToTranslit(formEntry.lemma_word)})`;
      }
    }
    // ПРИМЕЧАНИЕ: formEntry.hint и lemmaGloss тут остаются на русском в любом
    // случае — у этого (резервного, только для не-пааль биньянов) источника
    // нет английских полей вообще, в отличие от generatedVerbForms

    const verbWord = isEn ? 'verb' : 'глагол';
    return {
      text: formEntry.form_word,
      translit: niqqudToTranslit(formEntry.form_word),
      grammarLabel: binyan ? `${verbWord}, ${binyan} (${formEntry.hint})` : `${verbWord} (${formEntry.hint})`,
      translation: lemmaGloss ? `${lemmaGloss}${lemmaLine}` : formEntry.hint,
      root: formEntry.lemma_root || null,
      source: 'dict'
    };
  }

  // Кандидат для случая "ввели форму МНОЖЕСТВЕННОГО ЧИСЛА / сопряжённого
  // состояния существительного, или форму женского рода / мн.ч.
  // прилагательного" (батим → баит, товим → тов) — та же логика, что и для
  // глаголов: показываем саму введённую форму, но перевод берём от леммы
  // (словарной формы, ед.ч.), добавляя грамматическую подсказку.
  const NOUN_FORM_HINT_EN = {
    'ж.р.': 'f.', 'мн.ч.': 'pl.', 'мн.ч., ж.р.': 'pl., f.', 'мн.ч., м.р.': 'pl., m.',
    'сопряж. состояние': 'construct state',
  };
  function nounFormHint(hint) {
    if (currentLang !== 'en') return hint;
    return NOUN_FORM_HINT_EN[hint] || hint;
  }

  function buildNounFormCandidate(formEntry) {
    const lemmaEntries = (hebrewDictSkeleton && hebrewDictSkeleton[formEntry.lemma_skeleton]) || [];
    const lemmaEntry = lemmaEntries[0];
    const lemmaGloss = lemmaEntry ? displayGloss(lemmaEntry) : null;
    const baseLabel = lemmaEntry ? grammarLabelForEntry(lemmaEntry) : null;
    const hint = nounFormHint(formEntry.hint);
    const lemmaLine = lemmaEntry
      ? (currentLang === 'en'
        ? ` (form of ${lemmaEntry.word}, ${niqqudToTranslit(lemmaEntry.word)})`
        : ` (форма от ${lemmaEntry.word}, ${niqqudToTranslit(lemmaEntry.word)})`)
      : '';

    return {
      text: formEntry.form_word,
      translit: niqqudToTranslit(formEntry.form_word),
      grammarLabel: baseLabel ? `${baseLabel} (${hint})` : hint,
      translation: lemmaGloss ? `${lemmaGloss}${lemmaLine}` : hint,
      root: lemmaEntry ? lemmaEntry.root : null,
      source: 'dict'
    };
  }

  // Кандидат для формы, найденной через НОВЫЙ индекс спрягаемых форм —
  // построенный из авторитетного списка глаголов (verbsDict), а не из
  // Wiktionary. Лемму (перевод, породу) берём из verbsDict по lemma_skeleton
  // и сверяем по lemma_word (у одного скелета может быть несколько значений).
  // Подписи форм в generated_verb_forms.json (лицо/число/время) — конечный
  // набор из 24 значений, переводим словарём, а не через общий t()
  const VERB_FORM_HINT_EN = {
    'я, прошедшее время': 'I, past', 'я, будущее время': 'I, future',
    'ты (м.р.), прошедшее время': 'you (m.), past', 'ты (ж.р.), прошедшее время': 'you (f.), past',
    'ты (м.р.)/она, будущее время': 'you (m.)/she, future', 'ты (ж.р.), будущее время': 'you (f.), future',
    'он, прошедшее время': 'he, past', 'он, будущее время': 'he, future',
    'она, прошедшее время': 'she, past',
    'мы, прошедшее время': 'we, past', 'мы, будущее время': 'we, future',
    'вы (м.р.), прошедшее время': 'you (pl.m.), past', 'вы (ж.р.), прошедшее время': 'you (pl.f.), past',
    'вы, будущее время': 'you (pl.), future',
    'они, прошедшее время': 'they, past', 'они, будущее время': 'they, future',
    'вы/они, будущее время': 'you (pl.)/they, future',
    'м.р., ед.ч., настоящее время': 'm., sg., present', 'ж.р., ед.ч., настоящее время': 'f., sg., present',
    'м.р., мн.ч., настоящее время': 'm., pl., present', 'ж.р., мн.ч., настоящее время': 'f., pl., present',
    'м.р., повелительное наклонение': 'm., imperative', 'ж.р., повелительное наклонение': 'f., imperative',
    'м.р./ж.р., мн.ч., повелительное наклонение': 'm./f., pl., imperative',
  };
  function verbFormHint(hint) {
    if (currentLang !== 'en') return hint;
    return VERB_FORM_HINT_EN[hint] || hint;
  }

  function buildGeneratedVerbFormCandidate(formEntry) {
    const isEn = currentLang === 'en';
    const lemmaEntries = (verbsDict && verbsDict[formEntry.lemma_skeleton]) || [];
    const lemmaEntry = lemmaEntries.find(e => e.word === formEntry.lemma_word) || lemmaEntries[0];
    const binyan = lemmaEntry ? ((isEn ? BINYAN_LABELS_EN : BINYAN_LABELS)[lemmaEntry.binyan] || lemmaEntry.binyan) : null;

    let lemmaTranslation = lemmaEntry ? lemmaEntry.translation : null;
    let lemmaTranslit = niqqudToTranslit(formEntry.lemma_word);
    if (isEn && verbsDictEn && formEntry.lemma_skeleton) {
      const enLemmaEntries = verbsDictEn[formEntry.lemma_skeleton] || [];
      const enLemmaEntry = enLemmaEntries.find(e => e.word === formEntry.lemma_word) || enLemmaEntries[0];
      if (enLemmaEntry) {
        lemmaTranslation = enLemmaEntry.translation;
        if (enLemmaEntry.tr) lemmaTranslit = enLemmaEntry.tr;
      }
    }
    const lemmaLine = formEntry.lemma_word
      ? (isEn ? ` (infinitive: ${formEntry.lemma_word}, ${lemmaTranslit})` : ` (инфинитив: ${formEntry.lemma_word}, ${lemmaTranslit})`)
      : '';
    const hint = verbFormHint(formEntry.hint);
    const verbWord = isEn ? 'verb' : 'глагол';

    return {
      text: formEntry.form_word,
      // ПРИМЕЧАНИЕ: у самой спрягаемой формы (в отличие от инфинитива-леммы)
      // нет источника латинской транскрипции — только niqqudToTranslit
      // (кириллица), даже в EN-режиме. Известный, пока не закрытый пробел.
      translit: niqqudToTranslit(formEntry.form_word),
      grammarLabel: binyan ? `${verbWord}, ${binyan} (${hint})` : `${verbWord} (${hint})`,
      translation: lemmaTranslation ? `${lemmaTranslation}${lemmaLine}` : hint,
      root: lemmaEntry ? lemmaEntry.root : null,
      source: 'dict'
    };
  }

  // Простой повтор на случай единичного сбоя сети/API — раз это последний
  // рубеж (после него добавить слово будет уже нечем), даём ему на одну
  // попытку больше шансов
  async function withRetry(fn, times = 2) {
    let lastErr;
    for (let i = 0; i < times; i++) {
      try { return await fn(); } catch (err) { lastErr = err; }
    }
    throw lastErr;
  }

  // Общая точка входа для поиска/подбора меты. Порядок такой:
  // 1) Иврит на входе → ищем ГОЛЫЙ СКЕЛЕТ (без огласовок) в словаре — не
  //    важно, как именно Nakdan/Wiktionary его вокализуют, скелет один.
  //    Нашли — отдаём все статьи сразу, без единого сетевого запроса.
  //    Не нашли — единственный фоллбэк: озвучиваем через Nakdan, берём
  //    ТОЛЬКО топ-кандидат (самый уверенный), переводим через DeepL.
  // 2) Русское слово на входе → сначала обратный индекс (русский → иврит).
  //    Нашли — отдаём статьи сразу. Не нашли — переводим через DeepL,
  //    озвучиваем через Nakdan, тоже только топ-кандидат.
  // Поиск по транскрипции (гиль, медабер и т.п. без точного совпадения)
  // временно отключён из этого потока — отдельная задача на будущее.
  async function resolveCandidates(raw, opts) {
    opts = opts || {};
    await loadHebrewDict();

    if (containsHebrew(raw)) {
      const skeleton = stripNiqqud(raw).normalize('NFC');
      const { sources, matchedSkeleton } = lookupSkeletonWithChaserFallback(skeleton);
      const { dictHit, formHit, verbHit, nounFormHit, genFormHit } = sources;
      if (hasAnyHit(sources)) {
        if (matchedSkeleton !== skeleton) {
          console.log('[RC] точного скелета нет, но нашлось по краткому написанию (ktiv-chaser):', skeleton, '→', matchedSkeleton);
        }
        console.log('[RC] найдено по скелету:', matchedSkeleton, '—', dictHit.length, 'словарных значений +', formHit.length, 'форм глагола +', verbHit.length, 'глаголов (инфинитив) +', nounFormHit.length, 'форм сущ/прил +', genFormHit.length, 'форм глагола (новая база)');
        // объединяем все источники — то же самое написание может одновременно
        // быть и отдельным словом (сленговое "классно"), и спрягаемой формой
        // совсем другого глагола ("зажигаю"), и настоящим глаголом-инфинитивом
        // из авторитетной базы, и формой мн.ч./ж.р. существительного или
        // прилагательного, и спрягаемой формой из НОВОЙ базы глаголов —
        // без объединения теряли бы что-то из этого
        return buildCombinedFromSources(sources);
      }
      console.log('[RC] в словаре нет — иду в Nakdan + DeepL (топ-кандидат):', raw);
      const tokens = await withRetry(() => fetchNikkud(raw)).catch(() => []);
      const candidates = buildCandidates(tokens);
      // если Nakdan не смог озвучить (сеть/API подвели) — не сдаёмся сразу:
      // используем то, что ввёл человек, как есть (транслитерация по тому,
      // что реально написано — без огласовок выйдет неполной, но лучше
      // добавить слово так, чем не добавить вовсе)
      const chosen = candidates.length ? candidates[0] : null;
      const chosenText = chosen ? chosen.text : raw;
      // для слов, которых ещё нет в базе, сверить начальную шва не с чем
      // (нет проверенного tr) — но раз статистика по словарю говорит, что
      // немая шва тут норма (~92% случаев), молчать по умолчанию — уже
      // ощутимо лучше, чем всегда озвучивать. ИСКЛЮЧЕНИЕ — глаголы: у них
      // своё правило (после первой шва обычно звучит "э"), поэтому для них
      // оставляем прежнее поведение
      const chosenIsVerb = chosen ? !!(detectBinyanFromMorph(chosen.morph) || (chosen.morph ? null : detectBinyan(chosen.text))) : false;
      const translitOpts = chosenIsVerb ? {} : { silentInitialShva: true };
      const chosenTranslit = chosen ? niqqudToTranslit(chosen.text, translitOpts) : niqqudToTranslit(raw, translitOpts);
      const chosenGrammar = chosen ? computeGrammarLabelFromMorph(chosen) : null;
      let translation = null;
      try { translation = await withRetry(() => translateHebrewToCurrentLang(chosenText)); } catch (e) {}
      if (!translation) return []; // без перевода добавлять действительно нечего
      return [{ text: chosenText, translit: chosenTranslit, grammarLabel: chosenGrammar, translation, source: 'hebrew-api' }];
    }

    const ruKey = raw.trim().toLowerCase();
    const activeDictReverse = currentLang === 'en' ? hebrewDictReverseEn : hebrewDictReverse;
    const activeFunctionReverse = currentLang === 'en' ? functionWordFormsReverseEn : functionWordFormsReverse;
    const dictHit = (activeDictReverse && activeDictReverse[ruKey]) || [];
    const activeVerbsReverse = currentLang === 'en' ? verbsReverseEn : verbsReverse;
    const verbRuHit = (activeVerbsReverse && activeVerbsReverse[ruKey]) || [];
    const functionFormRuHit = (activeFunctionReverse && activeFunctionReverse[ruKey]) || [];
    const translationMatches = (dictHit.length || verbRuHit.length || functionFormRuHit.length)
      ? mergeCandidatesBySense([
          ...dictHit.map(buildDictCandidate),
          ...verbRuHit.map(buildVerbDictCandidate),
          ...functionFormRuHit.map(buildFunctionWordFormCandidate)
        ])
      : [];

    // раз это не обязательно перевод — возможно, это ТРАНСКРИПЦИЯ ивритского
    // слова ("махшев" вместо перевода "компьютер"). Пробуем ВСЕГДА, а не
    // только если перевод не нашёлся — иначе случайное совпадение с реальным
    // русским словом ("рак" = "краб") тихо перекрывает транскрипцию, которую
    // человек реально имел в виду ("рак" = רַק, "только")
    const transcriptionMatches = fuzzyMatchTranslitIndex(raw);

    if (!opts.skipLocalShortcut && (translationMatches.length || transcriptionMatches.length)) {
      console.log('[RC] локально нашлось:', ruKey, '—', translationMatches.length, 'по переводу +', transcriptionMatches.length, 'по транскрипции');
      if (!translationMatches.length) return transcriptionMatches;
      if (!transcriptionMatches.length) return translationMatches;
      // приоритет: точное совпадение транскрипции → перевод → остальная
      // (нечёткая) транскрипция
      const queryNorm = currentLang === 'en' ? stripLatinAccents(raw) : normalizeForCompare(raw);
      const exactTranslit = [];
      const restTranslit = [];
      transcriptionMatches.forEach(c => {
        const cNorm = currentLang === 'en' ? stripLatinAccents(c.translit) : normalizeForCompare(c.translit);
        (cNorm === queryNorm ? exactTranslit : restTranslit).push(c);
      });
      const combined = [...exactTranslit, ...translationMatches, ...restTranslit];
      const seen = new Set();
      return combined.filter(c => {
        const key = c.text + '|' + c.translation;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    console.log('[RC] в индексе транскрипции нет — иду к Джемини гадать написание:', raw);
    const guessedSkeletons = await guessHebrewSpellings(raw).catch(() => []);
    const fromGemini = [];
    for (const guessedSkeleton of guessedSkeletons) {
      const gDictHit = (hebrewDictSkeleton && hebrewDictSkeleton[guessedSkeleton]) || [];
      const gVerbHit = (verbsDict && verbsDict[guessedSkeleton]) || [];
      fromGemini.push(...gDictHit.map(buildDictCandidate), ...gVerbHit.map(buildVerbDictCandidate));
    }
    if (fromGemini.length) {
      console.log('[RC] Джемини угадал написание, нашлось в базе:', fromGemini.length, 'кандидатов');
      return mergeCandidatesBySense(fromGemini);
    }

    console.log('[RC] и Джемини не помог — иду в DeepL + Nakdan (топ-кандидат):', raw);
    const hebrewFromRussian = await withRetry(() => translateToHebrew(raw)).catch(() => null);
    if (!hebrewFromRussian) return [];
    const tokens = await withRetry(() => fetchNikkud(hebrewFromRussian)).catch(() => []);
    const candidates = buildCandidates(tokens);
    if (candidates.length) {
      const top = candidates[0];
      const topIsVerb = !!(detectBinyanFromMorph(top.morph) || (top.morph ? null : detectBinyan(top.text)));
      const topTranslit = niqqudToTranslit(top.text, topIsVerb ? {} : { silentInitialShva: true });
      return [{ text: top.text, translit: topTranslit, grammarLabel: computeGrammarLabelFromMorph(top), translation: raw, source: 'translation-api' }];
    }
    // Nakdan не смог озвучить то, что перевёл DeepL — всё равно отдаём слово
    // как есть, без огласовок, вместо того чтобы вовсе не добавить его
    return [{ text: hebrewFromRussian, translit: niqqudToTranslit(hebrewFromRussian), grammarLabel: null, translation: raw, source: 'translation-api' }];
  }

  // Нечёткий поиск по собственному индексу транскрипции (translitIndex) —
  // посчитан заранее по всей базе (основной словарь + глаголы), локально,
  // без сети. Используется как шаг ПЕРЕД обращением к Джемини — если
  // человек ввёл "махшев", это почти наверняка совпадёт с транскрипцией
  // מַחְשֵׁב ("компьютер") уже без единого сетевого запроса.
  // Убираем ударение с латинской транскрипции для нечёткого сравнения —
  // человек, печатающий "makhshev", не будет ставить á/é/í/ó/ú руками
  function stripLatinAccents(s) {
    return (s || '').toLowerCase()
      .replace(/[áàâ]/g, 'a').replace(/[éèê]/g, 'e').replace(/[íìî]/g, 'i')
      .replace(/[óòô]/g, 'o').replace(/[úùû]/g, 'u').replace(/['’]/g, '');
  }

  function fuzzyMatchTranslitIndex(raw) {
