      // отдельное правило для многословных ключей: если запрос ТОЧНО совпал
      // с первым словом фразы ("шум" для "шум давар") — обычное расстояние
      // Левенштейна тут ни при чём не поможет (разница в длине из-за
      // "хвоста" фразы почти всегда превысит допуск), а по факту это
      // абсолютно естественное совпадение, которое должно находиться
      const isPrefixWordMatch = key.startsWith(query + ' ');
      if (dist > allowedDistance && !isPrefixWordMatch) continue;
      const effectiveDist = isPrefixWordMatch ? Math.min(dist, 1) : dist;
      for (const entry of translitIndex[key]) {
        const cur = skeletonDistance.get(entry.skeleton);
        if (cur === undefined || effectiveDist < cur) skeletonDistance.set(entry.skeleton, effectiveDist);
      }
    }
    if (!skeletonDistance.size) return [];
    const results = [];
    for (const [skeleton] of skeletonDistance) {
      const dictHit = (hebrewDictSkeleton && hebrewDictSkeleton[skeleton]) || [];
      const verbHit = (verbsDict && verbsDict[skeleton]) || [];
      const genFormHit = (generatedVerbForms && generatedVerbForms[skeleton]) || [];
      // см. комментарий в lookupSkeletonSources — старые формы только если у
      // скелета нет ничего авторитетного вообще (ни новых форм, ни инфинитива, ни основного словаря)
      const formHit = (genFormHit.length || verbHit.length || dictHit.length) ? [] : ((hebrewVerbForms && hebrewVerbForms[skeleton]) || []);
      const nounFormHit = (nounFormsIndex && nounFormsIndex[skeleton]) || [];
      const functionFormHit = (functionWordForms && functionWordForms[skeleton]) || [];
      const candidates = [
        ...dictHit.map(buildDictCandidate),
        ...verbHit.map(buildVerbDictCandidate),
        ...formHit.map(buildVerbFormCandidate),
        ...nounFormHit.map(buildNounFormCandidate),
        ...genFormHit.map(buildGeneratedVerbFormCandidate),
        ...functionFormHit.map(buildFunctionWordFormCandidate)
      ];
      for (const c of candidates) {
        // дистанцию для сортировки считаем по СОБСТВЕННОЙ транскрипции этого
        // конкретного кандидата, а не по скелету в целом — иначе омографы
        // (одно консонантное написание, разные огласовки/породы — לִפְנוֹת
        // "лифнот" и לְפַנוֹת "лефанот") получают одну и ту же "лучшую" дистанцию
        // скелета и сортируются между собой произвольно, даже если запрос
        // буква-в-букву совпадает с транскрипцией только ОДНОГО из них
        const cTranslit = normalizeForCompare(c.translit);
        const rawDist = levenshtein(cTranslit, query);
        // то же исключение для многословных фраз, что и при отборе скелетов
        // выше — иначе "шум давар" при сортировке всё равно проваливается
        // вниз списка, даже пройдя порог отбора
        const ownDist = cTranslit.startsWith(query + ' ') ? Math.min(rawDist, 1) : rawDist;
        results.push({ c, dist: ownDist });
      }
    }
    // сортируем по точности совпадения — точнее звучащие кандидаты первыми
    results.sort((a, b) => a.dist - b.dist);
    return mergeCandidatesBySense(results.map(r => r.c));
  }

  // Только словарная часть resolveCandidates — БЕЗ похода в Nakdan/DeepL.
  // Все обращения к ней синхронны по сути (скелет-словарь и обратный индекс
  // уже загружены в память), поэтому это можно безопасно вызывать на КАЖДОЕ
  // нажатие клавиши — в отличие от полного resolveCandidates, который при
  // отсутствии слова в словаре идёт в сеть, а это уже нельзя дёргать на
  // каждую букву. Возвращает [] (мгновенно), если слова нет в словаре —
  // тогда решение идти в сеть остаётся за явной кнопкой пользователя.
  async function resolveCandidatesDictOnly(raw) {
    await loadHebrewDict();
    if (!raw || !raw.trim()) return [];

    if (containsHebrew(raw)) {
      const skeleton = stripNiqqud(raw).normalize('NFC');
      const { sources } = lookupSkeletonWithChaserFallback(skeleton);
      if (!hasAnyHit(sources)) return [];
      return buildCombinedFromSources(sources);
    }

    const ruKey = raw.trim().toLowerCase();
    const dictHit = (hebrewDictReverse && hebrewDictReverse[ruKey]) || [];
    const verbRuHit = (verbsReverse && verbsReverse[ruKey]) || [];
    const functionFormRuHit = (functionWordFormsReverse && functionWordFormsReverse[ruKey]) || [];
    const translationMatches = (dictHit.length || verbRuHit.length || functionFormRuHit.length)
      ? mergeCandidatesBySense([
          ...dictHit.map(buildDictCandidate),
          ...verbRuHit.map(buildVerbDictCandidate),
          ...functionFormRuHit.map(buildFunctionWordFormCandidate)
        ])
      : [];

    // транскрипцию пробуем ВСЕГДА, а не только если перевод не нашёлся —
    // иначе случайное совпадение с реальным русским словом ("рак" = "краб",
    // хотя искали רַק "только") тихо перекрывает то, что человек реально искал
    const transcriptionMatches = fuzzyMatchTranslitIndex(raw);
    if (!translationMatches.length) return transcriptionMatches;
    if (!transcriptionMatches.length) return translationMatches;

    // приоритет: сначала ТОЧНОЕ совпадение транскрипции (человек буквально
    // напечатал именно то, как слово звучит), затем перевод, затем остальные
    // (нечёткие) варианты транскрипции
    const queryNorm = normalizeForCompare(raw);
    const exactTranslit = [];
    const restTranslit = [];
    transcriptionMatches.forEach(c => {
      (normalizeForCompare(c.translit) === queryNorm ? exactTranslit : restTranslit).push(c);
    });

    const combined = [...exactTranslit, ...translationMatches, ...restTranslit];
    const seen = new Set();
    return combined.filter(c => {
      const key = c.text + '|' + c.translation;
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }



  // ===== Конвертация никуда → транскрипция (черновая, по правилам Tedabru) =====
  //
  // ВАЖНО: это черновой алгоритм для ускорения ручного ввода, а не финальная
  // истина. Он не умеет надёжно определять ударение и не всегда угадывает
  // "живой"/"немой" шва — результат всегда нужно проверять глазами перед
  // сохранением.

  const NIQQUD = {
    SHVA: '\u05B0', HATAF_SEGOL: '\u05B1', HATAF_PATAH: '\u05B2', HATAF_QAMATS: '\u05B3',
    HIRIQ: '\u05B4', TSERE: '\u05B5', SEGOL: '\u05B6', PATAH: '\u05B7', QAMATS: '\u05B8',
    HOLAM: '\u05B9', HOLAM_HASER: '\u05BA', QUBUTS: '\u05BB', DAGESH: '\u05BC',
    METEG: '\u05BD', RAFE: '\u05BF', SHIN_DOT: '\u05C1', SIN_DOT: '\u05C2', QAMATS_QATAN: '\u05C7'
  };

  const VOWEL_MAP = {
    [NIQQUD.PATAH]: 'а', [NIQQUD.QAMATS]: 'а', [NIQQUD.QAMATS_QATAN]: 'а',
    [NIQQUD.HATAF_PATAH]: 'а', [NIQQUD.HATAF_QAMATS]: 'а',
    [NIQQUD.TSERE]: 'е', [NIQQUD.SEGOL]: 'е', [NIQQUD.HATAF_SEGOL]: 'е',
    [NIQQUD.HIRIQ]: 'и',
    [NIQQUD.HOLAM]: 'о', [NIQQUD.HOLAM_HASER]: 'о',
    [NIQQUD.QUBUTS]: 'у'
    // ШВА сюда не входит — обрабатывается отдельно (по умолчанию считаем немым)
  };

  // базовое звучание согласной (без дагеша)
  const CONSONANT_BASE = {
    'א': '', 'ב': 'в', 'ג': 'г', 'ד': 'д', 'ה': 'h', 'ו': 'в', 'ז': 'з',
    'ח': 'х', 'ט': 'т', 'י': 'й', 'כ': 'х', 'ך': 'х', 'ל': 'л', 'מ': 'м', 'ם': 'м',
    'נ': 'н', 'ן': 'н', 'ס': 'с', 'ע': '', 'פ': 'ф', 'ף': 'ф', 'צ': 'ц', 'ץ': 'ц',
    'ק': 'к', 'ר': 'р', 'ש': 'ш', 'ת': 'т'
  };
  // звучание с дагешем (только для тех букв, где оно реально меняет звук в иврите)
  const CONSONANT_DAGESH = { 'ב': 'б', 'כ': 'к', 'ך': 'к', 'פ': 'п', 'ף': 'п' };

  // разбивает слово с никудом на группы {letter, marks} — согласная + идущие
  // следом диакритики. Используется и транскрипцией, и распознаванием биньяна.
  function tokenizeNiqqud(word) {
    word = word.replace(/\|/g, '');
    const groups = [];
    let i = 0;
    while (i < word.length) {
      const ch = word[i];
      if (Object.prototype.hasOwnProperty.call(CONSONANT_BASE, ch)) {
        let marks = '';
        i++;
        while (i < word.length && /[\u0591-\u05BF\u05C1\u05C2\u05C7]/.test(word[i])) {
          marks += word[i];
          i++;
        }
        groups.push({ letter: ch, marks });
      } else {
        i++; // пропускаем кантилляцию/прочее, что нам не нужно
      }
    }
    return groups;
  }

  // niqqudToTranslit работает с целой фразой — разбивает её на отдельные
  // ивритские слова по пробелу, конвертирует каждое отдельно и склеивает
  // обратно с пробелом. Без этого пробел между словами "терялся" при
  // токенизации (он не согласная и не огласовка, просто пропускался).
  function niqqudToTranslit(text, opts) {
    return text
      .split(/\s+/)
      .filter(Boolean)
      .map(w => convertSingleWord(w, opts))
      .join(' ');
  }

  function convertSingleWord(word, opts) {
    opts = opts || {};
    const groups = tokenizeNiqqud(word);

    let result = '';
    for (let idx = 0; idx < groups.length; idx++) {
      const { letter, marks } = groups[idx];
      const hasDagesh = marks.includes(NIQQUD.DAGESH);
      const isLast = idx === groups.length - 1;
      const vowelMark = Object.keys(VOWEL_MAP).find(v => marks.includes(v));

      // ===== ФУРТИВНЫЙ ПАТАХ (patach genuvah) =====
      // Когда слово оканчивается на гортанную (ח, ע, иногда ה) с патахом
      // после "не-а"-гласной, этот патах на самом деле произносится ПЕРЕД
      // согласной, а не после: רוּחַ = "руах", не "руха"; לִשְׁלוֹחַ = "лишлоах",
      // не "лишлоха". У ח согласная слышна (х), у ע/ה в конце слова она
      // практически беззвучна — остаётся только сама гласная "а".
      if (isLast && vowelMark === NIQQUD.PATAH && (letter === 'ח' || letter === 'ע' || letter === 'ה')) {
        result += 'а' + (letter === 'ח' ? 'х' : '');
        continue;
      }

      // финальная немая "ה" — всегда молчит, даже с мапиком (точка внутри,
      // формально означающая "здесь h всё-таки произносится", напр. לָהּ,
      // אוֹתָהּ). В разговорном современном иврите мапик практически никогда
      // не звучит вслух — это литургический/формальный остаток, а не то,
      // чему учит Tedabru, поэтому финальный ה немой без исключений.
      if (letter === 'ה' && isLast) {
        continue;
      }

      // ===== ВАВ: чаще всего это не согласная "в", а огласовка =====
      // холам мале (וֹ) = "о"; шурук (וּ, дагеш без отдельной гласной) = "у".
      // Настоящая согласная "в" — только когда вав действительно несёт свой
      // "обычный" гласный (патах/камац/еtc.) или стоит первой буквой слова
      // (чаще всего это приставка ве-/ва-).
      if (letter === 'ו') {
        if (marks.includes(NIQQUD.HOLAM) || marks.includes(NIQQUD.HOLAM_HASER)) {
          result += 'о';
          continue;
        }
        if (hasDagesh && !vowelMark) {
          result += 'у'; // шурук
          continue;
        }
        // двойной вав (וו) — первый вав ВСЕГДА настоящая согласная "в", даже
        // без своей огласовки: второй вав несёт собственную гласную отдельно
        // (לְהַלְווֹת "леhальвот" — не "леhальот")
        const nextGroup = groups[idx + 1];
        const isFirstOfDoubleVav = nextGroup && nextGroup.letter === 'ו';
        if (!vowelMark && !marks.includes(NIQQUD.SHVA) && idx !== 0 && !isFirstOfDoubleVav) {
          continue; // немая "мать чтения" в середине/конце слова без огласовки
        }
        // иначе — настоящая согласная "в" (в т.ч. приставка ве-/ва-)
        let vowel = '';
        if (vowelMark) {
          vowel = VOWEL_MAP[vowelMark];
        } else if (marks.includes(NIQQUD.SHVA)) {
          if (idx === 0) {
            vowel = 'е';
          } else {
            vowel = ''; // немой шва — правило смягчения "ль" относится только к букве ламед
          }
        }
        result += 'в' + vowel;
        continue;
      }

      // ===== ЙУД как "мать чтения" (хирик мале) — не добавляет отдельного звука =====
      // Пропускаем ТОЛЬКО когда йуд продолжает хирик предыдущей буквы (долгое "и").
      // Если же йуд стоит без своей гласной перед чем-то другим (например перед
      // вав-холам, как в יוֹדֵעַ = "йодеа") — это настоящая согласная "й", не немая.
      if (letter === 'י' && !vowelMark && !hasDagesh) {
        const prevGroup = groups[idx - 1];
        // "мать чтения" бывает не только после хирика (хирик мале), но и
        // после цере (цере мале) — тот же принцип, другая долгая гласная:
        // לְהֵירָשֵׁם ("леhерашем") — йуд после цере тоже немой
        const isMaterLectionisContinuation = prevGroup &&
          (prevGroup.marks.includes(NIQQUD.HIRIQ) || prevGroup.marks.includes(NIQQUD.TSERE));
        if (isMaterLectionisContinuation) {
          continue;
        }
        // шва НА САМОМ йуде (а не мать чтения) — частый случай приставки
        // будущего времени יְ- (יְדַבֵּר "йедабер" — "он поговорит"). Без этого
        // шва проглатывалась, и согласная слипалась с "й" ("йдабер"). "е",
        // не "и" — той же логике, что и у остальных приставок этого же
        // спряжения (те-, не-, а-): шва озвучивается кратким "е".
        if (marks.includes(NIQQUD.SHVA)) {
          result += 'йе';
          continue;
        }
        result += 'й';
        continue;
      }

      let sound = hasDagesh && CONSONANT_DAGESH[letter] ? CONSONANT_DAGESH[letter] : CONSONANT_BASE[letter];

      // ш/с различаются точкой шин/син
      if (letter === 'ש') {
        sound = marks.includes(NIQQUD.SIN_DOT) ? 'с' : 'ш';
      }

      let vowel = '';
      if (vowelMark) {
        vowel = VOWEL_MAP[vowelMark];
      } else if (idx === 0 && marks.includes(NIQQUD.SHVA)) {
        const SONORANTS = ['ל', 'מ', 'נ', 'ר'];
        // подсказку от tr-поля (силентная начальная шва) применяем ТОЛЬКО
        // когда сама шва-носитель — не сонорная согласная: для сонорных
        // (מ, נ, ר, ל) уже есть отдельное, осознанно принятое правило ниже
        // (מְנוֹרָה = "менора", а не "мнора"), и его лучше не трогать —
        // among сонорных первых букв реальное произношение расходится по
        // конкретным словам гораздо сильнее, чем формат tr-поля способен
        // надёжно передать
        if (opts.silentInitialShva && !SONORANTS.includes(letter)) {
          vowel = '';
        } else {
          // ШВА под самой первой буквой слова обычно озвучивается кратким "е"
          // (לְ- → "ле-", בְּ- → "бе-"), НО перед сонорными согласными (מ, נ, ר)
          // в разговорном иврите он почти всегда "проглатывается": שלושה →
          // "шлоша", не "шелоша"; שני → "шней", не "шеней". Это относится
          // только к случаям, когда САМА шва-носитель — НЕ сонорная согласная
          // (ש, כ и т.п.), а следующая — сонорная. Если же сама первая буква
          // тоже сонорная (מ, נ, ר, ל), проглатывание не происходит: מְנוֹרָה =
          // "менора", а не "мнора" — согласная+шва+согласная тут звучат как
          // отдельный слог, а не сливаются.
          const nextGroup = groups[1];
          const nextIsSonorant = !SONORANTS.includes(letter) && nextGroup && SONORANTS.includes(nextGroup.letter);
          vowel = nextIsSonorant ? '' : 'е';
        }
      } else if (letter !== 'ל' && marks.includes(NIQQUD.SHVA)) {
        // шва посреди слова перед йудом, у которого есть СВОЯ гласная
        // (типичный паттерн заимствований на -ция/-сия: סִימוּלַצְיָה, где
        // сама йуд озвучивается как "йа" по общему правилу) — если эту шва
        // не озвучить, согласная слипается с "й" в непроизносимый на письме
        // кусок ("цйа" вместо "ция"). Озвучиваем такую шва как "и".
        const nextGroup = groups[idx + 1];
        const nextIsYudWithOwnVowel = nextGroup && nextGroup.letter === 'י' &&
          Object.keys(VOWEL_MAP).some(v => nextGroup.marks.includes(v));
        vowel = nextIsYudWithOwnVowel ? 'и' : '';
      } else if (letter === 'ל') {
        // буква ламед (ל) без собственной гласной смягчается мягким знаком —
        // но только если она действительно "повисает" без огласовки (беззвучный
        // шва перед следующей согласной: лильмод, йальда; или в самом конце
        // слова: леhациль). Если же следующая буква — вав-холам/шурук, то
        // гласная "о"/"у" на самом деле принадлежит именно этому ламеду и
        // просто записана на следующей букве (שְׁלוֹשָׁה = "шлоша", не "шльоша") —
        // тогда смягчать не нужно, ламед остаётся просто согласной без "ь".
        const nextGroup = groups[idx + 1];
        const nextCarriesVowelForThis = nextGroup && nextGroup.letter === 'ו' &&
          (nextGroup.marks.includes(NIQQUD.HOLAM) || nextGroup.marks.includes(NIQQUD.HOLAM_HASER) ||
           (nextGroup.marks.includes(NIQQUD.DAGESH) && !Object.keys(VOWEL_MAP).some(v => nextGroup.marks.includes(v))));
        vowel = nextCarriesVowelForThis ? '' : 'ь';
      }

      // йуд + гласная = всегда "й" + чистая гласная (никогда я/ю/ё) — правило Tedabru
      if (letter === 'י' && vowel) {
        result += 'й' + vowel;
        continue;
      }

      // ===== Э vs Е в начале слова =====
      // "е" после согласной звучит мягко (как в "лес") — это верно для тех же
      // цере/сеголь после обычной согласной (לֶמֶד = "лемед"). Но если сама
      // первая буква слова беззвучна (א или ע без собственного звука) и несёт
      // цере/сеголь, никакой предшествующей согласной на самом деле нет — слово
      // фонетически начинается с чистого гласного (как русское "этот", а не
      // "его"), и его нужно передавать через "э": אֶלְמַד = "эльмад", а не "ельмад".
      if (idx === 0 && sound === '' && vowel === 'е') {
        vowel = 'э';
      }

      result += sound + vowel;
    }

    // Двойной йуд (геминация согласной, например дагеш на одном йуде сразу
    // перед другим йудом со своей гласной — לְסַיֵּים) в разговорном иврите не
    // звучит как два отдельных "й" подряд — это одна и та же согласная,
    // просто орфографически удвоенная. лесаййем → лесайем.
    result = result.replace(/йй+/g, 'й');

    return result || '?';
  }

  // ===== Распознавание биньяна по шаблону инфинитива (черновая эвристика) =====
  //
  // Предполагается, что слово вводится в форме инфинитива (как принято в
  // курсе Tedabru: לִכְתוֹב, לְקַבֵּל и т.д.). Пуаль и хуфаль сюда не входят —
  // у них нет формы инфинитива, поэтому глагол в инфинитиве может быть только
  // одним из пяти: пааль, пиэль, хифиль, нифаль, hитпаэль.
  //
  // ВАЖНО: это эвристика по внешнему виду огласовок, а не морфологический
  // анализ — пааль как биньян неоднороден (разные корни дают разный шаблон),
  // поэтому он используется как запасной вариант по умолчанию. Результат
  // всегда стоит проверять глазами, как и с транскрипцией.
  function detectBinyan(niqqudWord) {
    const groups = tokenizeNiqqud(niqqudWord);
    if (groups.length < 2 || groups[0].letter !== 'ל') return null; // не похоже на инфинитив

    const has = (marks, mark) => marks.includes(mark);
    const second = groups[1];

    // לְהִתְ... → hитпаэль
    if (second.letter === 'ה' && has(second.marks, NIQQUD.HIRIQ) &&
        groups[2] && groups[2].letter === 'ת') {
      return 'hитпаэль';
    }
    // לְהִ... (без ת следом) → нифаль
    if (second.letter === 'ה' && has(second.marks, NIQQUD.HIRIQ)) {
      return 'нифаль';
    }
    // לְהַ... → хифиль
    if (second.letter === 'ה' && has(second.marks, NIQQUD.PATAH)) {
      return 'хифиль';
    }
    // לְהוֹ... → хифиль (подтип с "слабой" первой корневой буквой: להודיע,
    // להוציא, להושיב — гласная "о" стоит не на самой ה, а на следующей ו)
    if (second.letter === 'ה' && groups[2] && groups[2].letter === 'ו' &&
        has(groups[2].marks, NIQQUD.HOLAM)) {
      return 'хифиль';
    }
    // дагеш + цере на одной и той же согласной (не первой и не последней) —
    // самая узнаваемая сигнатура пиэль (לְקַבֵּל, לְדַבֵּר)
    for (let i = 1; i < groups.length - 1; i++) {
      if (has(groups[i].marks, NIQQUD.DAGESH) && has(groups[i].marks, NIQQUD.TSERE)) {
        return 'пиэль';
      }
    }
    // ничего из вышеперечисленного — самый частый случай, пааль
    return 'пааль';
  }

  // ===== Распознавание части речи и рода по битовой маске "morph" =====
  //
  // Поле morph, которое Nakdan и так возвращает бесплатно с каждым запросом,
  // оказалось битовой маской, где отдельные биты устойчиво соответствуют
  // грамматическим категориям (проверено эмпирически на наборе тестовых слов,
  // официальной документации по расшифровке у Dicta нет):
  //   биты 18 И 17 вместе → существительное
  //   бит 16 (без 17)     → прилагательное
  //   бит 17 в одиночку (без 16 и без 18) → наречие
  //   бит 22              → женский род (для сущ./прил.)
  // Это тоже эвристика на ограниченной выборке — не официальный контракт API,
  // так что результат может не покрывать все случаи.
  function hasBit(morphStr, bit) {
    if (!morphStr) return false;
    try {
      return (BigInt(morphStr) & (1n << BigInt(bit))) !== 0n;
    } catch (e) {
      return false; // на случай неожиданного формата morph — просто не угадываем
    }
  }

  // ===== Распознавание биньяна по битам 51/52/53 в morph =====
  //
  // Проверено на семи глагольных формах (по одной на каждый биньян, включая
  // пуаль/хуфаль через причастие, раз у них нет инфинитива) — комбинация
  // этих трёх битов однозначно и без исключений соответствует биньяну:
  //   51            → пааль
  //   52            → нифаль
  //   51+52         → хифиль
  //   51+53         → пиэль
  //   52+53         → пуаль
  //   53            → хуфаль
  //   51+52+53      → hитпаэль
  // Это надёжнее прежней эвристики по написанию (которая ложно принимала за
  // глагол некоторые наречия вроде "леат") — здесь используется реальный
  // грамматический разбор Nakdan, а не угадывание по внешнему виду слова.
  function detectBinyanFromMorph(morphStr) {
    if (!morphStr) return null;
    const b51 = hasBit(morphStr, 51);
    const b52 = hasBit(morphStr, 52);
    const b53 = hasBit(morphStr, 53);

    if (b51 && !b52 && !b53) return 'пааль';
    if (!b51 && b52 && !b53) return 'нифаль';
    if (b51 && b52 && !b53) return 'хифиль';
    if (b51 && !b52 && b53) return 'пиэль';
    if (!b51 && b52 && b53) return 'пуаль';
    if (!b51 && !b52 && b53) return 'хуфаль';
    if (b51 && b52 && b53) return 'hитпаэль';
    return null; // ни одна из известных комбинаций не подошла — не глагол
  }

  function detectPosFromMorph(morphStr) {
    if (!morphStr) return null;
    // числительное (количественное) и местоимение проверяем ПЕРВЫМИ — они
    // используют тот же бит 16, что и прилагательное, но в других сочетаниях,
    // поэтому порядок проверки важен, иначе прилагательное перехватит их.
    const isCardinalNumeral = hasBit(morphStr, 16) && hasBit(morphStr, 17) && hasBit(morphStr, 18);
    const isPronoun = hasBit(morphStr, 16) && hasBit(morphStr, 19) &&
      !hasBit(morphStr, 17) && !hasBit(morphStr, 18);
    const isNoun = hasBit(morphStr, 18) && hasBit(morphStr, 17);
    const isAdjective = hasBit(morphStr, 16) && !hasBit(morphStr, 17);
    const isAdverb = hasBit(morphStr, 17) && !hasBit(morphStr, 16) && !hasBit(morphStr, 18);
    const isFeminine = hasBit(morphStr, 22);

    // порядковые числительные (ראשון и т.п.) отдельного кода не имеют —
    // Nakdan размечает их как обычное прилагательное, что грамматически
    // верно (они склоняются как прилагательные), так что правило isAdjective
    // уже подхватывает их само по себе.
    if (isCardinalNumeral) return 'числ';
    if (isPronoun) return 'местоим';
    if (isNoun) return isFeminine ? 'сущ, ж.р' : 'сущ, м.р';
    if (isAdjective) return 'прил';
    if (isAdverb) return 'нареч';
    return null; // не подошло ни под одну категорию — оставляем выбор пользователю
  }

  // ===== Gemini API: догадки написания иврита по транскрипции =====
  // Модель не обязана быть точной — она только предлагает "сырые" варианты
  // написания (без никуда), а проверяем их мы сами через уже отлаженный
  // пайплайн Nakdan + niqqudToTranslit, сравнивая с тем, что ввёл человек.
  const GEMINI_URL = 'https://tedabrutranscriptiongemini.3an3arah.workers.dev/';

  async function guessHebrewSpellings(transcription) {
    const response = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcription })
    });
    if (!response.ok) throw new Error('Gemini ответил ошибкой: ' + response.status);
    const json = await response.json();
    const rawText = json.candidates && json.candidates[0] && json.candidates[0].content
      && json.candidates[0].content.parts && json.candidates[0].content.parts[0]
      && json.candidates[0].content.parts[0].text;
    if (!rawText) return [];
    try {
      const arr = JSON.parse(rawText.trim());
      // убираем дубликаты, которые модель иногда выдаёт (как с "шлоша")
      return [...new Set(arr)];
    } catch (e) {
      return [];
    }
  }

  // мапик на финальной ה (например מַחְשָׁבָהּ "её мысль") транскрибируется
  // так же, как обычное слово без него (מַחְשָׁבָה "мысль") — специально, по
  // нашему правилу "финальная ה всегда немая". Но это значит, что дедупликация
  // по транскрипции+грамматике может случайно перепутать обычное слово с его
  // формой "+её/его" — используем этот признак ТОЛЬКО для различения при
  // дедупликации, не для отображения.
  function hasFinalMapiq(text) {
    return /ה\u05BC$/.test(text);
  }

  // сравнение "нестрого" — снимаем ударение, приводим к нижнему регистру,
  // убираем лишние пробелы. ВАЖНО: правила транслитерации Tedabru (й перед
  // гласной, мягкий знак у ламеда, латинская h) — это ТОЛЬКО наш внутренний
  // стандарт для подписи слов, ищущий человек им не обязан следовать, поэтому
  // при сравнении с чужим вводом эти особенности снимаем с обеих сторон.
  function normalizeForCompare(str) {
    return (str || '')
      .toLowerCase()
      .replace(/´|́/g, '')
      .replace(/h/g, '')
      .replace(/й(?=[аеиоуэ])/g, '') // "йелед" ищущий может ввести просто "елед"
      .replace(/ь/g, '') // "лильмод" ищущий может ввести просто "лилмод"
      .trim();
  }

  // расстояние Левенштейна — допускаем небольшую опечатку/расхождение,
  // а не требуем побуквенного совпадения
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = [];
    for (let i = 0; i <= m; i++) dp.push(new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
    return dp[m][n];
  }

  function isFuzzyMatch(candidate, query) {
    const a = normalizeForCompare(candidate);
    const b = normalizeForCompare(query);
    if (a === b) return true;
    const maxLen = Math.max(a.length, b.length);
    const allowedDistance = maxLen <= 4 ? 1 : (maxLen <= 8 ? 2 : 3);
    return levenshtein(a, b) <= allowedDistance;
  }

  let searchGeneration = 0; // счётчик "поколений" запроса — защита от гонки

  // Общая логика обработки и отрисовки кандидатов — используется и мгновенным
  // словарным поиском (при вводе), и поиском через сеть (по кнопке). Отдельно
  // вынесено, чтобы не дублировать дедупликацию/фильтр мусора/рендер дважды.
  function renderCandidatesInto(resultsEl, rawCandidates) {
    if (!rawCandidates.length) {
      resultsEl.innerHTML = '';
      return false;
    }

    // объединяем карточки одного и того же слова с разными значениями в одну
    // (см. mergeCandidatesBySense) — настоящие разные синонимы с одинаковым
    // кратким переводом (רכב/מכונית/אוטו = все "автомобиль") не трогает, у
    // них разное написание/транскрипция, группировка идёт не по переводу
    const uniqueMatches = mergeCandidatesBySense(rawCandidates);

    // тот же признак мусора, что и раньше — перевод почти дословно
    // совпадает с транскрипцией самого слова. Актуально только для
    // API-фоллбэка (у словарных статей такого не бывает, они не
    // "придумываются" DeepL, а берутся из готового словаря).
    const looksLikeFallbackTransliteration = (m) => {
      if (!m.translation) return false;
      const a = normalizeForCompare(m.translation);
      const b = normalizeForCompare(m.translit);
      if (!a || !b) return false;
      return levenshtein(a, b) <= 1;
    };
    const containsLatinScript = (m) => /[a-zA-Z]/.test(m.translation || '');
    // ОБЕ эвристики годятся только для распознавания мусора из API-фоллбэка
    // (DeepL иногда просто эхом возвращает нераспознанное слово или транскрипцию
    // как "перевод"). У настоящих словарных статей (source: 'dict') такого не
    // бывает — а вот латиница у них встречается совершенно законно (например,
    // биологическое название вида в скобках: "лиса (Vulpes vulpes)"), поэтому
    // раньше эти статьи ошибочно прятались в "скрытые результаты"
    const isApiFallback = (m) => m.source === 'hebrew-api' || m.source === 'translation-api';
    const isJunk = (m) => isApiFallback(m) && (looksLikeFallbackTransliteration(m) || containsLatinScript(m));

    const hasGenuineTranslation = uniqueMatches.some(m => !isJunk(m));
    const visibleMatches = hasGenuineTranslation ? uniqueMatches.filter(m => !isJunk(m)) : uniqueMatches;
    const hiddenMatches = hasGenuineTranslation ? uniqueMatches.filter(m => isJunk(m)) : [];

    const rowHtml = (m) => {
      const existing = findExistingWordByHebrew(m.text);
      return `
      <button type="button" class="candidate-row ${existing ? 'already-added' : ''}">
        <div class="candidate-word">${m.text}</div>
        <div class="candidate-translit">${m.translit}</div>
        ${m.grammarLabel ? `<div class="candidate-grammar">${m.grammarLabel}</div>` : ''}
        ${registerBadgeHtml(m.register)}
        ${m.translation ? `<div class="candidate-translation">${m.translation}</div>` : ''}
        ${existing ? `<div class="already-added-badge">${CHECK_ON_ICON}<span>уже добавлено</span></div>` : ''}
      </button>
    `;
    };

    // Основные (не "мусорные") результаты — по образу карточки в личном
    // словаре, но зеркально: слева статус добавлено/не добавлено (вместо
    // избранного), иврит и транскрипция/часть речи справа, дефиниция между
    // ними. Зеркалирование — намеренное: человек должен на глаз отличать,
    // где он сейчас — в поиске или уже в своём словаре, даже при похожем
    // визуальном языке карточек.
    const visibleRowHtml = (m) => {
      const existing = findExistingWordByHebrew(m.text);
      return `
      <button type="button" class="search-result-row" data-hebrew="${encodeURIComponent(m.text)}">
        <div class="icon-btn search-status-icon" style="pointer-events:none;">${existing ? CHECK_ON_ICON : CHECK_OFF_ICON}</div>
        <div class="translation search-definition">${registerBadgeHtml(m.register)}${m.translation || ''}</div>
        <div class="meta-col">
          <div class="translit">${m.translit}</div>
          ${m.grammarLabel ? `<div class="pos">${m.grammarLabel}</div>` : ''}
        </div>
        <div class="hebrew-word">${m.text}</div>
      </button>
    `;
    };

    resultsEl.innerHTML = visibleMatches.map(visibleRowHtml).join('') + (hiddenMatches.length ? `
      <button type="button" class="global-search-btn" id="showHiddenBtn" style="margin:12px auto 0;">
        Скрытые результаты (${hiddenMatches.length})
      </button>
      <div id="hiddenResults" style="display:none;"></div>
    ` : '');

    // Клик по всей строке — добавляет слово в личный словарь одним кликом
    // (в обход модалки добавления), либо, если оно уже там, сразу удаляет —
    // без подтверждения и без отмены: случайные удаления критичны только для
    // ЛИЧНОГО словаря, а не для результатов поиска, которые всегда можно
    // найти заново. Тонкую правку определения человек внесёт уже у себя.
    const attachQuickToggleHandlers = (containerEl) => {
      containerEl.querySelectorAll('.search-result-row').forEach(row => {
        row.addEventListener('click', () => {
          const hebrewText = decodeURIComponent(row.dataset.hebrew);
          const existingWord = findExistingWordByHebrew(hebrewText);
          if (existingWord) {
            words = words.filter(w => w.id !== existingWord.id);
            saveWords();
            row.querySelector('.search-status-icon').innerHTML = CHECK_OFF_ICON;
            showToast('Слово удалено из вашего словаря');
          } else {
            const translitEl = row.querySelector('.translit');
            const posEl = row.querySelector('.pos');
            const defEl = row.querySelector('.search-definition');
            words.unshift({
              id: Date.now(),
              hebrew: hebrewText,
              translit: translitEl ? translitEl.textContent : '',
              pos: grammarLabelToPosValue(posEl ? posEl.textContent : null) || 'сущ, м.р',
              translation: defEl ? defEl.textContent : '',
              favorite: false,
              collectionIds: [],
              addedAt: Date.now()
            });
            saveWords();
            row.querySelector('.search-status-icon').innerHTML = CHECK_ON_ICON;
            showToast('Слово добавлено в ваш словарь');
          }
          renderFilterBar();
          renderList();
        });
      });
    };

    const attachClickHandlers = (containerEl, list) => {
      containerEl.querySelectorAll('.candidate-row').forEach((row, i) => {
        row.addEventListener('click', () => {
          const m = list[i];
          // слово уже в справочнике — из результатов поиска повторно не
          // добавляем (галочка на карточке и так всё объясняет); изменить его
          // можно только через саму карточку слова в списке справочника
          if (findExistingWordByHebrew(m.text)) return;
          enterAddMode(m);
        });
      });
    };

    attachQuickToggleHandlers(resultsEl);

    if (hiddenMatches.length) {
      document.getElementById('showHiddenBtn').addEventListener('click', (e) => {
        const hiddenEl = document.getElementById('hiddenResults');
        hiddenEl.innerHTML = hiddenMatches.map(rowHtml).join('');
        attachClickHandlers(hiddenEl, hiddenMatches);
        hiddenEl.style.display = 'block';
        e.target.remove();
      });
    }
    return true;
  }

  async function runGlobalTranscriptionSearch(query, btn) {
    const myGeneration = ++searchGeneration;
    const resultsEl = document.getElementById('globalSearchResults');
    btn.disabled = true;
    btn.textContent = 'Ищу среди вариантов написания...';
    resultsEl.innerHTML = '';

    // если пока этот запрос летал по сети, стартовал более новый запрос —
    // не даём устаревшему ответу перезаписать уже показанный свежий результат
    const isStale = () => myGeneration !== searchGeneration;

    try {
      const rawCandidates = await resolveCandidates(query);
      if (isStale()) return;
      console.log('[DEBUG] кандидаты от resolveCandidates:', rawCandidates.map(c => ({ text: c.text, source: c.source, translation: c.translation })));
      if (!rawCandidates.length) {
        resultsEl.innerHTML = '<div class="sugg-note">Не удалось найти это слово ни в словаре, ни через перевод.</div>';
        return;
      }
      if (isStale()) return; // за время запроса стартовал более новый поиск — не перезаписываем его результат
      renderCandidatesInto(resultsEl, rawCandidates);
    } catch (err) {
      if (!isStale()) resultsEl.innerHTML = `<div class="sugg-note">Не удалось выполнить поиск (${err.message}).</div>`;
    } finally {
      if (!isStale()) {
        btn.disabled = false;
        btn.textContent = `Искать среди всех слов иврита по транскрипции «${query}»`;
      }
    }
  }


  const nikkudSuggestion = document.getElementById('nikkudSuggestion');

  // сопоставляем grammarLabel (человекочитаемый, из словаря или от Nakdan)
  // со значением <select id="inputPos"> — форматы слегка расходятся
  // ("глагол, пааль" vs просто "пааль"), поэтому не полагаемся на точное
  // совпадение строки целиком
  // Небольшая пометка на карточке — уст./библ., та же метка, что можно
  // проставить через "Редактировать базу". Помогает понять, почему это
  // слово оказалось внизу списка (см. пессимизацию в mergeCandidatesBySense)
  function registerBadgeHtml(register) {
    if (!register) return '';
    const label = register === 'biblical' ? 'библ.' : 'уст.';
    return `<div class="register-badge">${label}</div>`;
  }

  function grammarLabelToPosValue(label) {
    if (!label) return null;
    if (label.startsWith('глагол, ')) {
      const binyan = label.slice('глагол, '.length);
      return binyan || null;
    }
    const direct = ['сущ, м.р', 'сущ, ж.р', 'прил', 'местоим', 'числ', 'нареч'];
    return direct.includes(label) ? label : null;
  }

  let metaSuggestGeneration = 0; // защита от гонки при живом наборе — устаревший ответ не перезаписывает более новый ввод
  let metaSuggestDebounceTimer = null;

  // Подбор меты по мере ввода — единственный способ вызвать её теперь
  // (кнопка "Подобрать мету" была не нужна: подсказки и так всплывают
  // вживую, см. подписку на 'input' на inputHebrew ниже)
  async function runMetaSuggestion(raw) {
    const myGeneration = ++metaSuggestGeneration;
    nikkudSuggestion.className = 'nikkud-suggestion';

    try {
      const candidates = await resolveCandidates(raw);
      if (myGeneration !== metaSuggestGeneration) return; // за время запроса ввод уже изменился

      if (!candidates.length) {
        nikkudSuggestion.classList.add('visible');
        nikkudSuggestion.innerHTML = '<div class="sugg-note">Не удалось найти это слово ни в словаре, ни через перевод.</div>';
        return;
      }

      // объединяем карточки одного и того же слова с разными значениями в одну
      // пронумерованную (см. mergeCandidatesBySense) — иначе одно и то же
      // слово ("матбеа" = и "монета", и "валюта") показывалось бы отдельными
      // карточками, из которых пришлось бы наугад выбирать одну для сохранения
      const uniqueCandidates = mergeCandidatesBySense(candidates);

      // при нечётком поиске по транскрипции (fuzzyMatchTranslitIndex) кандидатов
      // может быть по-настоящему много — все они "похожи" по расстоянию
      // Левенштейна, но за экраном без прокрутки нужного слова уже не видно.
      // Кандидаты уже отсортированы от наиболее к наименее вероятному, так что
      // просто показываем первые 5, а остальное отбрасываем
      const finalCandidates = uniqueCandidates.slice(0, 5);

      nikkudSuggestion.innerHTML = finalCandidates.map((c, i) => {
        const existing = findExistingWordByHebrew(c.text);
        return `
        <button type="button" class="candidate-row ${existing ? 'already-added' : ''}" data-index="${i}">
          <div class="candidate-word">${c.text}</div>
          <div class="candidate-translit">${c.translit}</div>
          ${c.grammarLabel ? `<div class="candidate-grammar">${c.grammarLabel}</div>` : ''}
          ${registerBadgeHtml(c.register)}
          ${c.translation ? `<div class="candidate-translation">${c.translation}</div>` : ''}
          ${existing ? `<div class="already-added-badge">${CHECK_ON_ICON}<span>уже добавлено</span></div>` : ''}
        </button>
      `;
      }).join('') + (uniqueCandidates.length > finalCandidates.length ? `
        <div class="sugg-note" style="margin-top:8px;">Показаны 5 наиболее вероятных вариантов из ${uniqueCandidates.length}.</div>
      ` : '');
      nikkudSuggestion.classList.add('visible');

      nikkudSuggestion.querySelectorAll('.candidate-row').forEach((row, i) => {
        row.addEventListener('click', () => {
          const c = finalCandidates[i];
          inputHebrew.value = c.text;
          inputTranslit.value = c.translit;
          const posValue = grammarLabelToPosValue(c.grammarLabel);
          if (posValue) inputPos.value = posValue;
          if (c.translation) inputTranslation.value = c.translation;
          updateSaveState();
        });
      });
    } catch (err) {
      if (myGeneration !== metaSuggestGeneration) return;
      nikkudSuggestion.classList.add('visible', 'error');
      nikkudSuggestion.innerHTML = `
        <div class="sugg-note">
          Не удалось получить никуд автоматически (${err.message}).
          Возможно, сервер блокирует прямые запросы из браузера (CORS) — введите слово и транскрипцию вручную.
        </div>
      `;
    }
  }

  // ===== Встроенное добавление слова (без модалки) =====
  const addWordPanel = document.getElementById('addWordPanel');
  const inputHebrew = document.getElementById('searchInput'); // тот же инпут, что и обычный поиск
  const inputTranslit = document.getElementById('inputTranslit');
  const inputPos = document.getElementById('inputPos');
  const inputTranslation = document.getElementById('inputTranslation');
  const saveBtn = document.getElementById('saveBtn');

  // prefill (необязателен) — {text, translit, grammarLabel, translation}, тот
  // же формат, что и у кандидата из поиска: используется, когда входим в
  // режим добавления кликом по ещё не сохранённому слову в результатах поиска
  function enterAddMode(prefill) {
    if (selectionMode || editDbMode || trainMode) return; // не пересекаемся с другими режимами
    addMode = true;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = 'none';
    document.getElementById('trainModeBtn').style.display = 'none';
    filterBarEl.style.display = 'none';
    wordListEl.style.display = 'none';
    addWordPanel.style.display = '';
    setBulkMode(false); // всегда открываемся в одиночном режиме
    bulkTargetCollectionIds = new Set();
    bulkCreatingCollectionInline = false;
    renderBulkCollectionChips();
    inputHebrew.placeholder = 'Впишите слово, транскрипцию или перевод';
    inputHebrew.setAttribute('dir', 'rtl');
    clearTimeout(metaSuggestDebounceTimer);
    metaSuggestGeneration++; // инвалидируем любой ещё летящий запрос от прошлого раза
    nikkudSuggestion.classList.remove('visible', 'error');
    nikkudSuggestion.innerHTML = '';

    if (prefill) {
      inputHebrew.value = prefill.text || '';
      inputTranslit.value = prefill.translit || '';
      const posValue = grammarLabelToPosValue(prefill.grammarLabel);
      if (posValue) inputPos.value = posValue; else inputPos.selectedIndex = 0;
      inputTranslation.value = prefill.translation || '';
    } else {
      inputHebrew.value = '';
      inputTranslit.value = '';
      inputTranslation.value = '';
      inputPos.selectedIndex = 0;
      setTimeout(() => inputHebrew.focus(), 50);
    }
    updateSaveState();
  }

  function exitAddMode() {
    if (bulkAddRunning) return; // не выходим, пока идёт массовое добавление — сначала "Остановить"
    addMode = false;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = '';
    document.getElementById('trainModeBtn').style.display = '';
    filterBarEl.style.display = '';
    wordListEl.style.display = '';
    addWordPanel.style.display = 'none';
    inputHebrew.placeholder = defaultSearchPlaceholder();
    inputHebrew.removeAttribute('dir');
    clearTimeout(metaSuggestDebounceTimer);
    metaSuggestGeneration++;
    searchQuery = '';
    inputHebrew.value = '';
    renderFilterBar();
    renderList();
  }

  // ===== Редактирование базы (пишет прямо на GitHub) =====
  const editDbPanel = document.getElementById('editDbPanel');
  const editDbResultsEl = document.getElementById('editDbResults');
  const editDbStatusEl = document.getElementById('editDbStatus');
  const editDbSaveGithubBtn = document.getElementById('editDbSaveGithubBtn');
  const editDbAddNewToggle = document.getElementById('editDbAddNewToggle');
  const editDbAddNewForm = document.getElementById('editDbAddNewForm');
  const editDbNewWord = document.getElementById('editDbNewWord');
  const editDbNewPos = document.getElementById('editDbNewPos');
  const editDbNewGloss = document.getElementById('editDbNewGloss');
  const editDbNewRegister = document.getElementById('editDbNewRegister');
  const editDbAddNewCancel = document.getElementById('editDbAddNewCancel');
  const editDbAddNewSubmit = document.getElementById('editDbAddNewSubmit');

  let editDbDirtyFiles = new Set(); // 'hebrewDict' | 'verbsDict' — какие файлы нужно будет закоммитить
  let editDbCurrentSkeleton = null; // скелет для "добавить новое значение" — только при точном поиске по ивриту в обычном словаре

  function markEditDbDirty(source) {
    editDbDirtyFiles.add(source);
    editDbSaveGithubBtn.disabled = false;
  }

  function enterEditDbMode() {
    if (selectionMode || addMode || trainMode) return; // не пересекаемся с другими режимами
    editDbMode = true;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = 'none';
    document.getElementById('trainModeBtn').style.display = 'none';
    filterBarEl.style.display = 'none';
    wordListEl.style.display = 'none';
    editDbPanel.style.display = '';
    inputHebrew.placeholder = 'Найдите слово, которое хотите отредактировать';
    inputHebrew.removeAttribute('dir'); // ищем и по-русски, и по ивриту — направление лучше оставить нейтральным
    inputHebrew.value = '';
    editDbResultsEl.innerHTML = '';
    editDbStatusEl.textContent = '';
    editDbDirtyFiles = new Set();
    editDbSaveGithubBtn.disabled = true;
    editDbCurrentSkeleton = null;
    editDbAddNewToggle.style.display = 'none';
    editDbAddNewForm.style.display = 'none';
    setTimeout(() => inputHebrew.focus(), 50);
  }

  function exitEditDbMode() {
    if (editDbDirtyFiles.size) {
      showActionModal({
        title: 'Есть несохранённые правки',
        message: 'Правки применены только в этой вкладке и пропадут при перезагрузке страницы, если не сохранить их в GitHub. Выйти без сохранения?',
        buttons: [
          { label: 'Остаться', variant: 'cancel' },
          { label: 'Выйти без сохранения', variant: 'danger', action: () => actuallyExitEditDbMode() },
        ]
      });
      return;
    }
    actuallyExitEditDbMode();
  }

  function actuallyExitEditDbMode() {
    editDbMode = false;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = '';
    document.getElementById('trainModeBtn').style.display = '';
    filterBarEl.style.display = '';
    wordListEl.style.display = '';
    editDbPanel.style.display = 'none';
    inputHebrew.placeholder = defaultSearchPlaceholder();
    inputHebrew.value = '';
    searchQuery = '';
    renderFilterBar();
    renderList();
  }

  // Ищет РЕДАКТИРУЕМЫЕ записи — напрямую в hebrewDictSkeleton/verbsDict (не
  // через весь конвейер resolveCandidates с его сетевыми фоллбэками): тут
  // нужны именно сырые записи для правки, а не "лучший кандидат"
  // Нечёткий поиск скелетов по транскрипции — та же логика дистанции, что и
  // в fuzzyMatchTranslitIndex, но возвращает СКЕЛЕТЫ, а не готовые кандидаты
  // (для редактора базы нужны именно сырые записи, а не "лучший вариант")
  function findSkeletonsByTranslit(raw) {
    if (!translitIndex) return [];
    const query = normalizeForCompare(raw);
    if (!query) return [];
    const skeletonDistance = new Map();
    for (const key in translitIndex) {
      const dist = levenshtein(key, query);
      const maxLen = Math.max(key.length, query.length);
      const allowedDistance = maxLen <= 4 ? 1 : (maxLen <= 8 ? 2 : 3);
      if (dist > allowedDistance) continue;
      for (const entry of translitIndex[key]) {
        const cur = skeletonDistance.get(entry.skeleton);
        if (cur === undefined || dist < cur) skeletonDistance.set(entry.skeleton, dist);
      }
    }
    return Array.from(skeletonDistance.entries()).sort((a, b) => a[1] - b[1]).map(([skeleton]) => skeleton);
  }

  function findEditableEntries(raw) {
    const results = [];
    if (!raw) { editDbCurrentSkeleton = null; return results; }
    if (containsHebrew(raw)) {
      const skeleton = stripNiqqud(raw).normalize('NFC');
      (hebrewDictSkeleton[skeleton] || []).forEach(entry => results.push({ entry, source: 'hebrewDict' }));
      (verbsDict[skeleton] || []).forEach(entry => results.push({ entry, source: 'verbsDict' }));
      // "добавить новое значение" — только когда искали ТОЧНО по ивриту и в
      // обычном словаре (не в базе глаголов — там инфинитив ключевое слово,
      // и добавление через эту форму не подойдёт по структуре данных)
      editDbCurrentSkeleton = skeleton; // разрешаем добавить значение — и к существующему скелету, и к совсем новому
    } else {
      const key = raw.toLowerCase();
      const seen = new Set();
      (hebrewDictReverse[key] || []).forEach(entry => {
        results.push({ entry, source: 'hebrewDict' });
        seen.add(entry);
      });
      (verbsReverse[key] || []).forEach(entry => {
        results.push({ entry, source: 'verbsDict' });
        seen.add(entry);
      });
      // плюс поиск по транскрипции (нечёткий) — не заменяет поиск по
      // переводу, а дополняет его: пригодится, когда ищут слово по тому, как
      // оно звучит, а не по тому, что оно значит
      const skeletons = findSkeletonsByTranslit(raw).slice(0, 5);
      for (const skeleton of skeletons) {
        (hebrewDictSkeleton[skeleton] || []).forEach(entry => {
          if (!seen.has(entry)) { results.push({ entry, source: 'hebrewDict' }); seen.add(entry); }
        });
        (verbsDict[skeleton] || []).forEach(entry => {
          if (!seen.has(entry)) { results.push({ entry, source: 'verbsDict' }); seen.add(entry); }
        });
      }
      editDbCurrentSkeleton = null; // поиск по переводу/транскрипции может найти несколько разных слов — нет однозначного адресата для нового значения
    }
    return results;
  }

  function renderEditDbResults(raw) {
    const results = findEditableEntries(raw);
    if (!raw) {
      editDbResultsEl.innerHTML = '';
      editDbAddNewToggle.style.display = 'none';
      editDbAddNewForm.style.display = 'none';
      return;
    }
    if (!results.length) {
      editDbResultsEl.innerHTML = '<div class="sugg-note">Ничего не найдено в редактируемых базах. Если слова совсем нет — можно завести первое значение для него кнопкой ниже.</div>';
    } else {
      editDbResultsEl.innerHTML = results.map((r, i) => {
        const entry = r.entry;
        const textField = r.source === 'hebrewDict' ? 'gloss_ru' : 'translation';
        const posLabel = r.source === 'hebrewDict' ? grammarLabelForEntry(entry) : (BINYAN_LABELS[entry.binyan] || entry.binyan || 'глагол');
        return `
        <div class="edit-db-entry" data-index="${i}">
          <div class="edit-db-entry-head">
            <span class="edit-db-word">${entry.word}</span>
            <span class="edit-db-pos">${posLabel}</span>
          </div>
          <textarea class="edit-db-gloss" data-index="${i}">${entry[textField] || ''}</textarea>
          <select class="edit-db-register" data-index="${i}">
            <option value="" ${!entry.register ? 'selected' : ''}>обычное</option>
            <option value="archaic" ${entry.register === 'archaic' ? 'selected' : ''}>устаревшее</option>
            <option value="biblical" ${entry.register === 'biblical' ? 'selected' : ''}>библейское</option>
          </select>
        </div>
      `;
      }).join('');

      const applyEdit = (i) => {
        const r = results[i];
        const entry = r.entry;
        const textField = r.source === 'hebrewDict' ? 'gloss_ru' : 'translation';
        const row = editDbResultsEl.querySelector(`.edit-db-entry[data-index="${i}"]`);
        const textarea = row.querySelector('.edit-db-gloss');
        const select = row.querySelector('.edit-db-register');
        const newGloss = textarea.value.trim();
        const newRegister = select.value || null;
        if (entry[textField] === newGloss && (entry.register || null) === newRegister) return; // ничего не поменялось
        entry[textField] = newGloss;
        entry.register = newRegister;
        row.classList.add('edit-db-dirty');
        markEditDbDirty(r.source);
        // обратный индекс мог "протухнуть" (изменился перевод) — перестраиваем
        if (r.source === 'hebrewDict') hebrewDictReverse = buildReverseIndex(hebrewDictSkeleton, 'gloss_ru');
        else verbsReverse = buildReverseIndex(verbsDict, 'translation');
      };

      editDbResultsEl.querySelectorAll('.edit-db-gloss').forEach(ta => {
        ta.addEventListener('blur', () => applyEdit(parseInt(ta.dataset.index)));
      });
      editDbResultsEl.querySelectorAll('.edit-db-register').forEach(sel => {
        sel.addEventListener('change', () => applyEdit(parseInt(sel.dataset.index)));
      });
    }

    if (editDbCurrentSkeleton) {
      editDbAddNewToggle.style.display = '';
    } else {
      editDbAddNewToggle.style.display = 'none';
      editDbAddNewForm.style.display = 'none';
    }
  }

  editDbAddNewToggle.addEventListener('click', () => {
    const showing = editDbAddNewForm.style.display !== 'none';
    editDbAddNewForm.style.display = showing ? 'none' : '';
    if (!showing) {
      editDbNewWord.value = '';
      editDbNewGloss.value = '';
      editDbNewPos.selectedIndex = 0;
      editDbNewRegister.selectedIndex = 0;
      setTimeout(() => editDbNewWord.focus(), 50);
    }
  });
  editDbAddNewCancel.addEventListener('click', () => {
    editDbAddNewForm.style.display = 'none';
  });
  editDbAddNewSubmit.addEventListener('click', () => {
    const word = editDbNewWord.value.trim();
    const gloss = editDbNewGloss.value.trim();
    if (!word || !gloss || !editDbCurrentSkeleton) return;
    const posVal = editDbNewPos.value;
    let pos = 'other', gender = null;
    if (posVal === 'noun-m') { pos = 'noun'; gender = 'm'; }
    else if (posVal === 'noun-f') { pos = 'noun'; gender = 'f'; }
    else if (posVal === 'adj') { pos = 'adj'; }
    const register = editDbNewRegister.value || null;

    const newEntry = { word, pos, tr: '', gloss: '', gloss_ru: gloss, register };
    if (gender) newEntry.gender = gender;

    if (!hebrewDictSkeleton[editDbCurrentSkeleton]) hebrewDictSkeleton[editDbCurrentSkeleton] = [];
    hebrewDictSkeleton[editDbCurrentSkeleton].push(newEntry);
    hebrewDictEntrySkeleton.set(newEntry, editDbCurrentSkeleton);
    hebrewDictReverse = buildReverseIndex(hebrewDictSkeleton, 'gloss_ru');
    markEditDbDirty('hebrewDict');

    editDbAddNewForm.style.display = 'none';
    showToast('Значение добавлено — не забудьте «Сохранить в GitHub»');
    renderEditDbResults(inputHebrew.value.trim());
  });

  editDbSaveGithubBtn.addEventListener('click', async () => {
    if (!editDbDirtyFiles.size) return;
    const token = await ensureGithubToken();
    if (!token) return;
    await performEditDbSave();
  });

  async function performEditDbSave() {
    editDbSaveGithubBtn.disabled = true;
    editDbStatusEl.textContent = 'Проверяю, не изменился ли файл на GitHub тем временем…';

    const filesToPush = [];
    if (editDbDirtyFiles.has('hebrewDict')) filesToPush.push({ key: 'hebrewDict', path: 'hebrew_dict_v3.json', data: hebrewDictSkeleton });
    if (editDbDirtyFiles.has('verbsDict')) filesToPush.push({ key: 'verbsDict', path: 'verbs_dict.json', data: verbsDict });

    try {
      // Грубая проверка конфликта: сравниваем число ключей в файле НА GITHUB
      // прямо сейчас с тем, что было при открытии страницы. Не ловит правку
      // уже существующего значения без изменения числа ключей — но при
      // сценарии "мы вдвоём" этого достаточно, чтобы поймать самый частый
      // случай (кто-то параллельно что-то добавил/удалил), не усложняя код
      // построчным сравнением всего файла.
      const fileMap = {};
      for (const f of filesToPush) {
        const current = await fetchCurrentFileFromGithub(f.path);
        const currentKeyCount = Object.keys(current).length;
        const knownKeyCount = f.key === 'hebrewDict' ? hebrewDictKeyCountAtLoad : verbsDictKeyCountAtLoad;
        if (knownKeyCount !== null && currentKeyCount !== knownKeyCount) {
          editDbStatusEl.textContent = '';
          editDbSaveGithubBtn.disabled = false;
          showActionModal({
            title: 'Файл изменился на GitHub',
            message: `${f.path} на GitHub сейчас отличается от того, что было при открытии страницы — похоже, кто-то ещё внёс правку. Перезагрузите страницу и повторите правки заново поверх актуальной версии, чтобы не затереть чужие изменения.`,
            buttons: [{ label: 'Понятно', variant: 'primary' }]
          });
          return;
        }
        fileMap[f.path] = f.data;
      }

      editDbStatusEl.textContent = 'Сохраняю в GitHub…';
      await commitFilesToGithub(fileMap, `Правки базы через редактор (${filesToPush.map(f => f.path).join(', ')})`);
      editDbDirtyFiles = new Set();
      editDbResultsEl.querySelectorAll('.edit-db-entry.edit-db-dirty').forEach(el => el.classList.remove('edit-db-dirty'));
      editDbStatusEl.textContent = 'Сохранено ✓';
      showToast('Правки сохранены в GitHub');
    } catch (err) {
      if (err.status === 401 || err.status === 403) {
        // ghRequest уже стёр неверный токен сам — тут же переспрашиваем и,
        // если ввели новый, сразу повторяем сохранение этим же кликом,
        // не заставляя нажимать "Сохранить в GitHub" второй раз
        editDbStatusEl.textContent = 'Токен неверный или устарел.';
        const newToken = await ensureGithubToken();
        if (newToken) {
          await performEditDbSave();
          return;
        }
      } else {
        editDbStatusEl.textContent = 'Не удалось сохранить: ' + err.message;
      }
    } finally {
      editDbSaveGithubBtn.disabled = editDbDirtyFiles.size === 0;
    }
  }

  // На случай, если вы ЗНАЕТЕ заранее, что токен неверный/просрочен, и не
  // хотите ждать неудачной попытки сохранения — можно сменить его вручную
  document.getElementById('editDbChangeTokenBtn').addEventListener('click', () => {
    setGithubToken('');
    ensureGithubToken();
  });

  // ===== Слова без огласовок: поиск + массовая озвучка через Nakdan =====
  const HAS_NIQQUD_RE = /[\u0591-\u05C7]/;
  let missingNiqqudList = [];    // [{ skeleton, entry }]
  let missingNiqqudResults = []; // [{ skeleton, entry, suggested }]

  document.getElementById('findMissingNiqqudBtn').addEventListener('click', () => {
    missingNiqqudList = [];
    for (const skeleton in hebrewDictSkeleton) {
      for (const entry of hebrewDictSkeleton[skeleton]) {
        if (entry.word && !HAS_NIQQUD_RE.test(entry.word)) {
          missingNiqqudList.push({ skeleton, entry });
        }
      }
    }
    missingNiqqudResults = [];
    document.getElementById('missingNiqqudPanel').style.display = '';
    document.getElementById('missingNiqqudResults').innerHTML = '';
    document.getElementById('missingNiqqudApplyRow').style.display = 'none';
    document.getElementById('missingNiqqudStatus').textContent =
      missingNiqqudList.length
        ? `Найдено без огласовок: ${missingNiqqudList.length}. Нажмите «Озвучить все».`
        : 'Слов без огласовок не найдено.';
  });

  document.getElementById('missingNiqqudCancelBtn').addEventListener('click', () => {
    document.getElementById('missingNiqqudPanel').style.display = 'none';
  });

  document.getElementById('missingNiqqudRunBtn').addEventListener('click', async () => {
    if (!missingNiqqudList.length) return;
    const runBtn = document.getElementById('missingNiqqudRunBtn');
    const statusEl = document.getElementById('missingNiqqudStatus');
    runBtn.disabled = true;
    missingNiqqudResults = [];

    for (let i = 0; i < missingNiqqudList.length; i++) {
      const { skeleton, entry } = missingNiqqudList[i];
      statusEl.textContent = `Озвучиваю ${i + 1} из ${missingNiqqudList.length}: «${entry.word}»…`;
      let suggested = null;
      try {
        const tokens = await fetchNikkud(entry.word);
        const candidates = buildCandidates(tokens);
        suggested = (candidates[0] && candidates[0].text) || null;
      } catch (e) {
        suggested = null; // сеть подвела/Nakdan не смог — просто не предлагаем вариант, отмечаем как "не удалось"
      }
      missingNiqqudResults.push({ skeleton, entry, suggested });
    }

    renderMissingNiqqudResults();
    const okCount = missingNiqqudResults.filter(r => r.suggested).length;
    statusEl.textContent = `Готово: озвучено ${okCount} из ${missingNiqqudResults.length}. Проверьте список ниже и нажмите «Применить отмеченные».`;
    runBtn.disabled = false;
    document.getElementById('missingNiqqudApplyRow').style.display = '';
  });

  function renderMissingNiqqudResults() {
    const el = document.getElementById('missingNiqqudResults');
    el.innerHTML = missingNiqqudResults.map((r, i) => {
      const ok = !!r.suggested;
      return `
        <div class="edit-db-entry">
          <label style="display:flex; align-items:flex-start; gap:10px; cursor:${ok ? 'pointer' : 'default'};">
            <input type="checkbox" data-niqqud-index="${i}" ${ok ? 'checked' : 'disabled'} style="margin-top:4px;" />
            <span>
              <div class="edit-db-word" style="direction:rtl; font-size:17px;">${r.entry.word} → ${ok ? r.suggested : '<em style="font-family:\'Inter\',sans-serif; font-size:13px; color:var(--muted);">не удалось озвучить</em>'}</div>
              <div style="font-family:'Inter',sans-serif; font-size:12px; color:var(--muted); margin-top:2px;">${r.entry.gloss_ru || ''}</div>
            </span>
          </label>
        </div>
      `;
    }).join('');
  }

  document.getElementById('missingNiqqudApplyBtn').addEventListener('click', () => {
    const checkboxes = document.querySelectorAll('[data-niqqud-index]');
    let applied = 0;
    checkboxes.forEach(cb => {
      if (!cb.checked) return;
      const r = missingNiqqudResults[parseInt(cb.dataset.niqqudIndex)];
      if (r && r.suggested) {
        r.entry.word = r.suggested;
        applied++;
      }
    });
    if (applied) {
      hebrewDictReverse = buildReverseIndex(hebrewDictSkeleton, 'gloss_ru');
      markEditDbDirty('hebrewDict');
      showToast(`Применено: ${applied}. Не забудьте «Сохранить в GitHub».`);
    }
    document.getElementById('missingNiqqudPanel').style.display = 'none';
  });

  // ===== Тренировка (интервальные повторения, SM-2-подобный алгоритм) =====
  // Данные SRS хранятся прямо в объекте слова (localStorage), в поле srs —
  // никак не связаны с общей базой на GitHub. Одно состояние SRS на слово
  // (не отдельно по направлениям иврит→рус / рус→иврит) — сознательное
  // упрощение для первой версии.
  const SRS_DAY_MS = 24 * 60 * 60 * 1000;
  const SRS_NEW_LIMIT_KEY = 'tedabru_srs_new_today';

  function initSrs() {
    return { interval: 0, ease: 2.5, reps: 0, dueDate: null, learning: true };
  }

  function isWordNew(word) {
    return !word.srs || word.srs.dueDate == null;
  }
  function isWordDue(word, now) {
    return word.srs && word.srs.dueDate != null && word.srs.dueDate <= now;
  }

  function getTodayNewCount() {
    const raw = localStorage.getItem(SRS_NEW_LIMIT_KEY);
    if (!raw) return 0;
    try {
      const data = JSON.parse(raw);
      const today = new Date().toISOString().slice(0, 10);
      return data.date === today ? (data.count || 0) : 0;
    } catch (e) { return 0; }
  }
  function addTodayNewCount(n) {
    const today = new Date().toISOString().slice(0, 10);
    const cur = getTodayNewCount();
    localStorage.setItem(SRS_NEW_LIMIT_KEY, JSON.stringify({ date: today, count: cur + n }));
  }

  function formatIntervalDays(days) {
    if (days < 1) return 'сегодня';
    if (days === 1) return '1 день';
    if (days < 7) return days + ' дн.';
    if (days < 30) return Math.round(days / 7) + ' нед.';
    return Math.round(days / 30) + ' мес.';
  }

  // Показывает, что БУДЕТ, если нажать эту кнопку — не меняя реального
  // состояния слова (нужно только для подписи на кнопках оценки)
  function previewRatingLabel(word, rating) {
    const srs = word.srs || initSrs();
    if (srs.learning) {
      if (rating === 'again' || rating === 'hard') return 'скоро';
      if (rating === 'good') return '1 день';
      return '4 дня'; // easy
    }
    if (rating === 'again') return 'скоро';
    if (rating === 'hard') return formatIntervalDays(Math.max(1, Math.round(srs.interval * 1.2)));
    if (rating === 'good') return formatIntervalDays(Math.max(1, Math.round(srs.interval * srs.ease)));
    return formatIntervalDays(Math.max(1, Math.round(srs.interval * srs.ease * 1.3))); // easy
  }

  // Собственно алгоритм — SM-2-подобный, как в Anki. "Не помню"/"Трудно" у
  // совсем новой карточки держат её в "обучении" (снова покажется в этой же
  // сессии, а не через дни) — упрощённая версия учебных шагов Anki без
  // привязки к реальным минутам, раз это веб-сессия, а не постоянно
  // открытое приложение с фоновым таймером.
  function rateWord(word, rating) {
    const srs = word.srs || (word.srs = initSrs());
    const now = Date.now();

    if (srs.learning) {
      if (rating === 'again' || rating === 'hard') {
        return { requeue: true };
      }
      srs.learning = false;
      srs.reps = 1;
      srs.interval = rating === 'easy' ? 4 : 1;
      srs.dueDate = now + srs.interval * SRS_DAY_MS;
      return { requeue: false };
    }

    if (rating === 'again') {
      srs.reps = 0;
      srs.ease = Math.max(1.3, srs.ease - 0.2);
      srs.interval = 0;
      srs.learning = true;
      return { requeue: true };
    }
    if (rating === 'hard') {
      srs.ease = Math.max(1.3, srs.ease - 0.15);
      srs.interval = Math.max(1, Math.round(srs.interval * 1.2));
    } else if (rating === 'good') {
      srs.interval = Math.max(1, Math.round(srs.interval * srs.ease));
    } else {
      srs.ease = srs.ease + 0.15;
      srs.interval = Math.max(1, Math.round(srs.interval * srs.ease * 1.3));
    }
    srs.reps++;
    srs.dueDate = now + srs.interval * SRS_DAY_MS;
    return { requeue: false };
  }

  // ===== Вход/выход из режима =====
  const trainPanelEl = document.getElementById('trainPanel');
  const trainSetupEl = document.getElementById('trainSetup');
  const trainSessionEl = document.getElementById('trainSession');
  const trainSummaryEl = document.getElementById('trainSummary');

  document.getElementById('trainModeBtn').addEventListener('click', () => {
    if (selectionMode || addMode || editDbMode) return;
    if (trainMode) { exitTrainMode(); return; }
    enterTrainMode();
  });

  function enterTrainMode() {
    if (selectionMode || addMode || editDbMode) return;
    trainMode = true;
    trainSessionActive = false;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = 'none';
    document.getElementById('editDbBtn').style.display = 'none';
    filterBarEl.style.display = 'none';
    wordListEl.style.display = 'none';
    trainPanelEl.style.display = '';
    showTrainSetup();
  }

  function exitTrainMode() {
    if (trainSessionActive) {
      showActionModal({
        title: 'Прервать тренировку?',
        message: 'Прогресс по уже отвеченным карточкам уже сохранён — но текущая сессия закроется, и оставшиеся карточки сейчас показаны не будут.',
        buttons: [
          { label: 'Остаться', variant: 'cancel' },
          { label: 'Прервать', variant: 'danger', action: () => actuallyExitTrainMode() },
        ]
      });
      return;
    }
    actuallyExitTrainMode();
  }

  function actuallyExitTrainMode() {
    trainMode = false;
    trainSessionActive = false;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = '';
    document.getElementById('editDbBtn').style.display = '';
    filterBarEl.style.display = '';
    wordListEl.style.display = '';
    trainPanelEl.style.display = 'none';
    renderFilterBar();
    renderList();
  }

  // ===== Экран настройки =====
  function showTrainSetup() {
    trainSetupEl.style.display = '';
    trainSessionEl.style.display = 'none';
    trainSummaryEl.style.display = 'none';
    document.getElementById('trainSetupStatus').textContent = '';
    renderTrainCollectionChips();
    if (trainScope === 'manual') renderTrainManualList();
  }

  document.querySelectorAll('#trainScopeChips [data-scope]').forEach(btn => {
    btn.addEventListener('click', () => {
      trainScope = btn.dataset.scope;
      document.querySelectorAll('#trainScopeChips [data-scope]').forEach(b => b.classList.toggle('active', b.dataset.scope === trainScope));
      document.getElementById('trainCollectionPickerWrap').style.display = trainScope === 'collection' ? '' : 'none';
      document.getElementById('trainManualPickerWrap').style.display = trainScope === 'manual' ? '' : 'none';
      if (trainScope === 'manual') renderTrainManualList();
    });
  });

  function renderTrainCollectionChips() {
    const el = document.getElementById('trainCollectionChips');
    if (!collections.length) {
      el.innerHTML = '<span style="font-family:\'Inter\',sans-serif; font-size:13px; color:var(--muted);">Подборок пока нет</span>';
      return;
    }
    el.innerHTML = collections.map(c =>
      `<button type="button" class="chip ${trainCollectionId === c.id ? 'active' : ''}" data-train-coll="${c.id}">${c.name}</button>`
    ).join('');
    el.querySelectorAll('[data-train-coll]').forEach(btn => {
      btn.addEventListener('click', () => {
        trainCollectionId = btn.dataset.trainColl;
        renderTrainCollectionChips();
      });
    });
  }

  function renderTrainManualList() {
    const el = document.getElementById('trainManualList');
    if (!words.length) {
      el.innerHTML = '<div style="padding:12px; font-family:\'Inter\',sans-serif; font-size:13px; color:var(--muted);">В словаре пока нет слов</div>';
    } else {
      el.innerHTML = words.map(w => `
        <label class="train-manual-row">
          <input type="checkbox" data-train-manual="${w.id}" ${trainManualSelectedIds.has(w.id) ? 'checked' : ''} />
          <span class="train-manual-hebrew">${w.hebrew}</span>
          <span class="train-manual-translation">${w.translation}</span>
        </label>
      `).join('');
      el.querySelectorAll('[data-train-manual]').forEach(cb => {
        cb.addEventListener('change', () => {
          const id = parseInt(cb.dataset.trainManual);
          if (cb.checked) trainManualSelectedIds.add(id); else trainManualSelectedIds.delete(id);
          document.getElementById('trainManualCount').textContent = trainManualSelectedIds.size;
        });
      });
    }
    document.getElementById('trainManualCount').textContent = trainManualSelectedIds.size;
  }

  document.querySelectorAll('#trainDirectionChips [data-direction]').forEach(btn => {
    btn.addEventListener('click', () => {
      trainDirection = btn.dataset.direction;
      document.querySelectorAll('#trainDirectionChips [data-direction]').forEach(b => b.classList.toggle('active', b.dataset.direction === trainDirection));
      document.getElementById('trainNiqqudFieldWrap').style.display = trainDirection === 'he-ru' ? '' : 'none';
    });
  });

  document.getElementById('trainShowNiqqud').addEventListener('change', (e) => {
    trainShowNiqqud = e.target.checked;
  });

  function getTrainCandidateWords() {
    if (trainScope === 'all') return words.slice();
    if (trainScope === 'collection') {
      if (!trainCollectionId) return [];
      return words.filter(w => (w.collectionIds || []).includes(trainCollectionId));
    }
    return words.filter(w => trainManualSelectedIds.has(w.id)); // manual
  }

  document.getElementById('trainStartBtn').addEventListener('click', () => {
    const candidates = getTrainCandidateWords();
    const statusEl = document.getElementById('trainSetupStatus');
    if (!candidates.length) {
      statusEl.textContent = 'Нечего тренировать — сначала выберите слова.';
      return;
    }

    const now = Date.now();
    const due = candidates.filter(w => isWordDue(w, now));
    const brandNew = candidates.filter(w => isWordNew(w));

    const newLimitRaw = parseInt(document.getElementById('trainNewLimit').value, 10);
    const newLimit = isNaN(newLimitRaw) || newLimitRaw < 0 ? Infinity : newLimitRaw;
    const alreadyToday = getTodayNewCount();
    const remainingNewSlots = newLimit === Infinity ? Infinity : Math.max(0, newLimit - alreadyToday);
    const newToInclude = remainingNewSlots === Infinity ? brandNew : brandNew.slice(0, remainingNewSlots);

    let queue = due.concat(newToInclude);
    queue = Array.from(new Set(queue)); // на случай пересечения — не должно, но на всякий случай

    if (!queue.length) {
      statusEl.textContent = 'На сейчас повторять нечего — все выбранные слова либо уже отвечены сегодня, либо ждут своей даты. Загляните позже.';
      return;
    }

    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }

    if (newToInclude.length) addTodayNewCount(newToInclude.length);

    trainQueue = queue;
    trainQueueIndex = 0;
    trainSessionStats = { studied: 0, again: 0, hard: 0, good: 0, easy: 0 };
    trainSessionActive = true;
    startTrainSession();
  });

  // ===== Сама сессия =====
  function startTrainSession() {
    trainSetupEl.style.display = 'none';
    trainSummaryEl.style.display = 'none';
    trainSessionEl.style.display = '';
    showNextTrainCard();
  }

  function showNextTrainCard() {
    if (trainQueueIndex >= trainQueue.length) {
      finishTrainSession();
      return;
    }
    trainCurrentWord = trainQueue[trainQueueIndex];
    trainAnswerShown = false;
    renderTrainCard();
  }

  function renderTrainCard() {
    const word = trainCurrentWord;
    document.getElementById('trainProgress').textContent = `${trainQueueIndex + 1} из ${trainQueue.length}`;

    const faceEl = document.getElementById('trainCardFace');
    const backEl = document.getElementById('trainCardBack');
    backEl.style.display = 'none';
    document.getElementById('trainShowAnswerBtn').style.display = '';
    document.getElementById('trainRateButtons').style.display = 'none';

    if (trainDirection === 'he-ru') {
      faceEl.className = 'train-card-face';
      faceEl.textContent = trainShowNiqqud ? word.hebrew : stripNiqqud(word.hebrew);
      backEl.innerHTML = `
        <div class="translit">${word.translit}</div>
        <div class="pos">${word.pos}</div>
        <div class="translation">${word.translation}</div>
      `;
    } else {
      faceEl.className = 'train-card-face train-card-face-ru';
      faceEl.textContent = word.translation;
      backEl.innerHTML = `
        <div class="hebrew-word" style="direction:rtl;">${word.hebrew}</div>
        <div class="translit">${word.translit}</div>
        <div class="pos">${word.pos}</div>
      `;
    }
  }

  document.getElementById('trainShowAnswerBtn').addEventListener('click', () => {
    trainAnswerShown = true;
    document.getElementById('trainCardBack').style.display = '';
    document.getElementById('trainShowAnswerBtn').style.display = 'none';
    const rateButtonsEl = document.getElementById('trainRateButtons');
    rateButtonsEl.style.display = '';
    rateButtonsEl.querySelectorAll('.train-rate-btn').forEach(btn => {
      btn.querySelector('span').textContent = previewRatingLabel(trainCurrentWord, btn.dataset.rating);
    });
  });

  document.getElementById('trainRateButtons').addEventListener('click', (e) => {
    const btn = e.target.closest('.train-rate-btn');
    if (!btn || !trainAnswerShown) return;
    const rating = btn.dataset.rating;
    const result = rateWord(trainCurrentWord, rating);
    saveWords();
    trainSessionStats.studied++;
    trainSessionStats[rating]++;

    if (result.requeue) {
      // возвращаем карточку в очередь чуть попозже (не сразу следующей) —
      // чтобы не превращалось в "жми, пока не запомнишь" подряд без пауз
      const insertAt = Math.min(trainQueue.length, trainQueueIndex + 1 + Math.floor(Math.random() * 3) + 3);
      trainQueue.splice(insertAt, 0, trainCurrentWord);
    }

    trainQueueIndex++;
    showNextTrainCard();
  });

  function finishTrainSession() {
    trainSessionActive = false;
    trainSessionEl.style.display = 'none';
    trainSummaryEl.style.display = '';
    const s = trainSessionStats;
    document.getElementById('trainSummaryText').textContent =
      `Сессия завершена. Отвечено карточек: ${s.studied}.\nНе помню: ${s.again} · Трудно: ${s.hard} · Хорошо: ${s.good} · Легко: ${s.easy}`;
  }

  document.getElementById('trainFinishBtn').addEventListener('click', () => {
    showTrainSetup();
  });

  function updateSaveState() {
    const ready = inputHebrew.value.trim() && inputTranslation.value.trim();
    saveBtn.disabled = !ready;
  }

  [inputHebrew, inputTranslit, inputTranslation].forEach(el => {
    el.addEventListener('input', updateSaveState);
  });

  saveBtn.addEventListener('click', () => {
    const hebrewValue = inputHebrew.value.trim();
    const existing = findExistingWordByHebrew(hebrewValue);

    if (existing) {
      // слово с таким написанием уже есть в справочнике — обновляем его
      // на месте вместо того, чтобы завести дубликат; статус/избранное/
      // подборки уже существующего слова не трогаем (кроме явно выбранных
      // подборок в пикере ниже — их всё же добавляем)
      existing.translit = inputTranslit.value.trim();
      existing.pos = inputPos.value;
      existing.translation = inputTranslation.value.trim();
      if (bulkTargetCollectionIds.size) {
        existing.collectionIds = existing.collectionIds || [];
        bulkTargetCollectionIds.forEach(cid => {
          if (!existing.collectionIds.includes(cid)) existing.collectionIds.push(cid);
        });
      }
    } else {
      const newWord = {
        id: Date.now(),
        hebrew: hebrewValue,
        translit: inputTranslit.value.trim(),
        pos: inputPos.value,
        translation: inputTranslation.value.trim(),
        favorite: false,
        collectionIds: Array.from(bulkTargetCollectionIds),
        addedAt: Date.now()
      };
      words.unshift(newWord);
    }
    saveWords();
    exitAddMode();
    showToast(`Слово «${hebrewValue}» добавлено`);
  });

  // ===== Массовое добавление (несколько слов сразу) =====
  const toggleBulkModeBtn = document.getElementById('toggleBulkModeBtn');
  const singleAddFieldsEl = document.getElementById('singleAddFields');
  const bulkAddFieldsEl = document.getElementById('bulkAddFields');
  const bulkInputEl = document.getElementById('bulkInput');
  const bulkProgressEl = document.getElementById('bulkProgress');
  const bulkAddSubmitBtn = document.getElementById('bulkAddSubmitBtn');
  const bulkAddStopBtn = document.getElementById('bulkAddStopBtn');
  const bulkCollectionChipsEl = document.getElementById('bulkCollectionChips');

  let bulkMode = false;
  let bulkAddRunning = false;
  let bulkAddAborted = false;
  let bulkTargetCollectionIds = new Set(); // в какие подборки класть добавляемые слова (можно несколько сразу)
  let bulkCreatingCollectionInline = false;

  function renderBulkCollectionChips() {
    bulkCollectionChipsEl.innerHTML = collections.map(c =>
      `<button type="button" class="chip ${bulkTargetCollectionIds.has(c.id) ? 'chip-selected' : ''}" data-bulk-coll="${c.id}">${c.name}</button>`
    ).join('') + (
      bulkCreatingCollectionInline
        ? `<input type="text" class="chip chip-input" id="bulkNewCollectionInput" placeholder="Название подборки" />`
        : `<button type="button" class="chip chip-icon-only" id="bulkNewCollectionChip" title="Новая подборка">${PLUS_ICON}</button>`
    );

    bulkCollectionChipsEl.querySelectorAll('[data-bulk-coll]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.bulkColl;
        if (bulkTargetCollectionIds.has(id)) bulkTargetCollectionIds.delete(id); else bulkTargetCollectionIds.add(id); // повторный клик снимает выбор — остальные не трогает
        renderBulkCollectionChips();
      });
    });

    if (bulkCreatingCollectionInline) {
      const inlineInput = document.getElementById('bulkNewCollectionInput');
      inlineInput.focus();
      const finishInlineCreate = (commit) => {
