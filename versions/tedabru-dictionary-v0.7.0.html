        if (!bulkCreatingCollectionInline) return;
        bulkCreatingCollectionInline = false;
        if (commit) {
          const name = inlineInput.value.trim();
          if (name) {
            const nc = { id: 'c' + Date.now(), name: uniqueCollectionName(name) };
            collections.push(nc);
            saveCollections();
            bulkTargetCollectionIds.add(nc.id); // сразу добавляем только что созданную к выбору
          }
        }
        renderBulkCollectionChips();
      };
      inlineInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') finishInlineCreate(true);
        else if (e.key === 'Escape') { e.stopPropagation(); finishInlineCreate(false); }
      });
      // blur коммитит (как и Enter), а не отменяет — та же причина, что и
      // в главном фильтр-баре: клик по "Добавить все" без явного Enter
      // раньше снимал фокус и тихо терял введённое имя подборки
      inlineInput.addEventListener('blur', () => finishInlineCreate(true));
    } else {
      document.getElementById('bulkNewCollectionChip').addEventListener('click', () => {
        bulkCreatingCollectionInline = true;
        renderBulkCollectionChips();
      });
    }
  }

  function setBulkMode(on) {
    bulkMode = on;
    singleAddFieldsEl.style.display = on ? 'none' : '';
    bulkAddFieldsEl.style.display = on ? '' : 'none';
    toggleBulkModeBtn.textContent = on ? 'Добавить одно слово' : 'Добавить несколько слов сразу';
    if (on) {
      bulkInputEl.value = '';
      bulkProgressEl.style.display = 'none';
      bulkAddSubmitBtn.style.display = '';
      bulkAddStopBtn.style.display = 'none';
      setTimeout(() => bulkInputEl.focus(), 50);
    }
  }

  toggleBulkModeBtn.addEventListener('click', () => setBulkMode(!bulkMode));

  bulkAddStopBtn.addEventListener('click', () => {
    bulkAddAborted = true;
    bulkProgressEl.textContent = 'Останавливаю после текущего слова…';
  });

  bulkAddSubmitBtn.addEventListener('click', async () => {
    // делим по пробелам/запятым/переносам строк — ровно как попросили;
    // убираем пустые токены и дубликаты (одно и то же слово дважды в
    // списке незачем гонять через API повторно)
    const tokens = [...new Set(
      bulkInputEl.value.split(/[\s,]+/).map(s => s.trim()).filter(Boolean)
    )];
    if (!tokens.length) return;

    bulkAddRunning = true;
    bulkAddAborted = false;
    bulkAddSubmitBtn.style.display = 'none';
    bulkAddStopBtn.style.display = '';
    bulkInputEl.disabled = true;
    bulkProgressEl.style.display = '';
    primaryActionBtn.style.opacity = '0.4';
    primaryActionBtn.style.pointerEvents = 'none';

    let added = 0, updated = 0;
    const failed = [];

    for (let i = 0; i < tokens.length; i++) {
      if (bulkAddAborted) break;
      const token = tokens[i];
      bulkProgressEl.textContent = `Обрабатываю ${i + 1} из ${tokens.length}: «${token}»…`;

      let best = null;
      try {
        const candidates = await resolveCandidates(token);
        best = candidates && candidates[0];
      } catch (err) {
        best = null;
      }

      if (!best || !best.text || !best.translation) {
        failed.push(token);
        continue;
      }

      const existing = findExistingWordByHebrew(best.text);
      if (existing) {
        existing.translit = best.translit || existing.translit;
        existing.pos = grammarLabelToPosValue(best.grammarLabel) || existing.pos;
        existing.translation = best.translation;
        if (bulkTargetCollectionIds.size) {
          existing.collectionIds = existing.collectionIds || [];
          bulkTargetCollectionIds.forEach(cid => {
            if (!existing.collectionIds.includes(cid)) existing.collectionIds.push(cid);
          });
        }
        updated++;
      } else {
        words.unshift({
          id: Date.now() + i,
          hebrew: best.text,
          translit: best.translit || '',
          pos: grammarLabelToPosValue(best.grammarLabel) || 'сущ, м.р',
          translation: best.translation,
          favorite: false,
          collectionIds: Array.from(bulkTargetCollectionIds),
          addedAt: Date.now()
        });
        added++;
      }
    }

    saveWords();
    bulkAddRunning = false;
    primaryActionBtn.style.opacity = '';
    primaryActionBtn.style.pointerEvents = '';
    bulkInputEl.disabled = false;
    bulkProgressEl.style.display = 'none';
    bulkAddSubmitBtn.style.display = '';
    bulkAddStopBtn.style.display = 'none';

    const summaryParts = [`добавлено: ${added}`, `обновлено: ${updated}`];
    if (failed.length) summaryParts.push(`не найдено: ${failed.length}`);
    const toastMessage = (bulkAddAborted ? 'Остановлено — ' : '') + summaryParts.join(', ');

    exitAddMode();
    showToast(toastMessage);
  });

  // ===== Дебаг-сетка (только по #debug в адресе) =====
  // Рисует реальные, измеренные прямо в этом браузере вертикальные линии с
  // подписями (координата в px) поверх всего интерфейса — вместо того, чтобы
  // подбирать отступы вслепую. Активируется добавлением #debug к адресу
  // страницы, ничего не меняет в самом приложении, только рисует поверх.
  function clearDebugOverlay() {
    document.querySelectorAll('.debug-overlay-el').forEach(el => el.remove());
  }

  function addDebugLine(x, color, label, labelTop) {
    const line = document.createElement('div');
    line.className = 'debug-overlay-el';
    line.style.cssText = `position:fixed; top:0; bottom:0; left:${x}px; width:1px; background:${color}; z-index:99999; pointer-events:none; opacity:0.85;`;
    document.body.appendChild(line);
    const lbl = document.createElement('div');
    lbl.className = 'debug-overlay-el';
    lbl.textContent = label;
    lbl.style.cssText = `position:fixed; top:${labelTop}px; left:${x + 2}px; background:${color}; color:#000; font-size:10px; line-height:1.3; padding:1px 4px; z-index:99999; font-family:monospace; white-space:nowrap; pointer-events:none;`;
    document.body.appendChild(lbl);
  }

  function renderDebugGrid() {
    clearDebugOverlay();
    const searchInput = document.getElementById('searchInput');
    if (!searchInput) return;
    const searchRect = searchInput.getBoundingClientRect();

    // красные линии — левый/правый край строки поиска (эталон, с которым
    // нужно совпасть)
    addDebugLine(Math.round(searchRect.left), '#ff3b3b', 'search L ' + Math.round(searchRect.left), 40);
    addDebugLine(Math.round(searchRect.right), '#ff3b3b', 'search R ' + Math.round(searchRect.right), 60);

    const firstRow = Array.from(document.querySelectorAll('.word-row')).find(r => !r.classList.contains('row-deleting'));
    if (!firstRow) return;

    const targets = [
      ['favorite', firstRow.querySelector('.favorite-btn')],
      ['hebrew', firstRow.querySelector('.hebrew-word')],
      ['meta', firstRow.querySelector('.meta-col')],
      ['translation', firstRow.querySelector('.translation')],
      ['mastery', firstRow.querySelector('.mastery-dots')],
      ['delete', firstRow.querySelector('.delete-btn')],
      ['editdef', firstRow.querySelector('.edit-def-btn')],
      ['rownum', firstRow.querySelector('.row-num')],
    ];
    const colors = ['#39ff88', '#39d3ff', '#ffe539', '#ff39d3', '#ff9e39', '#8a7bff', '#c07bff', '#ffffff'];
    let labelTop = 100;
    targets.forEach(([key, el], i) => {
      if (!el) return;
      const r = el.getBoundingClientRect();
      const color = colors[i % colors.length];
      el.style.outline = `1px solid ${color}`;
      el.classList.add('debug-outlined-el');
      addDebugLine(Math.round(r.left), color, `${key} L ${Math.round(r.left)}`, labelTop);
      labelTop += 18;
      addDebugLine(Math.round(r.right), color, `${key} R ${Math.round(r.right)}`, labelTop);
      labelTop += 18;
    });

    // сам row — целиком, для сверки с шириной строки поиска
    const rowRect = firstRow.getBoundingClientRect();
    console.log('[DEBUG GRID] search:', searchRect.left, '-', searchRect.right, '(width', searchRect.width, ')');
    console.log('[DEBUG GRID] word-row:', rowRect.left, '-', rowRect.right, '(width', rowRect.width, ')');
  }

  if (location.hash.includes('debug')) {
    window.addEventListener('load', () => setTimeout(renderDebugGrid, 1000));
  }

  // ===== Первичный рендер =====
  renderFilterBar();
  renderList();
</script>

</body>
</html>
