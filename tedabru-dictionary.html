      if (t && !group.translations.some(x => x.toLowerCase() === t.toLowerCase())) {
        group.translations.push(t);
      }
    }
    return order.map(key => {
      const { base, translations } = groups.get(key);
      let translation;
      if (translations.length <= 1) {
        translation = translations[0] || base.translation || null;
      } else {
        translation = translations.map((t, i) => `${i + 1}. ${t}`).join('; ');
      }
      return { ...base, translation };
    });
  }

  function buildCombinedFromSources(sources) {
    const combined = [
      ...sources.dictHit.map(buildDictCandidate),
      ...sources.formHit.map(buildVerbFormCandidate),
      ...sources.verbHit.map(buildVerbDictCandidate),
      ...sources.nounFormHit.map(buildNounFormCandidate),
      ...sources.genFormHit.map(buildGeneratedVerbFormCandidate)
    ];
    return mergeCandidatesBySense(combined);
  }

  // Пробует точный скелет, а если пусто — по очереди ktiv-male → ktiv-chaser
  // варианты (см. generateChaserSkeletonVariants). Возвращает первый непустой
  // набор источников вместе со скелетом, по которому он нашёлся (для лога).
  function lookupSkeletonWithChaserFallback(skeleton) {
    const direct = lookupSkeletonSources(skeleton);
    if (hasAnyHit(direct)) return { sources: direct, matchedSkeleton: skeleton };
    for (const variant of generateChaserSkeletonVariants(skeleton)) {
      const alt = lookupSkeletonSources(variant);
      if (hasAnyHit(alt)) return { sources: alt, matchedSkeleton: variant };
    }
    return { sources: direct, matchedSkeleton: skeleton };
  }

  function loadHebrewDict() {
    if (hebrewDictLoadPromise) return hebrewDictLoadPromise;
    hebrewDictLoadPromise = Promise.all([
      fetch('hebrew_dict_v3.json').then(r => { if (!r.ok) throw new Error('hebrew_dict_v3.json: ' + r.status); return r.json(); }),
      fetch('hebrew_dict_v3_reverse.json').then(r => { if (!r.ok) throw new Error('hebrew_dict_v3_reverse.json: ' + r.status); return r.json(); }),
      fetch('hebrew_verb_forms_index.json').then(r => { if (!r.ok) throw new Error('hebrew_verb_forms_index.json: ' + r.status); return r.json(); }),
      fetch('verbs_dict.json').then(r => { if (!r.ok) throw new Error('verbs_dict.json: ' + r.status); return r.json(); }),
      fetch('verbs_reverse.json').then(r => { if (!r.ok) throw new Error('verbs_reverse.json: ' + r.status); return r.json(); }),
      fetch('wiktionary_verb_lemmas.json').then(r => { if (!r.ok) throw new Error('wiktionary_verb_lemmas.json: ' + r.status); return r.json(); }),
      fetch('translit_index.json').then(r => { if (!r.ok) throw new Error('translit_index.json: ' + r.status); return r.json(); }),
      fetch('noun_forms_index.json').then(r => { if (!r.ok) throw new Error('noun_forms_index.json: ' + r.status); return r.json(); }),
      fetch('generated_verb_forms.json').then(r => { if (!r.ok) throw new Error('generated_verb_forms.json: ' + r.status); return r.json(); })
    ]).then(([skeleton, reverse, verbForms, vDict, vReverse, vLemmas, tIndex, nFormsIndex, gVerbForms]) => {
      // ключи-скелеты нормализуем по NFC на всякий случай (хотя без огласовок
      // риск расхождения диакритики уже почти нулевой)
      const normSkeleton = {};
      for (const key in skeleton) normSkeleton[key.normalize('NFC')] = skeleton[key];
      const normVerbForms = {};
      for (const key in verbForms) normVerbForms[key.normalize('NFC')] = verbForms[key];
      const normVerbsDict = {};
      for (const key in vDict) normVerbsDict[key.normalize('NFC')] = vDict[key];
      const normVerbLemmas = {};
      for (const key in vLemmas) normVerbLemmas[key.normalize('NFC')] = vLemmas[key];
      const normNounForms = {};
      for (const key in nFormsIndex) normNounForms[key.normalize('NFC')] = nFormsIndex[key];
      const normGenVerbForms = {};
      for (const key in gVerbForms) normGenVerbForms[key.normalize('NFC')] = gVerbForms[key];
      hebrewDictSkeleton = normSkeleton;
      hebrewDictReverse = reverse;
      hebrewVerbForms = normVerbForms;
      verbsDict = normVerbsDict;
      verbsReverse = vReverse;
      wiktionaryVerbLemmas = normVerbLemmas;
      translitIndex = tIndex;
      nounFormsIndex = normNounForms;
      generatedVerbForms = normGenVerbForms;
      console.log('[DICT] загружено: словарь —', Object.keys(hebrewDictSkeleton).length, ', обратный индекс —', Object.keys(hebrewDictReverse).length, ', формы глаголов —', Object.keys(hebrewVerbForms).length, ', глаголы (инфинитивы) —', Object.keys(verbsDict).length, ', индекс транскрипции —', Object.keys(translitIndex).length, ', формы сущ/прил —', Object.keys(nounFormsIndex).length, ', сгенерированные формы глаголов —', Object.keys(generatedVerbForms).length);
    }).catch(e => {
      console.log('[DICT] словари не загрузились, работаем только через DeepL:', e);
      hebrewDictSkeleton = {}; hebrewDictReverse = {}; hebrewVerbForms = {};
      verbsDict = {}; verbsReverse = {}; wiktionaryVerbLemmas = {}; translitIndex = {}; nounFormsIndex = {};
      generatedVerbForms = {};
    });
    return hebrewDictLoadPromise;
  }
  loadHebrewDict(); // запускаем загрузку сразу при открытии страницы, не дожидаясь первого поиска

  const POS_LABELS = {
    noun: 'сущ', verb: 'глагол', adj: 'прил', adv: 'нареч', intj: 'межд',
    name: 'имя собств.', num: 'числ', pron: 'местоим', prep: 'предлог',
    conj: 'союз', particle: 'частица', phrase: 'фраза', proverb: 'погов.',
    det: 'местоим', article: 'артикль', root: 'корень'
  };

  const BINYAN_LABELS = {
    pa: 'пааль', pi: 'пиэль', hif: 'хифиль', nif: 'нифаль',
    pu: 'пуаль', huf: 'хуфаль', hitp: 'hитпаэль'
  };

  // ===== Nakdan API: получение никуда =====
  // Прямой вызов nakdan-u1-0.loadbalancer.dicta.org.il блокируется CORS —
  // запрос идёт через собственный прокси на Cloudflare Workers.
  const NAKDAN_URL = 'https://nakdan-proxy.3an3arah.workers.dev/';

  async function fetchNikkud(hebrewText) {
    const response = await fetch(NAKDAN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        task: 'nakdan',
        genre: 'modern',
        data: hebrewText,
        addmorph: true,
        keepmetagim: true,
        keepqq: false,
        nodageshdefmem: false,
        patachma: false,
        useTokenization: true
      })
    });
    if (!response.ok) throw new Error('Сервер Nakdan ответил ошибкой: ' + response.status);
    const json = await response.json();
    return json.data; // сырые токены — обработка кандидатов делается отдельно
  }

  // Строит список кандидатов-огласовок для подсказки.
  // Если ввели одно слово — берём несколько РАЗНЫХ по написанию вариантов
  // огласовки этого же слова (Nakdan часто предлагает 2-3 равноправных
  // прочтения вроде "мидбар"/"медабер" для одного и того же написания без
  // никуда) и показываем их все, каждый со своей транскрипцией и грамматикой.
  // Если ввели фразу из нескольких слов — как раньше, просто берём по
  // одному лучшему варианту на каждое слово и склеиваем в одну строку.
  // извлекает до 8 кандидатов-огласовок из ОДНОГО токена Nakdan (одно слово).
  // Вынесено отдельно от buildCandidates, чтобы использовать одинаково для
  // разных источников скелета (догадки по транскрипции, перевод с русского)
  function extractCandidatesFromToken(token) {
    const options = token && token.nakdan && token.nakdan.options;
    if (!options || !options.length) return [];

    const sorted = [...options].sort((a, b) => {
      if (a.levelChoice !== b.levelChoice) return a.levelChoice - b.levelChoice;
      const aw = a.w.replace(/\|/g, '');
      const bw = b.w.replace(/\|/g, '');
      const aMatches = a.lex === aw ? 0 : 1;
      const bMatches = b.lex === bw ? 0 : 1;
      return aMatches - bMatches;
    });
    const seen = new Set();
    const candidates = [];
    for (const opt of sorted) {
      if (opt.prefix_len) continue;
      const w = opt.w.replace(/\|/g, '');
      if (seen.has(w)) continue;
      seen.add(w);
      candidates.push({ text: w, morph: opt.morph || null, lex: opt.lex || null });
      if (candidates.length >= 8) break;
    }
    return candidates;
  }

  function buildCandidates(tokens) {
    if (tokens.length === 1) {
      const candidates = extractCandidatesFromToken(tokens[0]);
      if (candidates.length) return candidates;
    }

    // фраза из нескольких слов (или у единственного слова совсем нет
    // вариантов огласовки) — прежнее поведение: один результат на всю фразу
    let firstMorph = null;
    const joined = tokens.map((item, tokenIdx) => {
      const options = item.nakdan && item.nakdan.options;
      if (!options || !options.length) return item.str;
      const best = options.reduce((a, b) => (a.levelChoice <= b.levelChoice ? a : b));
      if (tokenIdx === 0) firstMorph = best.morph || null;
      return best.w.replace(/\|/g, '');
    }).join(' ');
    return [{ text: joined, morph: firstMorph }];
  }

  // ===== Определение типа ввода: иврит / транскрипция / русское слово =====
  function containsHebrew(str) {
    return /[\u0590-\u05FF]/.test(str || '');
  }

  async function translateToHebrew(russianText) {
    const response = await fetch(DEEPL_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: [russianText], target_lang: 'HE' })
    });
    if (!response.ok) throw new Error('DeepL ответил ошибкой: ' + response.status);
    const json = await response.json();
    return (json.translations && json.translations[0] && json.translations[0].text) || null;
  }

  function computeGrammarLabelFromMorph(c) {
    const binyanGuess = detectBinyanFromMorph(c.morph) || (c.morph ? null : detectBinyan(c.text));
    if (binyanGuess) return `глагол, ${binyanGuess}`;
    return detectPosFromMorph(c.morph);
  }

  function grammarLabelForEntry(entry) {
    if (entry.pos === 'verb') {
      const binyan = BINYAN_LABELS[entry.binyan] || entry.binyan;
      return binyan ? `глагол, ${binyan}` : 'глагол';
    }
    if (entry.pos === 'noun') {
      if (entry.gender === 'm') return 'сущ, м.р';
      if (entry.gender === 'f') return 'сущ, ж.р';
      return 'сущ';
    }
    if ((entry.pos === 'pron' || entry.pos === 'name' || entry.pos === 'det') && entry.gender) {
      return (POS_LABELS[entry.pos] || entry.pos) + (entry.gender === 'm' ? ', м.р' : ', ж.р');
    }
    return POS_LABELS[entry.pos] || entry.pos;
  }

  // ===== Ударение =====
  // Поле tr в словаре — романизация с ударением (напр. "mishpakhá") в
  // латинице/IPA. Сама по себе она нам не нужна для отображения — но
  // позиция ударного гласного в ней надёжно указывает, на какой гласный
  // ставить ударение в НАШЕЙ собственной кириллической транскрипции.
  // Считаем гласные С КОНЦА в обеих строках (не с начала) — так меньше
  // риск разъехаться, если в начале слова расхождение из-за приставки.
  function findStressIndexFromEnd(trText) {
    if (!trText) return null;
    const first = trText.split(',')[0].trim();
    const ACCENTED = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ɛ́': 'ɛ', 'ɔ́': 'ɔ' };
    const VOWELS = 'aeiouɛɔə';
    let count = 0, stressedCount = -1;
    for (let i = 0; i < first.length; i++) {
      const ch = first[i];
      const chLower = ch.toLowerCase();
      let isVowel = false, isStressed = false;
      if (ACCENTED[chLower]) { isVowel = true; isStressed = true; }
      else if (VOWELS.includes(chLower)) {
        isVowel = true;
        if (first[i + 1] === '\u0301') isStressed = true; // комбинирующий акут отдельным символом
      }
      if (isVowel) {
        count++;
        if (isStressed) stressedCount = count;
      }
    }
    if (stressedCount === -1 || count === 0) return null;
    return count - stressedCount; // сколько гласных ПОСЛЕ ударной, считая с конца (0 = последняя гласная)
  }

  function applyStressFromEnd(translit, indexFromEnd) {
    if (indexFromEnd === null || indexFromEnd === undefined || !translit) return translit;
    const RU_VOWELS = 'аеиоуяюёэ';
    const positions = [];
    for (let i = 0; i < translit.length; i++) {
      if (RU_VOWELS.includes(translit[i].toLowerCase())) positions.push(i);
    }
    if (!positions.length) return translit;
    const targetPos = positions.length - 1 - indexFromEnd;
    if (targetPos < 0 || targetPos >= positions.length) return translit;
    const idx = positions[targetPos];
    return translit.slice(0, idx + 1) + '\u0301' + translit.slice(idx + 1);
  }

  function translitWithStress(word, trField) {
    const base = niqqudToTranslit(word);
    const stressIdx = findStressIndexFromEnd(trField);
    return applyStressFromEnd(base, stressIdx);
  }

  function buildDictCandidate(entry) {
    return {
      text: entry.word,
      translit: translitWithStress(entry.word, entry.tr),
      grammarLabel: grammarLabelForEntry(entry),
      translation: entry.gloss_ru,
      root: entry.root || null,
      source: 'dict'
    };
  }

  // Кандидат из НОВОЙ авторитетной базы глаголов (собрана вручную, ключевое
  // слово — инфинитив, а не смешение форм от Wiktionary). Отдельная функция
  // от buildDictCandidate, потому что структура записи немного другая
  // (translation вместо gloss_ru, нет отдельного поля gender и т.п.)
  function buildVerbDictCandidate(entry) {
    const binyan = BINYAN_LABELS[entry.binyan] || entry.binyan;
    return {
      text: entry.word,
      translit: niqqudToTranslit(entry.word),
      grammarLabel: binyan ? `глагол, ${binyan}` : 'глагол',
      translation: entry.translation,
      root: entry.root || null,
      source: 'dict'
    };
  }

  // Кандидат для случая "ввели СПРЯГАЕМУЮ ФОРМУ глагола, а не словарную
  // лемму" (медабер, дибарти и т.п.) — показываем саму эту форму с её
  // транскрипцией, но перевод и часть речи берём от ЛЕММЫ (инфинитива),
  // добавляя грамматическую подсказку (лицо/род/число/время), чтобы было
  // понятно, что именно значит эта конкретная форма. Лемму ищем в служебном
  // файле wiktionaryVerbLemmas — сами глаголы из основного словаря убраны
  // (у них теперь отдельная, авторитетная база), но эта форма-подсказка
  // всё ещё нужна именно из старых данных Wiktionary (там есть таблицы
  // спряжения, которых в новой базе пока нет).
  function buildVerbFormCandidate(formEntry) {
    const lemmaEntries = (wiktionaryVerbLemmas && wiktionaryVerbLemmas[formEntry.lemma_skeleton]) || [];
    const lemmaVerb = lemmaEntries.find(e => e.pos === 'verb') || lemmaEntries[0];
    const lemmaGloss = lemmaVerb ? lemmaVerb.gloss_ru : null;
    const binyan = lemmaVerb ? (BINYAN_LABELS[lemmaVerb.binyan] || lemmaVerb.binyan) : null;

    // показываем инфинитив, если он есть в данных (редкость, ~2% глаголов) —
    // а если нет, то саму лемму (написание, под которым заведена статья),
    // с транскрипцией, чтобы всегда было видно, от какого слова эта форма
    let lemmaLine = '';
    if (lemmaVerb) {
      if (lemmaVerb.inf) {
        lemmaLine = ` (инфинитив: ${lemmaVerb.inf}, ${niqqudToTranslit(lemmaVerb.inf)})`;
      } else {
        lemmaLine = ` (форма от ${lemmaVerb.word}, ${niqqudToTranslit(lemmaVerb.word)})`;
      }
    }

    return {
      text: formEntry.form_word,
      translit: niqqudToTranslit(formEntry.form_word),
      grammarLabel: binyan ? `глагол, ${binyan} (${formEntry.hint})` : `глагол (${formEntry.hint})`,
      translation: lemmaGloss ? `${lemmaGloss}${lemmaLine}` : formEntry.hint,
      root: lemmaVerb ? lemmaVerb.root : null,
      source: 'dict'
    };
  }

  // Кандидат для случая "ввели форму МНОЖЕСТВЕННОГО ЧИСЛА / сопряжённого
  // состояния существительного, или форму женского рода / мн.ч.
  // прилагательного" (батим → баит, товим → тов) — та же логика, что и для
  // глаголов: показываем саму введённую форму, но перевод берём от леммы
  // (словарной формы, ед.ч.), добавляя грамматическую подсказку.
  function buildNounFormCandidate(formEntry) {
    const lemmaEntries = (hebrewDictSkeleton && hebrewDictSkeleton[formEntry.lemma_skeleton]) || [];
    const lemmaEntry = lemmaEntries[0];
    const lemmaGloss = lemmaEntry ? lemmaEntry.gloss_ru : null;
    const baseLabel = lemmaEntry ? grammarLabelForEntry(lemmaEntry) : null;
    const lemmaLine = lemmaEntry ? ` (форма от ${lemmaEntry.word}, ${niqqudToTranslit(lemmaEntry.word)})` : '';

    return {
      text: formEntry.form_word,
      translit: niqqudToTranslit(formEntry.form_word),
      grammarLabel: baseLabel ? `${baseLabel} (${formEntry.hint})` : formEntry.hint,
      translation: lemmaGloss ? `${lemmaGloss}${lemmaLine}` : formEntry.hint,
      root: lemmaEntry ? lemmaEntry.root : null,
      source: 'dict'
    };
  }

  // Кандидат для формы, найденной через НОВЫЙ индекс спрягаемых форм —
  // построенный из авторитетного списка глаголов (verbsDict), а не из
  // Wiktionary. Лемму (перевод, породу) берём из verbsDict по lemma_skeleton
  // и сверяем по lemma_word (у одного скелета может быть несколько значений).
  function buildGeneratedVerbFormCandidate(formEntry) {
    const lemmaEntries = (verbsDict && verbsDict[formEntry.lemma_skeleton]) || [];
    const lemmaEntry = lemmaEntries.find(e => e.word === formEntry.lemma_word) || lemmaEntries[0];
    const binyan = lemmaEntry ? (BINYAN_LABELS[lemmaEntry.binyan] || lemmaEntry.binyan) : null;
    const lemmaLine = formEntry.lemma_word ? ` (инфинитив: ${formEntry.lemma_word}, ${niqqudToTranslit(formEntry.lemma_word)})` : '';

    return {
      text: formEntry.form_word,
      translit: niqqudToTranslit(formEntry.form_word),
      grammarLabel: binyan ? `глагол, ${binyan} (${formEntry.hint})` : `глагол (${formEntry.hint})`,
      translation: lemmaEntry ? `${lemmaEntry.translation}${lemmaLine}` : formEntry.hint,
      root: lemmaEntry ? lemmaEntry.root : null,
      source: 'dict'
    };
  }

  // Простой повтор на случай единичного сбоя сети/API — раз это последний
  // рубеж (после него добавить слово будет уже нечем), даём ему на одну
  // попытку больше шансов
  async function withRetry(fn, times = 2) {
    let lastErr;
    for (let i = 0; i < times; i++) {
      try { return await fn(); } catch (err) { lastErr = err; }
    }
    throw lastErr;
  }

  // Общая точка входа для поиска/подбора меты. Порядок такой:
  // 1) Иврит на входе → ищем ГОЛЫЙ СКЕЛЕТ (без огласовок) в словаре — не
  //    важно, как именно Nakdan/Wiktionary его вокализуют, скелет один.
  //    Нашли — отдаём все статьи сразу, без единого сетевого запроса.
  //    Не нашли — единственный фоллбэк: озвучиваем через Nakdan, берём
  //    ТОЛЬКО топ-кандидат (самый уверенный), переводим через DeepL.
  // 2) Русское слово на входе → сначала обратный индекс (русский → иврит).
  //    Нашли — отдаём статьи сразу. Не нашли — переводим через DeepL,
  //    озвучиваем через Nakdan, тоже только топ-кандидат.
  // Поиск по транскрипции (гиль, медабер и т.п. без точного совпадения)
  // временно отключён из этого потока — отдельная задача на будущее.
  async function resolveCandidates(raw) {
    await loadHebrewDict();

    if (containsHebrew(raw)) {
      const skeleton = stripNiqqud(raw).normalize('NFC');
      const { sources, matchedSkeleton } = lookupSkeletonWithChaserFallback(skeleton);
      const { dictHit, formHit, verbHit, nounFormHit, genFormHit } = sources;
      if (hasAnyHit(sources)) {
        if (matchedSkeleton !== skeleton) {
          console.log('[RC] точного скелета нет, но нашлось по краткому написанию (ktiv-chaser):', skeleton, '→', matchedSkeleton);
        }
        console.log('[RC] найдено по скелету:', matchedSkeleton, '—', dictHit.length, 'словарных значений +', formHit.length, 'форм глагола +', verbHit.length, 'глаголов (инфинитив) +', nounFormHit.length, 'форм сущ/прил +', genFormHit.length, 'форм глагола (новая база)');
        // объединяем все источники — то же самое написание может одновременно
        // быть и отдельным словом (сленговое "классно"), и спрягаемой формой
        // совсем другого глагола ("зажигаю"), и настоящим глаголом-инфинитивом
        // из авторитетной базы, и формой мн.ч./ж.р. существительного или
        // прилагательного, и спрягаемой формой из НОВОЙ базы глаголов —
        // без объединения теряли бы что-то из этого
        return buildCombinedFromSources(sources);
      }
      console.log('[RC] в словаре нет — иду в Nakdan + DeepL (топ-кандидат):', raw);
      const tokens = await withRetry(() => fetchNikkud(raw)).catch(() => []);
      const candidates = buildCandidates(tokens);
      // если Nakdan не смог озвучить (сеть/API подвели) — не сдаёмся сразу:
      // используем то, что ввёл человек, как есть (транслитерация по тому,
      // что реально написано — без огласовок выйдет неполной, но лучше
      // добавить слово так, чем не добавить вовсе)
      const chosen = candidates.length ? candidates[0] : null;
      const chosenText = chosen ? chosen.text : raw;
      const chosenTranslit = chosen ? niqqudToTranslit(chosen.text) : niqqudToTranslit(raw);
      const chosenGrammar = chosen ? computeGrammarLabelFromMorph(chosen) : null;
      let translation = null;
      try { translation = await withRetry(() => translateToRussian(chosenText)); } catch (e) {}
      if (!translation) return []; // без перевода добавлять действительно нечего
      return [{ text: chosenText, translit: chosenTranslit, grammarLabel: chosenGrammar, translation, source: 'hebrew-api' }];
    }

    const ruKey = raw.trim().toLowerCase();
    const dictHit = (hebrewDictReverse && hebrewDictReverse[ruKey]) || [];
    const verbRuHit = (verbsReverse && verbsReverse[ruKey]) || [];
    if (dictHit.length || verbRuHit.length) {
      console.log('[RC] найдено в обратном индексе:', ruKey, '—', dictHit.length, 'словарных значений +', verbRuHit.length, 'глаголов');
      return mergeCandidatesBySense([...dictHit.map(buildDictCandidate), ...verbRuHit.map(buildVerbDictCandidate)]);
    }

    // раз это не перевод — возможно, это ТРАНСКРИПЦИЯ ивритского слова
    // ("махшев" вместо перевода "компьютер"). Пробуем нечёткое совпадение по
    // собственному индексу транскрипции (посчитан заранее по всей базе,
    // локально, без сети) — и только если совсем ничего не нашлось, идём
    // к Джемини гадать написание по звучанию.
    const transcriptionHit = fuzzyMatchTranslitIndex(raw);
    if (transcriptionHit.length) {
      console.log('[RC] найдено по индексу транскрипции (локально, без Джемини):', ruKey, '—', transcriptionHit.length, 'кандидатов');
      return transcriptionHit;
    }

    console.log('[RC] в индексе транскрипции нет — иду к Джемини гадать написание:', raw);
    const guessedSkeletons = await guessHebrewSpellings(raw).catch(() => []);
    const fromGemini = [];
    for (const guessedSkeleton of guessedSkeletons) {
      const gDictHit = (hebrewDictSkeleton && hebrewDictSkeleton[guessedSkeleton]) || [];
      const gVerbHit = (verbsDict && verbsDict[guessedSkeleton]) || [];
      fromGemini.push(...gDictHit.map(buildDictCandidate), ...gVerbHit.map(buildVerbDictCandidate));
    }
    if (fromGemini.length) {
      console.log('[RC] Джемини угадал написание, нашлось в базе:', fromGemini.length, 'кандидатов');
      return mergeCandidatesBySense(fromGemini);
    }

    console.log('[RC] и Джемини не помог — иду в DeepL + Nakdan (топ-кандидат):', raw);
    const hebrewFromRussian = await withRetry(() => translateToHebrew(raw)).catch(() => null);
    if (!hebrewFromRussian) return [];
    const tokens = await withRetry(() => fetchNikkud(hebrewFromRussian)).catch(() => []);
    const candidates = buildCandidates(tokens);
    if (candidates.length) {
      const top = candidates[0];
      return [{ text: top.text, translit: niqqudToTranslit(top.text), grammarLabel: computeGrammarLabelFromMorph(top), translation: raw, source: 'translation-api' }];
    }
    // Nakdan не смог озвучить то, что перевёл DeepL — всё равно отдаём слово
    // как есть, без огласовок, вместо того чтобы вовсе не добавить его
    return [{ text: hebrewFromRussian, translit: niqqudToTranslit(hebrewFromRussian), grammarLabel: null, translation: raw, source: 'translation-api' }];
  }

  // Нечёткий поиск по собственному индексу транскрипции (translitIndex) —
  // посчитан заранее по всей базе (основной словарь + глаголы), локально,
  // без сети. Используется как шаг ПЕРЕД обращением к Джемини — если
  // человек ввёл "махшев", это почти наверняка совпадёт с транскрипцией
  // מַחְשֵׁב ("компьютер") уже без единого сетевого запроса.
  function fuzzyMatchTranslitIndex(raw) {
    if (!translitIndex) return [];
    const query = normalizeForCompare(raw);
    if (!query) return [];
    // для каждого подходящего скелета запоминаем ЛУЧШЕЕ (наименьшее)
    // расстояние среди всех ключей индекса, которые на него сослались —
    // без этого результаты шли в произвольном порядке перебора объекта,
    // и менее точное совпадение могло случайно оказаться раньше точного
    const skeletonDistance = new Map();
    for (const key in translitIndex) {
      const dist = levenshtein(key, query); // ключи индекса уже нормализованы при сборке
      const maxLen = Math.max(key.length, query.length);
      const allowedDistance = maxLen <= 4 ? 1 : (maxLen <= 8 ? 2 : 3);
      if (dist > allowedDistance) continue;
      for (const entry of translitIndex[key]) {
        const cur = skeletonDistance.get(entry.skeleton);
        if (cur === undefined || dist < cur) skeletonDistance.set(entry.skeleton, dist);
      }
    }
    if (!skeletonDistance.size) return [];
    const results = [];
    for (const [skeleton] of skeletonDistance) {
      const dictHit = (hebrewDictSkeleton && hebrewDictSkeleton[skeleton]) || [];
      const verbHit = (verbsDict && verbsDict[skeleton]) || [];
      const genFormHit = (generatedVerbForms && generatedVerbForms[skeleton]) || [];
      // см. комментарий в lookupSkeletonSources — старые формы только если у
      // скелета нет ничего авторитетного вообще (ни новых форм, ни инфинитива)
      const formHit = (genFormHit.length || verbHit.length) ? [] : ((hebrewVerbForms && hebrewVerbForms[skeleton]) || []);
      const nounFormHit = (nounFormsIndex && nounFormsIndex[skeleton]) || [];
      const candidates = [
        ...dictHit.map(buildDictCandidate),
        ...verbHit.map(buildVerbDictCandidate),
        ...formHit.map(buildVerbFormCandidate),
        ...nounFormHit.map(buildNounFormCandidate),
        ...genFormHit.map(buildGeneratedVerbFormCandidate)
      ];
      for (const c of candidates) {
        // дистанцию для сортировки считаем по СОБСТВЕННОЙ транскрипции этого
        // конкретного кандидата, а не по скелету в целом — иначе омографы
        // (одно консонантное написание, разные огласовки/породы — לִפְנוֹת
        // "лифнот" и לְפַנוֹת "лефанот") получают одну и ту же "лучшую" дистанцию
        // скелета и сортируются между собой произвольно, даже если запрос
        // буква-в-букву совпадает с транскрипцией только ОДНОГО из них
        const ownDist = levenshtein(normalizeForCompare(c.translit), query);
        results.push({ c, dist: ownDist });
      }
    }
    // сортируем по точности совпадения — точнее звучащие кандидаты первыми
    results.sort((a, b) => a.dist - b.dist);
    return mergeCandidatesBySense(results.map(r => r.c));
  }

  // Только словарная часть resolveCandidates — БЕЗ похода в Nakdan/DeepL.
  // Все обращения к ней синхронны по сути (скелет-словарь и обратный индекс
  // уже загружены в память), поэтому это можно безопасно вызывать на КАЖДОЕ
  // нажатие клавиши — в отличие от полного resolveCandidates, который при
  // отсутствии слова в словаре идёт в сеть, а это уже нельзя дёргать на
  // каждую букву. Возвращает [] (мгновенно), если слова нет в словаре —
  // тогда решение идти в сеть остаётся за явной кнопкой пользователя.
  async function resolveCandidatesDictOnly(raw) {
    await loadHebrewDict();
    if (!raw || !raw.trim()) return [];

    if (containsHebrew(raw)) {
      const skeleton = stripNiqqud(raw).normalize('NFC');
      const { sources } = lookupSkeletonWithChaserFallback(skeleton);
      if (!hasAnyHit(sources)) return [];
      return buildCombinedFromSources(sources);
    }

    const ruKey = raw.trim().toLowerCase();
    const dictHit = (hebrewDictReverse && hebrewDictReverse[ruKey]) || [];
    const verbRuHit = (verbsReverse && verbsReverse[ruKey]) || [];
    if (dictHit.length || verbRuHit.length) {
      return mergeCandidatesBySense([...dictHit.map(buildDictCandidate), ...verbRuHit.map(buildVerbDictCandidate)]);
    }
    // ни перевод, ни точное совпадение — пробуем как транскрипцию ("махшев")
    // по собственному индексу, тоже мгновенно и локально
    return fuzzyMatchTranslitIndex(raw);
  }



  // ===== Конвертация никуда → транскрипция (черновая, по правилам Tedabru) =====
  //
  // ВАЖНО: это черновой алгоритм для ускорения ручного ввода, а не финальная
  // истина. Он не умеет надёжно определять ударение и не всегда угадывает
  // "живой"/"немой" шва — результат всегда нужно проверять глазами перед
  // сохранением.

  const NIQQUD = {
    SHVA: '\u05B0', HATAF_SEGOL: '\u05B1', HATAF_PATAH: '\u05B2', HATAF_QAMATS: '\u05B3',
    HIRIQ: '\u05B4', TSERE: '\u05B5', SEGOL: '\u05B6', PATAH: '\u05B7', QAMATS: '\u05B8',
    HOLAM: '\u05B9', HOLAM_HASER: '\u05BA', QUBUTS: '\u05BB', DAGESH: '\u05BC',
    METEG: '\u05BD', RAFE: '\u05BF', SHIN_DOT: '\u05C1', SIN_DOT: '\u05C2', QAMATS_QATAN: '\u05C7'
  };

  const VOWEL_MAP = {
    [NIQQUD.PATAH]: 'а', [NIQQUD.QAMATS]: 'а', [NIQQUD.QAMATS_QATAN]: 'а',
    [NIQQUD.HATAF_PATAH]: 'а', [NIQQUD.HATAF_QAMATS]: 'а',
    [NIQQUD.TSERE]: 'е', [NIQQUD.SEGOL]: 'е', [NIQQUD.HATAF_SEGOL]: 'е',
    [NIQQUD.HIRIQ]: 'и',
    [NIQQUD.HOLAM]: 'о', [NIQQUD.HOLAM_HASER]: 'о',
    [NIQQUD.QUBUTS]: 'у'
    // ШВА сюда не входит — обрабатывается отдельно (по умолчанию считаем немым)
  };

  // базовое звучание согласной (без дагеша)
  const CONSONANT_BASE = {
    'א': '', 'ב': 'в', 'ג': 'г', 'ד': 'д', 'ה': 'h', 'ו': 'в', 'ז': 'з',
    'ח': 'х', 'ט': 'т', 'י': 'й', 'כ': 'х', 'ך': 'х', 'ל': 'л', 'מ': 'м', 'ם': 'м',
    'נ': 'н', 'ן': 'н', 'ס': 'с', 'ע': '', 'פ': 'ф', 'ף': 'ф', 'צ': 'ц', 'ץ': 'ц',
    'ק': 'к', 'ר': 'р', 'ש': 'ш', 'ת': 'т'
  };
  // звучание с дагешем (только для тех букв, где оно реально меняет звук в иврите)
  const CONSONANT_DAGESH = { 'ב': 'б', 'כ': 'к', 'ך': 'к', 'פ': 'п', 'ף': 'п' };

  // разбивает слово с никудом на группы {letter, marks} — согласная + идущие
  // следом диакритики. Используется и транскрипцией, и распознаванием биньяна.
  function tokenizeNiqqud(word) {
    word = word.replace(/\|/g, '');
    const groups = [];
    let i = 0;
    while (i < word.length) {
      const ch = word[i];
      if (Object.prototype.hasOwnProperty.call(CONSONANT_BASE, ch)) {
        let marks = '';
        i++;
        while (i < word.length && /[\u0591-\u05BF\u05C1\u05C2\u05C7]/.test(word[i])) {
          marks += word[i];
          i++;
        }
        groups.push({ letter: ch, marks });
      } else {
        i++; // пропускаем кантилляцию/прочее, что нам не нужно
      }
    }
    return groups;
  }

  // niqqudToTranslit работает с целой фразой — разбивает её на отдельные
  // ивритские слова по пробелу, конвертирует каждое отдельно и склеивает
  // обратно с пробелом. Без этого пробел между словами "терялся" при
  // токенизации (он не согласная и не огласовка, просто пропускался).
  function niqqudToTranslit(text) {
    return text
      .split(/\s+/)
      .filter(Boolean)
      .map(convertSingleWord)
      .join(' ');
  }

  function convertSingleWord(word) {
    const groups = tokenizeNiqqud(word);

    let result = '';
    for (let idx = 0; idx < groups.length; idx++) {
      const { letter, marks } = groups[idx];
      const hasDagesh = marks.includes(NIQQUD.DAGESH);
      const isLast = idx === groups.length - 1;
      const vowelMark = Object.keys(VOWEL_MAP).find(v => marks.includes(v));

      // ===== ФУРТИВНЫЙ ПАТАХ (patach genuvah) =====
      // Когда слово оканчивается на гортанную (ח, ע, иногда ה) с патахом
      // после "не-а"-гласной, этот патах на самом деле произносится ПЕРЕД
      // согласной, а не после: רוּחַ = "руах", не "руха"; לִשְׁלוֹחַ = "лишлоах",
      // не "лишлоха". У ח согласная слышна (х), у ע/ה в конце слова она
      // практически беззвучна — остаётся только сама гласная "а".
      if (isLast && vowelMark === NIQQUD.PATAH && (letter === 'ח' || letter === 'ע' || letter === 'ה')) {
        result += 'а' + (letter === 'ח' ? 'х' : '');
        continue;
      }

      // финальная немая "ה" — всегда молчит, даже с мапиком (точка внутри,
      // формально означающая "здесь h всё-таки произносится", напр. לָהּ,
      // אוֹתָהּ). В разговорном современном иврите мапик практически никогда
      // не звучит вслух — это литургический/формальный остаток, а не то,
      // чему учит Tedabru, поэтому финальный ה немой без исключений.
      if (letter === 'ה' && isLast) {
        continue;
      }

      // ===== ВАВ: чаще всего это не согласная "в", а огласовка =====
      // холам мале (וֹ) = "о"; шурук (וּ, дагеш без отдельной гласной) = "у".
      // Настоящая согласная "в" — только когда вав действительно несёт свой
      // "обычный" гласный (патах/камац/еtc.) или стоит первой буквой слова
      // (чаще всего это приставка ве-/ва-).
      if (letter === 'ו') {
        if (marks.includes(NIQQUD.HOLAM) || marks.includes(NIQQUD.HOLAM_HASER)) {
          result += 'о';
          continue;
        }
        if (hasDagesh && !vowelMark) {
          result += 'у'; // шурук
          continue;
        }
        if (!vowelMark && !marks.includes(NIQQUD.SHVA) && idx !== 0) {
          continue; // немая "мать чтения" в середине/конце слова без огласовки
        }
        // иначе — настоящая согласная "в" (в т.ч. приставка ве-/ва-)
        let vowel = '';
        if (vowelMark) {
          vowel = VOWEL_MAP[vowelMark];
        } else if (marks.includes(NIQQUD.SHVA)) {
          if (idx === 0) {
            vowel = 'е';
          } else {
            vowel = ''; // немой шва — правило смягчения "ль" относится только к букве ламед
          }
        }
        result += 'в' + vowel;
        continue;
      }

      // ===== ЙУД как "мать чтения" (хирик мале) — не добавляет отдельного звука =====
      // Пропускаем ТОЛЬКО когда йуд продолжает хирик предыдущей буквы (долгое "и").
      // Если же йуд стоит без своей гласной перед чем-то другим (например перед
      // вав-холам, как в יוֹדֵעַ = "йодеа") — это настоящая согласная "й", не немая.
      if (letter === 'י' && !vowelMark && !hasDagesh) {
        const prevGroup = groups[idx - 1];
        // "мать чтения" бывает не только после хирика (хирик мале), но и
        // после цере (цере мале) — тот же принцип, другая долгая гласная:
        // לְהֵירָשֵׁם ("леhерашем") — йуд после цере тоже немой
        const isMaterLectionisContinuation = prevGroup &&
          (prevGroup.marks.includes(NIQQUD.HIRIQ) || prevGroup.marks.includes(NIQQUD.TSERE));
        if (isMaterLectionisContinuation) {
          continue;
        }
        // шва НА САМОМ йуде (а не мать чтения) — частый случай приставки
        // будущего времени יְ- (יְדַבֵּר "йедабер" — "он поговорит"). Без этого
        // шва проглатывалась, и согласная слипалась с "й" ("йдабер"). "е",
        // не "и" — той же логике, что и у остальных приставок этого же
        // спряжения (те-, не-, а-): шва озвучивается кратким "е".
        if (marks.includes(NIQQUD.SHVA)) {
          result += 'йе';
          continue;
        }
        result += 'й';
        continue;
      }

      let sound = hasDagesh && CONSONANT_DAGESH[letter] ? CONSONANT_DAGESH[letter] : CONSONANT_BASE[letter];

      // ш/с различаются точкой шин/син
      if (letter === 'ש') {
        sound = marks.includes(NIQQUD.SIN_DOT) ? 'с' : 'ш';
      }

      let vowel = '';
      if (vowelMark) {
        vowel = VOWEL_MAP[vowelMark];
      } else if (idx === 0 && marks.includes(NIQQUD.SHVA)) {
        // ШВА под самой первой буквой слова обычно озвучивается кратким "е"
        // (לְ- → "ле-", בְּ- → "бе-"), НО перед сонорными согласными (מ, נ, ר)
        // в разговорном иврите он почти всегда "проглатывается": שלושה →
        // "шлоша", не "шелоша"; שני → "шней", не "шеней". Это относится
        // только к случаям, когда САМА шва-носитель — НЕ сонорная согласная
        // (ש, כ и т.п.), а следующая — сонорная. Если же сама первая буква
        // тоже сонорная (מ, נ, ר, ל), проглатывание не происходит: מְנוֹרָה =
        // "менора", а не "мнора" — согласная+шва+согласная тут звучат как
        // отдельный слог, а не сливаются.
        const SONORANTS = ['ל', 'מ', 'נ', 'ר'];
        const nextGroup = groups[1];
        const nextIsSonorant = !SONORANTS.includes(letter) && nextGroup && SONORANTS.includes(nextGroup.letter);
        vowel = nextIsSonorant ? '' : 'е';
      } else if (letter !== 'ל' && marks.includes(NIQQUD.SHVA)) {
        // шва посреди слова перед йудом, у которого есть СВОЯ гласная
        // (типичный паттерн заимствований на -ция/-сия: סִימוּלַצְיָה, где
        // сама йуд озвучивается как "йа" по общему правилу) — если эту шва
        // не озвучить, согласная слипается с "й" в непроизносимый на письме
        // кусок ("цйа" вместо "ция"). Озвучиваем такую шва как "и".
        const nextGroup = groups[idx + 1];
        const nextIsYudWithOwnVowel = nextGroup && nextGroup.letter === 'י' &&
          Object.keys(VOWEL_MAP).some(v => nextGroup.marks.includes(v));
        vowel = nextIsYudWithOwnVowel ? 'и' : '';
      } else if (letter === 'ל') {
        // буква ламед (ל) без собственной гласной смягчается мягким знаком —
        // но только если она действительно "повисает" без огласовки (беззвучный
        // шва перед следующей согласной: лильмод, йальда; или в самом конце
        // слова: леhациль). Если же следующая буква — вав-холам/шурук, то
        // гласная "о"/"у" на самом деле принадлежит именно этому ламеду и
        // просто записана на следующей букве (שְׁלוֹשָׁה = "шлоша", не "шльоша") —
        // тогда смягчать не нужно, ламед остаётся просто согласной без "ь".
        const nextGroup = groups[idx + 1];
        const nextCarriesVowelForThis = nextGroup && nextGroup.letter === 'ו' &&
          (nextGroup.marks.includes(NIQQUD.HOLAM) || nextGroup.marks.includes(NIQQUD.HOLAM_HASER) ||
           (nextGroup.marks.includes(NIQQUD.DAGESH) && !Object.keys(VOWEL_MAP).some(v => nextGroup.marks.includes(v))));
        vowel = nextCarriesVowelForThis ? '' : 'ь';
      }

      // йуд + гласная = всегда "й" + чистая гласная (никогда я/ю/ё) — правило Tedabru
      if (letter === 'י' && vowel) {
        result += 'й' + vowel;
        continue;
      }

      // ===== Э vs Е в начале слова =====
      // "е" после согласной звучит мягко (как в "лес") — это верно для тех же
      // цере/сеголь после обычной согласной (לֶמֶד = "лемед"). Но если сама
      // первая буква слова беззвучна (א или ע без собственного звука) и несёт
      // цере/сеголь, никакой предшествующей согласной на самом деле нет — слово
      // фонетически начинается с чистого гласного (как русское "этот", а не
      // "его"), и его нужно передавать через "э": אֶלְמַד = "эльмад", а не "ельмад".
      if (idx === 0 && sound === '' && vowel === 'е') {
        vowel = 'э';
      }

      result += sound + vowel;
    }

    // Двойной йуд (геминация согласной, например дагеш на одном йуде сразу
    // перед другим йудом со своей гласной — לְסַיֵּים) в разговорном иврите не
    // звучит как два отдельных "й" подряд — это одна и та же согласная,
    // просто орфографически удвоенная. лесаййем → лесайем.
    result = result.replace(/йй+/g, 'й');

    return result || '?';
  }

  // ===== Распознавание биньяна по шаблону инфинитива (черновая эвристика) =====
  //
  // Предполагается, что слово вводится в форме инфинитива (как принято в
  // курсе Tedabru: לִכְתוֹב, לְקַבֵּל и т.д.). Пуаль и хуфаль сюда не входят —
  // у них нет формы инфинитива, поэтому глагол в инфинитиве может быть только
  // одним из пяти: пааль, пиэль, хифиль, нифаль, hитпаэль.
  //
  // ВАЖНО: это эвристика по внешнему виду огласовок, а не морфологический
  // анализ — пааль как биньян неоднороден (разные корни дают разный шаблон),
  // поэтому он используется как запасной вариант по умолчанию. Результат
  // всегда стоит проверять глазами, как и с транскрипцией.
  function detectBinyan(niqqudWord) {
    const groups = tokenizeNiqqud(niqqudWord);
    if (groups.length < 2 || groups[0].letter !== 'ל') return null; // не похоже на инфинитив

    const has = (marks, mark) => marks.includes(mark);
    const second = groups[1];

    // לְהִתְ... → hитпаэль
    if (second.letter === 'ה' && has(second.marks, NIQQUD.HIRIQ) &&
        groups[2] && groups[2].letter === 'ת') {
      return 'hитпаэль';
    }
    // לְהִ... (без ת следом) → нифаль
    if (second.letter === 'ה' && has(second.marks, NIQQUD.HIRIQ)) {
      return 'нифаль';
    }
    // לְהַ... → хифиль
    if (second.letter === 'ה' && has(second.marks, NIQQUD.PATAH)) {
      return 'хифиль';
    }
    // לְהוֹ... → хифиль (подтип с "слабой" первой корневой буквой: להודיע,
    // להוציא, להושיב — гласная "о" стоит не на самой ה, а на следующей ו)
    if (second.letter === 'ה' && groups[2] && groups[2].letter === 'ו' &&
        has(groups[2].marks, NIQQUD.HOLAM)) {
      return 'хифиль';
    }
    // дагеш + цере на одной и той же согласной (не первой и не последней) —
    // самая узнаваемая сигнатура пиэль (לְקַבֵּל, לְדַבֵּר)
    for (let i = 1; i < groups.length - 1; i++) {
      if (has(groups[i].marks, NIQQUD.DAGESH) && has(groups[i].marks, NIQQUD.TSERE)) {
        return 'пиэль';
      }
    }
    // ничего из вышеперечисленного — самый частый случай, пааль
    return 'пааль';
  }

  // ===== Распознавание части речи и рода по битовой маске "morph" =====
  //
  // Поле morph, которое Nakdan и так возвращает бесплатно с каждым запросом,
  // оказалось битовой маской, где отдельные биты устойчиво соответствуют
  // грамматическим категориям (проверено эмпирически на наборе тестовых слов,
  // официальной документации по расшифровке у Dicta нет):
  //   биты 18 И 17 вместе → существительное
  //   бит 16 (без 17)     → прилагательное
  //   бит 17 в одиночку (без 16 и без 18) → наречие
  //   бит 22              → женский род (для сущ./прил.)
  // Это тоже эвристика на ограниченной выборке — не официальный контракт API,
  // так что результат может не покрывать все случаи.
  function hasBit(morphStr, bit) {
    if (!morphStr) return false;
    try {
      return (BigInt(morphStr) & (1n << BigInt(bit))) !== 0n;
    } catch (e) {
      return false; // на случай неожиданного формата morph — просто не угадываем
    }
  }

  // ===== Распознавание биньяна по битам 51/52/53 в morph =====
  //
  // Проверено на семи глагольных формах (по одной на каждый биньян, включая
  // пуаль/хуфаль через причастие, раз у них нет инфинитива) — комбинация
  // этих трёх битов однозначно и без исключений соответствует биньяну:
  //   51            → пааль
  //   52            → нифаль
  //   51+52         → хифиль
  //   51+53         → пиэль
  //   52+53         → пуаль
  //   53            → хуфаль
  //   51+52+53      → hитпаэль
  // Это надёжнее прежней эвристики по написанию (которая ложно принимала за
  // глагол некоторые наречия вроде "леат") — здесь используется реальный
  // грамматический разбор Nakdan, а не угадывание по внешнему виду слова.
  function detectBinyanFromMorph(morphStr) {
    if (!morphStr) return null;
    const b51 = hasBit(morphStr, 51);
    const b52 = hasBit(morphStr, 52);
    const b53 = hasBit(morphStr, 53);

    if (b51 && !b52 && !b53) return 'пааль';
    if (!b51 && b52 && !b53) return 'нифаль';
    if (b51 && b52 && !b53) return 'хифиль';
    if (b51 && !b52 && b53) return 'пиэль';
    if (!b51 && b52 && b53) return 'пуаль';
    if (!b51 && !b52 && b53) return 'хуфаль';
    if (b51 && b52 && b53) return 'hитпаэль';
    return null; // ни одна из известных комбинаций не подошла — не глагол
  }

  function detectPosFromMorph(morphStr) {
    if (!morphStr) return null;
    // числительное (количественное) и местоимение проверяем ПЕРВЫМИ — они
    // используют тот же бит 16, что и прилагательное, но в других сочетаниях,
    // поэтому порядок проверки важен, иначе прилагательное перехватит их.
    const isCardinalNumeral = hasBit(morphStr, 16) && hasBit(morphStr, 17) && hasBit(morphStr, 18);
    const isPronoun = hasBit(morphStr, 16) && hasBit(morphStr, 19) &&
      !hasBit(morphStr, 17) && !hasBit(morphStr, 18);
    const isNoun = hasBit(morphStr, 18) && hasBit(morphStr, 17);
    const isAdjective = hasBit(morphStr, 16) && !hasBit(morphStr, 17);
    const isAdverb = hasBit(morphStr, 17) && !hasBit(morphStr, 16) && !hasBit(morphStr, 18);
    const isFeminine = hasBit(morphStr, 22);

    // порядковые числительные (ראשון и т.п.) отдельного кода не имеют —
    // Nakdan размечает их как обычное прилагательное, что грамматически
    // верно (они склоняются как прилагательные), так что правило isAdjective
    // уже подхватывает их само по себе.
    if (isCardinalNumeral) return 'числ';
    if (isPronoun) return 'местоим';
    if (isNoun) return isFeminine ? 'сущ, ж.р' : 'сущ, м.р';
    if (isAdjective) return 'прил';
    if (isAdverb) return 'нареч';
    return null; // не подошло ни под одну категорию — оставляем выбор пользователю
  }

  // ===== Gemini API: догадки написания иврита по транскрипции =====
  // Модель не обязана быть точной — она только предлагает "сырые" варианты
  // написания (без никуда), а проверяем их мы сами через уже отлаженный
  // пайплайн Nakdan + niqqudToTranslit, сравнивая с тем, что ввёл человек.
  const GEMINI_URL = 'https://tedabrutranscriptiongemini.3an3arah.workers.dev/';

  async function guessHebrewSpellings(transcription) {
    const response = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcription })
    });
    if (!response.ok) throw new Error('Gemini ответил ошибкой: ' + response.status);
    const json = await response.json();
    const rawText = json.candidates && json.candidates[0] && json.candidates[0].content
      && json.candidates[0].content.parts && json.candidates[0].content.parts[0]
      && json.candidates[0].content.parts[0].text;
    if (!rawText) return [];
    try {
      const arr = JSON.parse(rawText.trim());
      // убираем дубликаты, которые модель иногда выдаёт (как с "шлоша")
      return [...new Set(arr)];
    } catch (e) {
      return [];
    }
  }

  // мапик на финальной ה (например מַחְשָׁבָהּ "её мысль") транскрибируется
  // так же, как обычное слово без него (מַחְשָׁבָה "мысль") — специально, по
  // нашему правилу "финальная ה всегда немая". Но это значит, что дедупликация
  // по транскрипции+грамматике может случайно перепутать обычное слово с его
  // формой "+её/его" — используем этот признак ТОЛЬКО для различения при
  // дедупликации, не для отображения.
  function hasFinalMapiq(text) {
    return /ה\u05BC$/.test(text);
  }

  // сравнение "нестрого" — снимаем ударение, приводим к нижнему регистру,
  // убираем лишние пробелы. ВАЖНО: правила транслитерации Tedabru (й перед
  // гласной, мягкий знак у ламеда, латинская h) — это ТОЛЬКО наш внутренний
  // стандарт для подписи слов, ищущий человек им не обязан следовать, поэтому
  // при сравнении с чужим вводом эти особенности снимаем с обеих сторон.
  function normalizeForCompare(str) {
    return (str || '')
      .toLowerCase()
      .replace(/´|́/g, '')
      .replace(/h/g, '')
      .replace(/й(?=[аеиоуэ])/g, '') // "йелед" ищущий может ввести просто "елед"
      .replace(/ь/g, '') // "лильмод" ищущий может ввести просто "лилмод"
      .trim();
  }

  // расстояние Левенштейна — допускаем небольшую опечатку/расхождение,
  // а не требуем побуквенного совпадения
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = [];
    for (let i = 0; i <= m; i++) dp.push(new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
    }
    return dp[m][n];
  }

  function isFuzzyMatch(candidate, query) {
    const a = normalizeForCompare(candidate);
    const b = normalizeForCompare(query);
    if (a === b) return true;
    const maxLen = Math.max(a.length, b.length);
    const allowedDistance = maxLen <= 4 ? 1 : (maxLen <= 8 ? 2 : 3);
    return levenshtein(a, b) <= allowedDistance;
  }

  let searchGeneration = 0; // счётчик "поколений" запроса — защита от гонки

  // Общая логика обработки и отрисовки кандидатов — используется и мгновенным
  // словарным поиском (при вводе), и поиском через сеть (по кнопке). Отдельно
  // вынесено, чтобы не дублировать дедупликацию/фильтр мусора/рендер дважды.
  function renderCandidatesInto(resultsEl, rawCandidates) {
    if (!rawCandidates.length) {
      resultsEl.innerHTML = '';
      return false;
    }

    // объединяем карточки одного и того же слова с разными значениями в одну
    // (см. mergeCandidatesBySense) — настоящие разные синонимы с одинаковым
    // кратким переводом (רכב/מכונית/אוטו = все "автомобиль") не трогает, у
    // них разное написание/транскрипция, группировка идёт не по переводу
    const uniqueMatches = mergeCandidatesBySense(rawCandidates);

    // тот же признак мусора, что и раньше — перевод почти дословно
    // совпадает с транскрипцией самого слова. Актуально только для
    // API-фоллбэка (у словарных статей такого не бывает, они не
    // "придумываются" DeepL, а берутся из готового словаря).
    const looksLikeFallbackTransliteration = (m) => {
      if (!m.translation) return false;
      const a = normalizeForCompare(m.translation);
      const b = normalizeForCompare(m.translit);
      if (!a || !b) return false;
      return levenshtein(a, b) <= 1;
    };
    const containsLatinScript = (m) => /[a-zA-Z]/.test(m.translation || '');
    const isJunk = (m) => looksLikeFallbackTransliteration(m) || containsLatinScript(m);

    const hasGenuineTranslation = uniqueMatches.some(m => !isJunk(m));
    const visibleMatches = hasGenuineTranslation ? uniqueMatches.filter(m => !isJunk(m)) : uniqueMatches;
    const hiddenMatches = hasGenuineTranslation ? uniqueMatches.filter(m => isJunk(m)) : [];

    const rowHtml = (m) => {
      const existing = findExistingWordByHebrew(m.text);
      return `
      <button type="button" class="candidate-row ${existing ? 'already-added' : ''}">
        <div class="candidate-word">${m.text}</div>
        <div class="candidate-translit">/${m.translit}/</div>
        ${m.grammarLabel ? `<div class="candidate-grammar">${m.grammarLabel}</div>` : ''}
        ${m.translation ? `<div class="candidate-translation">${m.translation}</div>` : ''}
        ${existing ? `<div class="already-added-badge">${CHECK_ON_ICON}<span>уже добавлено</span></div>` : ''}
      </button>
    `;
    };

    resultsEl.innerHTML = visibleMatches.map(rowHtml).join('') + (hiddenMatches.length ? `
      <button type="button" class="global-search-btn" id="showHiddenBtn" style="margin:12px auto 0;">
        Скрытые результаты (${hiddenMatches.length})
      </button>
      <div id="hiddenResults" style="display:none;"></div>
    ` : '');

    const attachClickHandlers = (containerEl, list) => {
      containerEl.querySelectorAll('.candidate-row').forEach((row, i) => {
        row.addEventListener('click', () => {
          const m = list[i];
          // слово уже в справочнике — из результатов поиска повторно не
          // добавляем (галочка на карточке и так всё объясняет); изменить его
          // можно только через саму карточку слова в списке справочника
          if (findExistingWordByHebrew(m.text)) return;
          enterAddMode(m);
        });
      });
    };

    attachClickHandlers(resultsEl, visibleMatches);

    if (hiddenMatches.length) {
      document.getElementById('showHiddenBtn').addEventListener('click', (e) => {
        const hiddenEl = document.getElementById('hiddenResults');
        hiddenEl.innerHTML = hiddenMatches.map(rowHtml).join('');
        attachClickHandlers(hiddenEl, hiddenMatches);
        hiddenEl.style.display = 'block';
        e.target.remove();
      });
    }
    return true;
  }

  async function runGlobalTranscriptionSearch(query, btn) {
    const myGeneration = ++searchGeneration;
    const resultsEl = document.getElementById('globalSearchResults');
    btn.disabled = true;
    btn.textContent = 'Ищу среди вариантов написания...';
    resultsEl.innerHTML = '';

    // если пока этот запрос летал по сети, стартовал более новый запрос —
    // не даём устаревшему ответу перезаписать уже показанный свежий результат
    const isStale = () => myGeneration !== searchGeneration;

    try {
      const rawCandidates = await resolveCandidates(query);
      if (isStale()) return;
      console.log('[DEBUG] кандидаты от resolveCandidates:', rawCandidates.map(c => ({ text: c.text, source: c.source, translation: c.translation })));
      if (!rawCandidates.length) {
        resultsEl.innerHTML = '<div class="sugg-note">Не удалось найти это слово ни в словаре, ни через перевод.</div>';
        return;
      }
      if (isStale()) return; // за время запроса стартовал более новый поиск — не перезаписываем его результат
      renderCandidatesInto(resultsEl, rawCandidates);
    } catch (err) {
      if (!isStale()) resultsEl.innerHTML = `<div class="sugg-note">Не удалось выполнить поиск (${err.message}).</div>`;
    } finally {
      if (!isStale()) {
        btn.disabled = false;
        btn.textContent = `Искать среди всех слов иврита по транскрипции «${query}»`;
      }
    }
  }


  const nikkudSuggestion = document.getElementById('nikkudSuggestion');

  // сопоставляем grammarLabel (человекочитаемый, из словаря или от Nakdan)
  // со значением <select id="inputPos"> — форматы слегка расходятся
  // ("глагол, пааль" vs просто "пааль"), поэтому не полагаемся на точное
  // совпадение строки целиком
  function grammarLabelToPosValue(label) {
    if (!label) return null;
    if (label.startsWith('глагол, ')) {
      const binyan = label.slice('глагол, '.length);
      return binyan || null;
    }
    const direct = ['сущ, м.р', 'сущ, ж.р', 'прил', 'местоим', 'числ', 'нареч'];
    return direct.includes(label) ? label : null;
  }

  let metaSuggestGeneration = 0; // защита от гонки при живом наборе — устаревший ответ не перезаписывает более новый ввод
  let metaSuggestDebounceTimer = null;

  // Подбор меты по мере ввода — единственный способ вызвать её теперь
  // (кнопка "Подобрать мету" была не нужна: подсказки и так всплывают
  // вживую, см. подписку на 'input' на inputHebrew ниже)
  async function runMetaSuggestion(raw) {
    const myGeneration = ++metaSuggestGeneration;
    nikkudSuggestion.className = 'nikkud-suggestion';

    try {
      const candidates = await resolveCandidates(raw);
      if (myGeneration !== metaSuggestGeneration) return; // за время запроса ввод уже изменился

      if (!candidates.length) {
        nikkudSuggestion.classList.add('visible');
        nikkudSuggestion.innerHTML = '<div class="sugg-note">Не удалось найти это слово ни в словаре, ни через перевод.</div>';
        return;
      }

      // объединяем карточки одного и того же слова с разными значениями в одну
      // пронумерованную (см. mergeCandidatesBySense) — иначе одно и то же
      // слово ("матбеа" = и "монета", и "валюта") показывалось бы отдельными
      // карточками, из которых пришлось бы наугад выбирать одну для сохранения
      const uniqueCandidates = mergeCandidatesBySense(candidates);

      // при нечётком поиске по транскрипции (fuzzyMatchTranslitIndex) кандидатов
      // может быть по-настоящему много — все они "похожи" по расстоянию
      // Левенштейна, но за экраном без прокрутки нужного слова уже не видно.
      // Кандидаты уже отсортированы от наиболее к наименее вероятному, так что
      // просто показываем первые 5, а остальное отбрасываем
      const finalCandidates = uniqueCandidates.slice(0, 5);

      nikkudSuggestion.innerHTML = finalCandidates.map((c, i) => {
        const existing = findExistingWordByHebrew(c.text);
        return `
        <button type="button" class="candidate-row ${existing ? 'already-added' : ''}" data-index="${i}">
          <div class="candidate-word">${c.text}</div>
          <div class="candidate-translit">/${c.translit}/</div>
          ${c.grammarLabel ? `<div class="candidate-grammar">${c.grammarLabel}</div>` : ''}
          ${c.translation ? `<div class="candidate-translation">${c.translation}</div>` : ''}
          ${existing ? `<div class="already-added-badge">${CHECK_ON_ICON}<span>уже добавлено</span></div>` : ''}
        </button>
      `;
      }).join('') + (uniqueCandidates.length > finalCandidates.length ? `
        <div class="sugg-note" style="margin-top:8px;">Показаны 5 наиболее вероятных вариантов из ${uniqueCandidates.length}.</div>
      ` : '');
      nikkudSuggestion.classList.add('visible');

      nikkudSuggestion.querySelectorAll('.candidate-row').forEach((row, i) => {
        row.addEventListener('click', () => {
          const c = finalCandidates[i];
          inputHebrew.value = c.text;
          inputTranslit.value = c.translit;
          const posValue = grammarLabelToPosValue(c.grammarLabel);
          if (posValue) inputPos.value = posValue;
          if (c.translation) inputTranslation.value = c.translation;
          updateSaveState();
        });
      });
    } catch (err) {
      if (myGeneration !== metaSuggestGeneration) return;
      nikkudSuggestion.classList.add('visible', 'error');
      nikkudSuggestion.innerHTML = `
        <div class="sugg-note">
          Не удалось получить никуд автоматически (${err.message}).
          Возможно, сервер блокирует прямые запросы из браузера (CORS) — введите слово и транскрипцию вручную.
        </div>
      `;
    }
  }

  // ===== Встроенное добавление слова (без модалки) =====
  const addWordPanel = document.getElementById('addWordPanel');
  const inputHebrew = document.getElementById('searchInput'); // тот же инпут, что и обычный поиск
  const inputTranslit = document.getElementById('inputTranslit');
  const inputPos = document.getElementById('inputPos');
  const inputTranslation = document.getElementById('inputTranslation');
  const saveBtn = document.getElementById('saveBtn');

  // prefill (необязателен) — {text, translit, grammarLabel, translation}, тот
  // же формат, что и у кандидата из поиска: используется, когда входим в
  // режим добавления кликом по ещё не сохранённому слову в результатах поиска
  function enterAddMode(prefill) {
    if (selectionMode) return; // не пересекаемся с режимом выделения
    addMode = true;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = 'none';
    filterBarEl.style.display = 'none';
    wordListEl.style.display = 'none';
    addWordPanel.style.display = '';
    setBulkMode(false); // всегда открываемся в одиночном режиме
    bulkTargetCollectionId = null;
    bulkCreatingCollectionInline = false;
    renderBulkCollectionChips();
    inputHebrew.placeholder = 'Впишите слово, транскрипцию или перевод';
    inputHebrew.setAttribute('dir', 'rtl');
    clearTimeout(metaSuggestDebounceTimer);
    metaSuggestGeneration++; // инвалидируем любой ещё летящий запрос от прошлого раза
    nikkudSuggestion.classList.remove('visible', 'error');
    nikkudSuggestion.innerHTML = '';

    if (prefill) {
      inputHebrew.value = prefill.text || '';
      inputTranslit.value = prefill.translit || '';
      const posValue = grammarLabelToPosValue(prefill.grammarLabel);
      if (posValue) inputPos.value = posValue; else inputPos.selectedIndex = 0;
      inputTranslation.value = prefill.translation || '';
    } else {
      inputHebrew.value = '';
      inputTranslit.value = '';
      inputTranslation.value = '';
      inputPos.selectedIndex = 0;
      setTimeout(() => inputHebrew.focus(), 50);
    }
    updateSaveState();
  }

  function exitAddMode() {
    if (bulkAddRunning) return; // не выходим, пока идёт массовое добавление — сначала "Остановить"
    addMode = false;
    updateHeaderForSelectionMode();
    selectModeBtn.style.display = '';
    filterBarEl.style.display = '';
    wordListEl.style.display = '';
    addWordPanel.style.display = 'none';
    inputHebrew.placeholder = 'Слово, перевод или транскрипция';
    inputHebrew.removeAttribute('dir');
    clearTimeout(metaSuggestDebounceTimer);
    metaSuggestGeneration++;
    searchQuery = '';
    inputHebrew.value = '';
    renderFilterBar();
    renderList();
  }

  function updateSaveState() {
    const ready = inputHebrew.value.trim() && inputTranslation.value.trim();
    saveBtn.disabled = !ready;
  }

  [inputHebrew, inputTranslit, inputTranslation].forEach(el => {
    el.addEventListener('input', updateSaveState);
  });

  saveBtn.addEventListener('click', () => {
    const hebrewValue = inputHebrew.value.trim();
    const existing = findExistingWordByHebrew(hebrewValue);

    if (existing) {
      // слово с таким написанием уже есть в справочнике — обновляем его
      // на месте вместо того, чтобы завести дубликат; статус/избранное/
      // подборки уже существующего слова не трогаем (кроме явно выбранной
      // подборки в пикере ниже — её всё же добавляем)
      existing.translit = inputTranslit.value.trim();
      existing.pos = inputPos.value;
      existing.translation = inputTranslation.value.trim();
      if (bulkTargetCollectionId) {
        existing.collectionIds = existing.collectionIds || [];
        if (!existing.collectionIds.includes(bulkTargetCollectionId)) existing.collectionIds.push(bulkTargetCollectionId);
      }
    } else {
      const newWord = {
        id: Date.now(),
        hebrew: hebrewValue,
        translit: inputTranslit.value.trim(),
        pos: inputPos.value,
        translation: inputTranslation.value.trim(),
        status: 'active',
        favorite: false,
        collectionIds: bulkTargetCollectionId ? [bulkTargetCollectionId] : [],
        addedAt: Date.now()
      };
      words.unshift(newWord);
    }
    saveWords();
    exitAddMode();
    showToast(`Слово «${hebrewValue}» добавлено`);
  });

  // ===== Массовое добавление (несколько слов сразу) =====
  const toggleBulkModeBtn = document.getElementById('toggleBulkModeBtn');
  const singleAddFieldsEl = document.getElementById('singleAddFields');
  const bulkAddFieldsEl = document.getElementById('bulkAddFields');
  const bulkInputEl = document.getElementById('bulkInput');
  const bulkProgressEl = document.getElementById('bulkProgress');
  const bulkAddSubmitBtn = document.getElementById('bulkAddSubmitBtn');
  const bulkAddStopBtn = document.getElementById('bulkAddStopBtn');
  const bulkCollectionChipsEl = document.getElementById('bulkCollectionChips');

  let bulkMode = false;
  let bulkAddRunning = false;
  let bulkAddAborted = false;
  let bulkTargetCollectionId = null;      // в какую подборку класть добавляемые слова (необязательно)
  let bulkCreatingCollectionInline = false;

  function renderBulkCollectionChips() {
    bulkCollectionChipsEl.innerHTML = collections.map(c =>
      `<button type="button" class="chip ${bulkTargetCollectionId === c.id ? 'chip-selected' : ''}" data-bulk-coll="${c.id}">${c.name}</button>`
    ).join('') + (
      bulkCreatingCollectionInline
        ? `<input type="text" class="chip chip-input" id="bulkNewCollectionInput" placeholder="Название подборки" />`
        : `<button type="button" class="chip chip-icon-only" id="bulkNewCollectionChip" title="Новая подборка">${PLUS_ICON}</button>`
    );

    bulkCollectionChipsEl.querySelectorAll('[data-bulk-coll]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.bulkColl;
        bulkTargetCollectionId = (bulkTargetCollectionId === id) ? null : id; // повторный клик снимает выбор
        renderBulkCollectionChips();
      });
    });

    if (bulkCreatingCollectionInline) {
      const inlineInput = document.getElementById('bulkNewCollectionInput');
      inlineInput.focus();
      const finishInlineCreate = (commit) => {
        if (!bulkCreatingCollectionInline) return;
        bulkCreatingCollectionInline = false;
        if (commit) {
          const name = inlineInput.value.trim();
          if (name) {
            const nc = { id: 'c' + Date.now(), name: uniqueCollectionName(name) };
            collections.push(nc);
            saveCollections();
            bulkTargetCollectionId = nc.id; // сразу выбираем только что созданную
          }
        }
        renderBulkCollectionChips();
      };
      inlineInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') finishInlineCreate(true);
        else if (e.key === 'Escape') { e.stopPropagation(); finishInlineCreate(false); }
      });
      // blur коммитит (как и Enter), а не отменяет — та же причина, что и
      // в главном фильтр-баре: клик по "Добавить все" без явного Enter
      // раньше снимал фокус и тихо терял введённое имя подборки
      inlineInput.addEventListener('blur', () => finishInlineCreate(true));
    } else {
      document.getElementById('bulkNewCollectionChip').addEventListener('click', () => {
        bulkCreatingCollectionInline = true;
        renderBulkCollectionChips();
      });
    }
  }

  function setBulkMode(on) {
    bulkMode = on;
    singleAddFieldsEl.style.display = on ? 'none' : '';
    bulkAddFieldsEl.style.display = on ? '' : 'none';
    toggleBulkModeBtn.textContent = on ? 'Добавить одно слово' : 'Добавить несколько слов сразу';
    if (on) {
      bulkInputEl.value = '';
      bulkProgressEl.style.display = 'none';
      bulkAddSubmitBtn.style.display = '';
      bulkAddStopBtn.style.display = 'none';
      setTimeout(() => bulkInputEl.focus(), 50);
    }
  }

  toggleBulkModeBtn.addEventListener('click', () => setBulkMode(!bulkMode));

  bulkAddStopBtn.addEventListener('click', () => {
    bulkAddAborted = true;
    bulkProgressEl.textContent = 'Останавливаю после текущего слова…';
  });

  bulkAddSubmitBtn.addEventListener('click', async () => {
    // делим по пробелам/запятым/переносам строк — ровно как попросили;
    // убираем пустые токены и дубликаты (одно и то же слово дважды в
    // списке незачем гонять через API повторно)
    const tokens = [...new Set(
      bulkInputEl.value.split(/[\s,]+/).map(s => s.trim()).filter(Boolean)
    )];
    if (!tokens.length) return;

    bulkAddRunning = true;
    bulkAddAborted = false;
    bulkAddSubmitBtn.style.display = 'none';
    bulkAddStopBtn.style.display = '';
    bulkInputEl.disabled = true;
    bulkProgressEl.style.display = '';
    primaryActionBtn.style.opacity = '0.4';
    primaryActionBtn.style.pointerEvents = 'none';

    let added = 0, updated = 0;
    const failed = [];

    for (let i = 0; i < tokens.length; i++) {
      if (bulkAddAborted) break;
      const token = tokens[i];
      bulkProgressEl.textContent = `Обрабатываю ${i + 1} из ${tokens.length}: «${token}»…`;

      let best = null;
      try {
        const candidates = await resolveCandidates(token);
        best = candidates && candidates[0];
      } catch (err) {
        best = null;
      }

      if (!best || !best.text || !best.translation) {
        failed.push(token);
        continue;
      }

      const existing = findExistingWordByHebrew(best.text);
      if (existing) {
        existing.translit = best.translit || existing.translit;
        existing.pos = grammarLabelToPosValue(best.grammarLabel) || existing.pos;
        existing.translation = best.translation;
        if (bulkTargetCollectionId) {
          existing.collectionIds = existing.collectionIds || [];
          if (!existing.collectionIds.includes(bulkTargetCollectionId)) existing.collectionIds.push(bulkTargetCollectionId);
        }
        updated++;
      } else {
        words.unshift({
          id: Date.now() + i,
          hebrew: best.text,
          translit: best.translit || '',
          pos: grammarLabelToPosValue(best.grammarLabel) || 'сущ, м.р',
          translation: best.translation,
          status: 'active',
          favorite: false,
          collectionIds: bulkTargetCollectionId ? [bulkTargetCollectionId] : [],
          addedAt: Date.now()
        });
        added++;
      }
    }

    saveWords();
    bulkAddRunning = false;
    primaryActionBtn.style.opacity = '';
    primaryActionBtn.style.pointerEvents = '';
    bulkInputEl.disabled = false;
    bulkProgressEl.style.display = 'none';
    bulkAddSubmitBtn.style.display = '';
    bulkAddStopBtn.style.display = 'none';

    const summaryParts = [`добавлено: ${added}`, `обновлено: ${updated}`];
    if (failed.length) summaryParts.push(`не найдено: ${failed.length}`);
    const toastMessage = (bulkAddAborted ? 'Остановлено — ' : '') + summaryParts.join(', ');

    exitAddMode();
    showToast(toastMessage);
  });

  // ===== Первичный рендер =====
  renderFilterBar();
  renderList();
</script>

</body>
</html>
